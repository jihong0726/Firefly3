<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>UsTrip Finance v19.0</title>
  <style>
    :root{
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --stroke: #e2e8f0;
      --primary: #10b981;
      --accent-blue: #3b82f6;
      --accent-orange: #f97316;
      --danger: #ef4444;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }
    body.dark{
      --bg-body: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --stroke: #334155;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; background: var(--bg-body); color: var(--text-main); }
    
    /* 核心布局：Flex 纵向 */
    #app { display: flex; flex-direction: column; height: 100%; }
    
    /* 顶部固定 */
    .top { flex: 0 0 auto; padding: calc(12px + var(--safe-t)) 16px 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10; background: var(--bg-body); }
    .brand h1 { font-size: 20px; font-weight: 900; margin: 0; }
    .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--stroke); background: var(--bg-card); display: grid; place-items: center; cursor: pointer; color: var(--text-sub); }

    /* 中间滚动区 */
    .content { flex: 1; overflow-y: auto; padding: 10px 20px 20px; position: relative; }
    
    /* 底部固定区 (Tab + Kbd) */
    .bottom { flex: 0 0 auto; background: var(--bg-card); border-top: 1px solid var(--stroke); padding-bottom: var(--safe-b); z-index: 20; position: relative; }

    /* 卡片通用样式 */
    .card { background: var(--bg-card); border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); border: 1px solid var(--stroke); margin-bottom: 16px; }
    .hero-card { background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border: none; }
    .hero-val { font-size: 42px; font-weight: 900; margin: 10px 0; font-family: monospace; letter-spacing: -1px; }
    
    /* 快捷按钮 */
    .quick-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .action-btn { background: var(--bg-card); border: 1px solid var(--stroke); padding: 16px; border-radius: 20px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: transform 0.1s; }
    .action-btn:active { transform: scale(0.98); }
    .ab-icon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; }
    
    /* 列表项 */
    .list-item { 
      background: var(--bg-card); border: 1px solid var(--stroke); border-radius: 16px; padding: 14px; margin-bottom: 10px; 
      display: flex; justify-content: space-between; align-items: center; position: relative; overflow: hidden;
    }
    /* PC端操作按钮 (默认隐藏) */
    .pc-actions { position: absolute; right: 10px; display: none; gap: 8px; background: var(--bg-card); padding-left: 10px; }
    @media (hover: hover) {
      .list-item:hover .pc-actions { display: flex; }
    }
    .mini-btn { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; color: white; font-size: 14px; }
    .btn-pin { background: #eab308; }
    .btn-del { background: #ef4444; }

    /* 底部键盘 & Tab */
    .tab-bar { display: flex; justify-content: space-around; padding: 12px 0; }
    .tab-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-sub); font-size: 10px; font-weight: bold; cursor: pointer; }
    .tab-item.active { color: var(--primary); }
    
    .kbd-wrap { display: none; padding: 0 10px 10px; }
    .kbd-wrap.show { display: block; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .key { height: 60px; border-radius: 16px; border: none; font-size: 22px; font-weight: bold; cursor: pointer; background: var(--bg-body); color: var(--text-main); box-shadow: 0 2px 0 var(--stroke); }
    .key:active { transform: translateY(2px); box-shadow: none; }
    .k-func { color: var(--danger); background: #fee2e2; }
    .k-op { color: var(--accent-blue); background: #dbeafe; }
    .k-eq { grid-row: span 2; height: 100%; background: var(--primary); color: white; }

    /* 🟢 计算器页面特定样式 */
    .calc-view { display: flex; flex-direction: column; height: 100%; }
    .calc-screen { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 20px; text-align: right; }
    .calc-input { font-size: 56px; font-weight: 900; line-height: 1; margin: 0; word-break: break-all; }
    .calc-result { background: var(--primary); color: white; padding: 16px; border-radius: 20px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 10px 20px -5px rgba(16, 185, 129, 0.4); }
    .calc-result:active { transform: scale(0.98); }

    /* 🟢 弹窗样式 */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; place-items: center; backdrop-filter: blur(4px); }
    .modal-backdrop.show { display: grid; }
    .modal { background: var(--bg-card); width: 90%; max-width: 400px; border-radius: 28px; padding: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); animation: popUp 0.2s ease-out; }
    @keyframes popUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 20px; font-weight: 900; }
    
    /* 🌟 新版输入框 (Input Group) */
    .input-group { background: var(--bg-body); border-radius: 16px; padding: 8px; display: flex; align-items: center; margin-bottom: 12px; border: 2px solid transparent; transition: 0.2s; }
    .input-group:focus-within { background: var(--bg-card); border-color: var(--accent-blue); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); }
    .input-group.orange:focus-within { border-color: var(--accent-orange); box-shadow: 0 4px 12px rgba(249, 115, 22, 0.15); }
    
    .real-input { flex: 1; border: none; background: transparent; font-size: 28px; font-weight: 900; outline: none; color: var(--text-main); min-width: 0; }
    
    /* 切换按钮 */
    .switch-btn { padding: 8px 16px; border-radius: 12px; font-weight: bold; font-size: 14px; cursor: pointer; user-select: none; transition: 0.1s; display: flex; align-items: center; gap: 4px; color: white; border: none; }
    .switch-btn:active { transform: scale(0.95); }
    .btn-blue { background: var(--accent-blue); box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3); }
    .btn-orange { background: var(--accent-orange); box-shadow: 0 4px 10px rgba(249, 115, 22, 0.3); }

    .full-btn { width: 100%; padding: 16px; border-radius: 16px; background: var(--text-main); color: var(--bg-card); border: none; font-size: 16px; font-weight: 900; margin-top: 10px; cursor: pointer; }
    
    /* 汇率卡片 */
    .rate-card { background: var(--bg-body); padding: 12px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .rate-input { width: 80px; background: var(--bg-card); border: 1px solid var(--stroke); border-radius: 8px; padding: 4px 8px; font-weight: bold; text-align: center; }

    /* 开销分类 */
    .cat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 16px; }
    .cat-item { aspect-ratio: 1; background: var(--bg-body); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; border: 1px solid transparent; }
    .cat-item.active { background: #eef2ff; border-color: var(--accent-blue); color: var(--accent-blue); }
    .cat-icon { font-size: 24px; margin-bottom: 4px; }
    .cat-name { font-size: 10px; font-weight: bold; }

    /* 历史胶囊 */
    .hist-pill { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: var(--bg-card); border: 1px solid var(--stroke); padding: 6px 16px; border-radius: 99px; font-size: 12px; font-weight: bold; cursor: pointer; z-index: 5; box-shadow: 0 4px 10px rgba(0,0,0,0.05); display: flex; align-items: center; gap: 6px; }
  </style>
</head>
<body>

<div id="app">
  <div class="top">
    <div class="brand">
      <h1 id="pageTitle">我的金库</h1>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="icon-btn" onclick="app.toggleTheme()">🌓</button>
      <button class="icon-btn" onclick="app.exportData()">📥</button>
      <input type="file" id="fileInput" hidden onchange="app.importData(this)">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📤</button>
    </div>
  </div>

  <div class="content" id="contentArea">
    </div>

  <div class="bottom">
    <div class="kbd-wrap" id="kbdArea">
      <div class="hist-pill" onclick="app.toggleHistoryModal()">
        <span>📜 历史记录</span>
      </div>
      <div class="calc-grid">
        <button class="key k-func" onclick="app.key('AC')">AC</button>
        <button class="key k-func" onclick="app.key('DEL')">⌫</button>
        <button class="key k-op" onclick="app.key('%')">%</button>
        <button class="key k-op" onclick="app.key('/')">÷</button>
        <button class="key" onclick="app.key('7')">7</button>
        <button class="key" onclick="app.key('8')">8</button>
        <button class="key" onclick="app.key('9')">9</button>
        <button class="key k-op" onclick="app.key('*')">×</button>
        <button class="key" onclick="app.key('4')">4</button>
        <button class="key" onclick="app.key('5')">5</button>
        <button class="key" onclick="app.key('6')">6</button>
        <button class="key k-op" onclick="app.key('-')">−</button>
        <button class="key" onclick="app.key('1')">1</button>
        <button class="key" onclick="app.key('2')">2</button>
        <button class="key" onclick="app.key('3')">3</button>
        <button class="key k-op" onclick="app.key('+')">+</button>
        <button class="key" onclick="app.key('0')">0</button>
        <button class="key" onclick="app.key('00')">00</button>
        <button class="key" onclick="app.key('.')">.</button>
        <button class="key k-eq" onclick="app.key('=')">=</button>
      </div>
    </div>

    <div class="tab-bar">
      <div class="tab-item" id="tab-assets" onclick="app.switchTab('assets')">
        <span style="font-size:20px">👛</span>
        <span>金库</span>
      </div>
      <div class="tab-item" id="tab-calc" onclick="app.switchTab('calc')">
        <span style="font-size:20px">🔢</span>
        <span>换算</span>
      </div>
    </div>
  </div>
</div>

<div id="modalBackdrop" class="modal-backdrop" onclick="if(event.target===this) app.closeModal()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">标题</div>
      <div class="icon-btn" onclick="app.closeModal()">✕</div>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const app = {
  data: {
    tab: 'assets',
    theme: 'light',
    history: [],
    records: [],
    rate: 12.63, // 100 TWD = x MYR (Jags)
    calcInput: '0',
    calcExpr: '',
    modalType: null,
    // 临时状态
    exMode: 'MYR', // 'MYR' or 'TWD'
    exAmount: '',
    expCat: 0,
    expAmount: ''
  },
  cats: [
    {n:'饮食',i:'🍔'},{n:'交通',i:'🚗'},{n:'购物',i:'🛍️'},{n:'娱乐',i:'🎮'},{n:'住宿',i:'🏨'},
    {n:'零食',i:'🍦'},{n:'礼物',i:'🎁'},{n:'医疗',i:'💊'},{n:'生活',i:'💡'},{n:'其他',i:'📦'}
  ],

  init() {
    const saved = localStorage.getItem('ustrip_v19');
    if (saved) {
      const p = JSON.parse(saved);
      this.data = { ...this.data, ...p };
    }
    // 补全ID防止旧数据报错
    this.data.history.forEach(r => { if(!r.id) r.id = Date.now() + Math.random(); });
    this.data.records.forEach(r => { if(!r.id) r.id = Date.now() + Math.random(); });
    
    this.applyTheme();
    this.switchTab(this.data.tab);
  },

  save() {
    localStorage.setItem('ustrip_v19', JSON.stringify(this.data));
    this.render();
  },

  applyTheme() {
    document.body.className = this.data.theme;
  },

  toggleTheme() {
    this.data.theme = this.data.theme === 'light' ? 'dark' : 'light';
    this.applyTheme();
    this.save();
  },

  switchTab(tab) {
    this.data.tab = tab;
    document.getElementById('pageTitle').innerText = tab === 'assets' ? '我的金库' : '汇率计算';
    document.getElementById('tab-assets').className = `tab-item ${tab==='assets'?'active':''}`;
    document.getElementById('tab-calc').className = `tab-item ${tab==='calc'?'active':''}`;
    
    document.getElementById('kbdArea').className = `kbd-wrap ${tab==='calc'?'show':''}`;
    this.render();
  },

  // 核心渲染逻辑
  render() {
    const area = document.getElementById('contentArea');
    if (this.data.tab === 'assets') {
      this.renderAssets(area);
    } else {
      this.renderCalc(area);
    }
  },

  renderAssets(el) {
    const totalIn = this.data.records.filter(r=>r.type==='in').reduce((a,b)=>a+b.twd,0);
    const totalOut = this.data.records.filter(r=>r.type==='out').reduce((a,b)=>a+b.twd,0);
    const balance = totalIn - totalOut;
    
    // 排序：时间倒序
    const listHtml = this.data.records.sort((a,b)=>b.id-a.id).map(r => `
      <div class="list-item">
        <div>
          <div style="font-weight:bold; font-size:16px;">${r.title}</div>
          <div style="font-size:12px; color:var(--text-sub); margin-top:4px;">${new Date(r.id).toLocaleDateString()} ${r.sub||''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:900; font-size:18px; color:${r.type==='in'?'var(--primary)':'var(--text-main)'}">
            ${r.type==='in'?'+':'-'}${r.twd.toFixed(2)}
          </div>
          <div style="font-size:12px; color:var(--text-sub);">${r.rm ? 'RM '+r.rm : ''}</div>
        </div>
        <div class="pc-actions">
          <div class="mini-btn btn-del" onclick="app.delRecord(${r.id})">✕</div>
        </div>
      </div>
    `).join('');

    el.innerHTML = `
      <div class="card hero-card">
        <div style="font-size:12px; opacity:0.8; font-weight:bold;">台币剩余 (TWD)</div>
        <div class="hero-val">${balance.toFixed(2)}</div>
        <div style="display:flex; gap:20px; font-size:12px; opacity:0.8;">
          <span>总存入: ${totalIn.toFixed(0)}</span>
          <span>总开销: ${totalOut.toFixed(0)}</span>
        </div>
      </div>
      
      <div class="quick-actions">
        <div class="action-btn" onclick="app.openExchangeModal()">
          <div class="ab-icon" style="background:#dbeafe; color:#2563eb">💱</div>
          <div style="font-weight:bold">存入资金</div>
        </div>
        <div class="action-btn" onclick="app.openExpenseModal()">
          <div class="ab-icon" style="background:#ffedd5; color:#ea580c">💸</div>
          <div style="font-weight:bold">记录开销</div>
        </div>
      </div>

      <div style="padding-bottom:20px">${listHtml || '<div style="text-align:center; color:var(--text-sub); padding:20px;">暂无记录</div>'}</div>
    `;
  },

  renderCalc(el) {
    const rate = this.getRate();
    const twd = parseFloat(this.safeEval(this.data.calcInput));
    const rm = (twd / rate).toFixed(2);

    el.innerHTML = `
      <div class="calc-view">
        <div class="calc-screen">
          <div style="color:var(--text-sub); font-size:14px; margin-bottom:10px;">
            ${this.data.calcExpr}
          </div>
          <div class="calc-input">${this.data.calcInput} <span style="font-size:20px; color:var(--text-sub)">TWD</span></div>
          
          <div class="calc-result" onclick="app.saveCalcResult()">
            <div>
              <div style="font-size:12px; opacity:0.9;">折合马币 (Rate: ${rate.toFixed(3)})</div>
              <div style="font-size:32px; font-weight:900; font-family:monospace;">${rm} <span style="font-size:16px">MYR</span></div>
            </div>
            <div style="font-size:24px">📥</div>
          </div>
        </div>
      </div>
    `;
  },

  // 逻辑处理
  key(k) {
    if(k==='AC') { this.data.calcInput='0'; this.data.calcExpr=''; }
    else if(k==='DEL') { this.data.calcInput = this.data.calcInput.length>1 ? this.data.calcInput.slice(0,-1) : '0'; }
    else if(k==='=') {
      const res = this.safeEval(this.data.calcInput);
      this.data.calcInput = String(parseFloat(res.toFixed(4)));
      this.data.calcExpr = '';
    }
    else {
      if(['+','-','*','/','%'].includes(k)) {
        this.data.calcExpr = this.data.calcInput;
        this.data.calcInput += k;
      } else {
        this.data.calcInput = (this.data.calcInput==='0' && k!=='.') ? k : this.data.calcInput+k;
      }
    }
    this.save();
  },

  safeEval(str) {
    try { return new Function('return '+str)() || 0; } catch { return 0; }
  },

  getRate() {
    return (100 / this.data.rate); // 100 TWD = 12.63 MYR -> 1 MYR = 7.91 TWD
  },

  saveCalcResult() {
    const twd = parseFloat(this.safeEval(this.data.calcInput));
    if(!twd) return;
    const rate = this.getRate();
    const rm = (twd/rate).toFixed(2);
    this.data.history.unshift({
      id: Date.now(),
      twd: twd.toFixed(2),
      rm: rm,
      rate: rate.toFixed(3),
      pinned: false
    });
    this.data.calcInput = '0';
    this.save();
    alert('已保存到历史记录');
  },

  // 模态框逻辑
  openModal(type, title, html) {
    this.data.modalType = type;
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalBody').innerHTML = html;
    document.getElementById('modalBackdrop').className = 'modal-backdrop show';
  },
  
  closeModal() {
    document.getElementById('modalBackdrop').className = 'modal-backdrop';
  },

  // 1. 存入资金弹窗 (优化版)
  openExchangeModal() {
    this.data.exMode = 'MYR';
    this.data.exAmount = '';
    const render = () => {
      const mode = this.data.exMode;
      const val = parseFloat(this.data.exAmount) || 0;
      let resText = '0.00';
      const r = this.getRate(); // TWD per MYR
      
      if(mode === 'MYR') resText = (val * r).toFixed(0); // MYR -> TWD
      else resText = (val / r).toFixed(2); // TWD -> MYR

      return `
        <div class="rate-card">
          <div><div style="font-size:10px; font-weight:bold; color:var(--text-sub);">JAGS RATE (100 TWD)</div></div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input class="rate-input" type="number" value="${this.data.rate}" oninput="app.data.rate=parseFloat(this.value)||1; app.refreshModal()">
            <span style="font-size:12px; font-weight:bold;">MYR</span>
          </div>
        </div>

        <div style="margin-bottom:8px; font-size:12px; font-weight:bold; color:var(--text-sub);">输入金额</div>
        
        <div class="input-group ${mode==='TWD'?'orange':''}">
          <input type="number" class="real-input" placeholder="0" value="${this.data.exAmount}" oninput="app.data.exAmount=this.value; app.refreshModal()" autofocus>
          <button class="switch-btn ${mode==='MYR'?'btn-blue':'btn-orange'}" onclick="app.toggleExMode()">
            ${mode} ⇄
          </button>
        </div>

        <div class="card" style="padding:12px; margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; font-weight:bold; color:var(--text-sub);">自动换算为</span>
          <span style="font-size:20px; font-weight:900; color:${mode==='MYR'?'var(--accent-orange)':'var(--accent-blue)'}">
            ${resText} <span style="font-size:12px;">${mode==='MYR'?'TWD':'MYR'}</span>
          </span>
        </div>

        <button class="full-btn" onclick="app.submitExchange()">确认存入</button>
      `;
    };
    this.openModal('exchange', '存入资金', render());
  },

  toggleExMode() {
    this.data.exMode = this.data.exMode === 'MYR' ? 'TWD' : 'MYR';
    this.data.exAmount = ''; // 切换清空
    this.refreshModal();
  },

  refreshModal() {
    if(this.data.modalType === 'exchange') {
      document.getElementById('modalBody').innerHTML = this.getExchangeHtml();
      // 保持聚焦
      document.querySelector('.real-input').focus();
    }
  },
  
  // 辅助函数：重新生成HTML (闭包引用问题，还是得重新写一遍或拆分)
  getExchangeHtml() {
      // 复用上面的 render 逻辑
      const mode = this.data.exMode;
      const val = parseFloat(this.data.exAmount) || 0;
      let resText = '0.00';
      const r = this.getRate(); 
      if(mode === 'MYR') resText = (val * r).toFixed(0); 
      else resText = (val / r).toFixed(2);

      return `
        <div class="rate-card">
          <div><div style="font-size:10px; font-weight:bold; color:var(--text-sub);">JAGS RATE (100 TWD)</div></div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input class="rate-input" type="number" value="${this.data.rate}" oninput="app.data.rate=parseFloat(this.value)||1; app.refreshModal()">
            <span style="font-size:12px; font-weight:bold;">MYR</span>
          </div>
        </div>
        <div style="margin-bottom:8px; font-size:12px; font-weight:bold; color:var(--text-sub);">输入金额</div>
        <div class="input-group ${mode==='TWD'?'orange':''}">
          <input type="number" class="real-input" placeholder="0" value="${this.data.exAmount}" oninput="app.data.exAmount=this.value; app.refreshModal()">
          <button class="switch-btn ${mode==='MYR'?'btn-blue':'btn-orange'}" onclick="app.toggleExMode()">
            ${mode} ⇄
          </button>
        </div>
        <div class="card" style="padding:12px; margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:12px; font-weight:bold; color:var(--text-sub);">自动换算为</span>
          <span style="font-size:20px; font-weight:900; color:${mode==='MYR'?'var(--accent-orange)':'var(--accent-blue)'}">
            ${resText} <span style="font-size:12px;">${mode==='MYR'?'TWD':'MYR'}</span>
          </span>
        </div>
        <button class="full-btn" onclick="app.submitExchange()">确认存入</button>
      `;
  },

  submitExchange() {
    const val = parseFloat(this.data.exAmount);
    if(!val) return;
    const r = this.getRate();
    let twd = 0, rm = 0;
    
    if(this.data.exMode === 'MYR') {
      rm = val;
      twd = Math.round(val * r);
    } else {
      twd = val;
      rm = (val / r).toFixed(2);
    }

    this.data.records.unshift({
      id: Date.now(),
      type: 'in',
      title: '存入资金',
      twd: twd,
      rm: rm,
      sub: `Rate: ${this.data.rate}`
    });
    this.save();
    this.closeModal();
  },

  // 2. 开销弹窗
  openExpenseModal() {
    this.data.expCat = 0;
    this.data.expAmount = '';
    const render = () => {
      const catsHtml = this.cats.map((c, i) => `
        <div class="cat-item ${this.data.expCat===i?'active':''}" onclick="app.data.expCat=${i}; app.refreshExpenseModal()">
          <div class="cat-icon">${c.i}</div>
          <div class="cat-name">${c.n}</div>
        </div>
      `).join('');

      return `
        <div style="margin-bottom:8px; font-size:12px; font-weight:bold; color:var(--text-sub);">选择分类</div>
        <div class="cat-grid">${catsHtml}</div>
        
        <div style="margin-bottom:8px; font-size:12px; font-weight:bold; color:var(--text-sub);">金额 (TWD)</div>
        <div class="input-group orange">
          <input type="number" id="expInput" class="real-input" placeholder="0" value="${this.data.expAmount}" oninput="app.data.expAmount=this.value" autofocus>
          <span style="font-weight:900; color:var(--accent-orange)">TWD</span>
        </div>
        <button class="full-btn" onclick="app.submitExpense()">确认记账</button>
      `;
    };
    this.openModal('expense', '记录开销', render());
  },

  refreshExpenseModal() {
    // 简单重绘，保持输入值
    const val = document.getElementById('expInput') ? document.getElementById('expInput').value : this.data.expAmount;
    this.data.expAmount = val;
    this.openExpenseModal(); 
  },

  submitExpense() {
    const val = parseFloat(this.data.expAmount);
    if(!val) return;
    const cat = this.cats[this.data.expCat];
    
    this.data.records.unshift({
      id: Date.now(),
      type: 'out',
      title: `${cat.i} ${cat.n}`,
      twd: val
    });
    this.save();
    this.closeModal();
  },

  // 3. 历史记录弹窗 (支持 PC Hover)
  toggleHistoryModal() {
    // 排序：置顶在前，然后按时间
    const list = this.data.history.sort((a,b) => {
      if(a.pinned && !b.pinned) return -1;
      if(!a.pinned && b.pinned) return 1;
      return b.id - a.id;
    });

    const html = list.length ? list.map(r => `
      <div class="list-item">
        <div>
          <div style="font-weight:bold; font-size:14px; display:flex; align-items:center; gap:6px;">
            ${r.pinned ? '📌' : ''} ${r.note || '未备注'}
          </div>
          <div style="font-size:11px; color:var(--text-sub); margin-top:2px;">
            ${r.twd} TWD (Rate ${r.rate})
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:900; font-size:16px; color:var(--primary)">${r.rm} MYR</div>
        </div>
        
        <div class="pc-actions">
          <div class="mini-btn btn-pin" onclick="app.togglePin(${r.id})">🔝</div>
          <div class="mini-btn btn-del" onclick="app.delHistory(${r.id})">✕</div>
        </div>
      </div>
    `).join('') : '<div style="text-align:center; padding:20px; color:var(--text-sub);">暂无历史</div>';

    const body = `
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-bottom:10px;">
        <button onclick="app.clearHistory()" style="background:none; border:none; color:var(--danger); font-size:12px; font-weight:bold; cursor:pointer;">清空历史</button>
      </div>
      <div style="max-height:60vh; overflow-y:auto;">${html}</div>
    `;
    
    this.openModal('history', '历史记录', body);
  },

  togglePin(id) {
    const item = this.data.history.find(r=>r.id===id);
    if(item) item.pinned = !item.pinned;
    this.save();
    this.toggleHistoryModal(); // 刷新
  },

  delHistory(id) {
    this.data.history = this.data.history.filter(r=>r.id!==id);
    this.save();
    this.toggleHistoryModal();
  },
  
  delRecord(id) {
    if(confirm('确定删除?')) {
      this.data.records = this.data.records.filter(r=>r.id!==id);
      this.save();
    }
  },

  clearHistory() {
    if(confirm('清空所有历史?')) {
      this.data.history = [];
      this.save();
      this.toggleHistoryModal();
    }
  },

  exportData() {
    const blob = new Blob([JSON.stringify(this.data)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ustrip_backup.json';
    a.click();
  },
  
  importData(input) {
    const file = input.files[0];
    if(!file) return;
    const r = new FileReader();
    r.onload = e => {
      try {
        const d = JSON.parse(e.target.result);
        this.data = d;
        this.save();
        alert('导入成功');
      } catch { alert('文件格式错误'); }
    };
    r.readAsText(file);
  }
};

// 启动
app.init();
</script>
</body>
</html>
