<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>UsTrip Finance v20.2</title>
<style>
/* --- 基础设置 --- */
:root {
  --bg: #f8fafc; --text: #0f172a; --card-bg: #ffffff; --border: #e2e8f0;
  --primary: #10b981; --accent-blue: #3b82f6; --accent-orange: #f97316; --danger: #ef4444;
  --safe-b: env(safe-area-inset-bottom);
}
body.dark {
  --bg: #0f172a; --text: #f1f5f9; --card-bg: #1e293b; --border: #334155;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

/* --- 布局容器 --- */
#app { display: flex; flex-direction: column; height: 100%; position: relative; max-width: 500px; margin: 0 auto; background: var(--bg); box-shadow: 0 0 50px rgba(0,0,0,0.1); }

/* Header */
.header {
  flex: 0 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; background: var(--bg);
}
.header h1 { font-size: 20px; margin: 0; font-weight: 900; }
.btn-icon {
  width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--card-bg);
  display: flex; justify-content: center; align-items: center; cursor: pointer; color: var(--text); font-size: 16px;
}

/* 内容区 */
.main { flex: 1; position: relative; overflow: hidden; }
.page {
  position: absolute; inset: 0; display: none; flex-direction: column;
  padding: 0 16px 16px; overflow-y: auto; overflow-x: hidden;
}
.page.active { display: flex; }

/* --- 页面 1: 金库 (Assets) --- */
/* 给金库页单独加 padding-top，因为 header 是透明/固定的 */
#page-assets { padding-top: 10px; }

.card {
  background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border-radius: 24px; padding: 24px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1); margin-bottom: 20px; flex-shrink: 0;
}
.card-val { font-size: 42px; font-weight: 800; margin: 10px 0; letter-spacing: -1px; }
.card-sub { font-size: 12px; opacity: 0.7; display: flex; gap: 16px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; flex-shrink: 0; }
.btn-lg {
  background: var(--card-bg); border: 1px solid var(--border); padding: 16px; border-radius: 20px;
  display: flex; align-items: center; gap: 12px; font-weight: bold; cursor: pointer;
}
.btn-lg:active { transform: scale(0.98); }
.icon-box { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; }

.list-wrapper { padding-bottom: 100px; }
.list-item {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 14px;
  margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;
}
.list-item .left { display: flex; align-items: center; gap: 12px; }
.list-item .emoji { font-size: 20px; width: 32px; text-align: center; }

/* --- 页面 2: 换算 (Calc) - 布局彻底修复 --- */
/* 使用 flex column，中间 scroll，底部 fixed */
.calc-layout { display: flex; flex-direction: column; height: 100%; }

/* 上半部分：汇率+卡片+保存条 (可滚动，防溢出) */
.calc-top-section {
  flex: 1; 
  overflow-y: auto; 
  padding-bottom: 10px;
  display: flex; 
  flex-direction: column;
}

.pillRow {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
  padding-top: 4px; flex-shrink: 0;
}
.ratePill {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px;
  border-radius: 99px; border: 1px solid var(--border); background: var(--card-bg);
  font-weight: bold; font-size: 13px; color: var(--text);
}
.ratePill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.pillBtn {
  cursor: pointer; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--border);
  background: var(--card-bg); font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 6px;
}

/* 换算卡片 */
.exchange-card-wrap {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; flex-shrink: 0;
}
.io-card {
  border: 1px solid var(--border); border-radius: 20px; padding: 16px;
  display: flex; flex-direction: column; justify-content: space-between; height: 130px;
  background: var(--card-bg); position: relative; overflow: hidden;
}
.io-card.in { background: linear-gradient(135deg, rgba(59,130,246,0.08), rgba(255,255,255,0.8)); }
.io-card.out { background: linear-gradient(135deg, rgba(16,185,129,0.08), rgba(255,255,255,0.8)); }
.dark .io-card.in { background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(30,41,59,0.5)); }
.dark .io-card.out { background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(30,41,59,0.5)); }

.io-label { font-size: 12px; font-weight: 800; color: #64748b; margin-bottom: 4px; }
.io-val { font-size: 32px; font-weight: 800; line-height: 1.1; word-break: break-all; }
.io-unit { font-size: 14px; font-weight: 800; color: #94a3b8; margin-top: 4px; }

/* 保存条 */
.save-bar {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px;
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; flex-shrink: 0;
}
.save-hint { font-size: 12px; font-weight: bold; color: #94a3b8; }
.btn-save {
  background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 12px;
  font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px;
}
.btn-save:active { transform: scale(0.95); }

/* 键盘区域 (固定在底部) */
.keyboard-wrap {
  flex: 0 0 auto; /* 不许压缩 */
  background: #f1f5f9; border-top-left-radius: 28px; border-top-right-radius: 28px;
  padding: 16px; 
  padding-bottom: 10px;
}
.dark .keyboard-wrap { background: #1e293b; border-top: 1px solid var(--border); }

.keys-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.key {
  border: none; border-radius: 16px; background: var(--card-bg); color: var(--text); font-size: 22px; font-weight: 600;
  box-shadow: 0 2px 0 rgba(0,0,0,0.05); cursor: pointer; height: 56px;
}
.key:active { transform: translateY(2px); box-shadow: none; }
.key.op { color: var(--accent-blue); background: #eff6ff; }
.key.ac { color: var(--danger); background: #fef2f2; }
.key.eq { background: var(--primary); color: white; grid-row: span 2; height: 100%; }
.dark .key { background: #334155; }
.dark .key.op { background: #0f172a; }
.dark .key.ac { background: #331515; }

/* 底部 Tab */
.bottom { flex: 0 0 auto; background: var(--card-bg); border-top: 1px solid var(--border); padding-bottom: var(--safe-b); z-index: 30; }
.tab-bar { display: flex; justify-content: space-around; padding: 10px 0; }
.tab-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; color: #94a3b8; cursor: pointer; }
.tab-btn.active { color: var(--primary); font-weight: bold; }

/* --- 弹窗系统 --- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);
  z-index: 100; display: none; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card-bg); width: 85%; max-width: 360px; border-radius: 28px; padding: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2); animation: pop 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28);
  display: flex; flex-direction: column; max-height: 80vh;
}
@keyframes pop { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-shrink: 0; }
.modal-title { font-size: 20px; font-weight: 900; }
.modal-body { overflow-y: auto; }

/* 🌟 核心优化：输入框与按钮一体化 */
.smart-input-row {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg); border: 2px solid transparent; border-radius: 20px; padding: 8px;
  margin-bottom: 16px; transition: 0.2s;
}
.smart-input-row:focus-within { background: var(--card-bg); box-shadow: 0 4px 20px rgba(0,0,0,0.08); }

/* 蓝色模式 (MYR) */
.smart-input-row.mode-blue { background: #eff6ff; }
.smart-input-row.mode-blue:focus-within { border-color: var(--accent-blue); background: #fff; }
/* 橙色模式 (TWD) */
.smart-input-row.mode-orange { background: #fff7ed; }
.smart-input-row.mode-orange:focus-within { border-color: var(--accent-orange); background: #fff; }

/* 输入框本体 */
.smart-input {
  flex: 1; border: none; background: transparent; font-size: 36px; font-weight: 800; outline: none; color: var(--text); 
  min-width: 0; padding-left: 8px;
}

/* 🌟 切换按钮 (在右侧，胶囊状) */
.toggle-btn {
  padding: 12px 18px; border-radius: 14px; color: white; font-weight: 800; font-size: 15px; cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.15); user-select: none; display: flex; align-items: center; gap: 6px;
  transition: transform 0.1s; margin-left: 8px;
}
.toggle-btn:active { transform: scale(0.95); }
.toggle-btn.blue { background: var(--accent-blue); }
.toggle-btn.orange { background: var(--accent-orange); }

.full-btn {
  width: 100%; border: none; padding: 16px; border-radius: 18px; background: #0f172a; color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;
}
.dark .full-btn { background: #fff; color: #0f172a; }

/* 汇率卡片 */
.rate-card { background: var(--bg); padding: 14px; border-radius: 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.rate-input { width: 90px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; font-weight: bold; text-align: center; font-size: 16px; }

/* 开销分类 */
.cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 20px; }
.cat {
  aspect-ratio: 1; border: 1px solid var(--border); border-radius: 16px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer; background: var(--card-bg); transition: 0.1s;
}
.cat.active { background: #eff6ff; border-color: var(--accent-blue); color: var(--accent-blue); box-shadow: inset 0 0 0 2px var(--accent-blue); }
.dark .cat.active { background: rgba(59, 130, 246, 0.2); }

/* 历史记录列表 */
.hist-item {
  padding: 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;
}
.hist-actions { display: none; gap: 8px; }
.hist-item:hover .hist-actions { display: flex; }
.btn-mini { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; color: white; cursor: pointer; }
.bg-red { background: #ef4444; }

/* 🌟 Toast Notification (顶部轻提示) */
.toast {
  position: absolute; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100%);
  background: rgba(15, 23, 42, 0.9); color: white; padding: 12px 24px; border-radius: 99px;
  font-weight: bold; font-size: 14px; opacity: 0; pointer-events: none; transition: 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); z-index: 200;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body>

<div id="toast" class="toast">✅ 已保存</div>

<div id="app">
  <div class="header">
    <h1 id="headerTitle">我的金库</h1>
    <div style="display:flex; gap:10px;">
      <div class="btn-icon" onclick="tripApp.toggleTheme()">🌓</div>
    </div>
  </div>

  <div class="main">
    <div id="page-assets" class="page active">
      <div class="card">
        <div style="font-size:12px; opacity:0.7">台币剩余 (TWD)</div>
        <div class="card-val" id="assetBalance">0.00</div>
        <div class="card-sub">
          <span id="assetIn">总存: 0</span>
          <span id="assetOut">总花: 0</span>
        </div>
      </div>

      <div class="grid-2">
        <div class="btn-lg" onclick="tripApp.openExchange()">
          <div class="icon-box" style="background:#dbeafe; color:#2563eb">💱</div>
          存入资金
        </div>
        <div class="btn-lg" onclick="tripApp.openExpense()">
          <div class="icon-box" style="background:#ffedd5; color:#ea580c">💸</div>
          记录开销
        </div>
      </div>

      <div class="list-wrapper" id="recordsList"></div>
    </div>

    <div id="page-calc" class="page calc-page">
      <div class="calc-layout">
        
        <div class="calc-top-section">
          <div class="pillRow">
            <div class="ratePill">
              <span class="dot"></span>
              <span>100 TWD = </span>
              <span id="calcRateDisplay">12.63</span>
              <span>MYR</span>
            </div>
            <div class="pillBtn" onclick="tripApp.openHistory()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
              历史
            </div>
          </div>

          <div class="exchange-card-wrap">
            <div class="io-card in">
              <div class="io-label">输入 TWD</div>
              <div class="io-val" style="color:var(--accent-blue)" id="inBig">0</div>
              <div class="io-unit">TWD</div>
            </div>
            <div class="io-card out">
              <div class="io-label">换算为 MYR</div>
              <div class="io-val" style="color:var(--primary)" id="outBig">0.00</div>
              <div class="io-unit">MYR</div>
            </div>
          </div>

          <div class="save-bar">
            <div class="save-hint">点击保存至历史记录</div>
            <button class="btn-save" id="saveCalcBtn">
              <svg width="16" height="16" fill="none" stroke="white" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              保存
            </button>
          </div>
        </div>

        <div class="keyboard-wrap">
          <div class="keys-grid">
            <button class="key ac" onclick="tripApp.onKey('AC')">AC</button>
            <button class="key ac" onclick="tripApp.onKey('DEL')">⌫</button>
            <button class="key op" onclick="tripApp.onKey('%')">%</button>
            <button class="key op" onclick="tripApp.onKey('/')">÷</button>
            <button class="key" onclick="tripApp.onKey('7')">7</button>
            <button class="key" onclick="tripApp.onKey('8')">8</button>
            <button class="key" onclick="tripApp.onKey('9')">9</button>
            <button class="key op" onclick="tripApp.onKey('*')">×</button>
            <button class="key" onclick="tripApp.onKey('4')">4</button>
            <button class="key" onclick="tripApp.onKey('5')">5</button>
            <button class="key" onclick="tripApp.onKey('6')">6</button>
            <button class="key op" onclick="tripApp.onKey('-')">-</button>
            <button class="key" onclick="tripApp.onKey('1')">1</button>
            <button class="key" onclick="tripApp.onKey('2')">2</button>
            <button class="key" onclick="tripApp.onKey('3')">3</button>
            <button class="key op" onclick="tripApp.onKey('+')">+</button>
            <button class="key" onclick="tripApp.onKey('0')">0</button>
            <button class="key" onclick="tripApp.onKey('00')">00</button>
            <button class="key" onclick="tripApp.onKey('.')">.</button>
            <button class="key eq" onclick="tripApp.onKey('=')">=</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="tab-bar">
      <div class="tab-btn active" id="tab-assets" onclick="tripApp.setTab('assets')">
        <span style="font-size:20px">👛</span> <span>金库</span>
      </div>
      <div class="tab-btn" id="tab-calc" onclick="tripApp.setTab('calc')">
        <span style="font-size:20px">🧮</span> <span>换算</span>
      </div>
    </div>
  </div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this) tripApp.closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
'use strict';

window.tripApp = {
  data: {
    tab: 'assets',
    theme: 'light',
    history: [],
    records: [],
    // 🌟 核心修改：rate 存储为 “每100台币换多少马币” (e.g. 12.63)
    rate: 12.63, 
    calcIn: '0',
    exMode: 'MYR',
    exVal: '',
    expCat: 0,
    expVal: ''
  },
  cats: [
    {n:'饮食',i:'🍔'},{n:'交通',i:'🚗'},{n:'购物',i:'🛍️'},{n:'娱乐',i:'🎮'},{n:'住宿',i:'🏨'},
    {n:'零食',i:'🍦'},{n:'礼物',i:'🎁'},{n:'医疗',i:'💊'},{n:'生活',i:'💡'},{n:'其他',i:'📦'}
  ],

  init() {
    const saved = localStorage.getItem('ustrip_v20_2_final');
    if (saved) {
      try { this.data = { ...this.data, ...JSON.parse(saved) }; } catch (e) {}
    }
    if (!Array.isArray(this.data.history)) this.data.history = [];
    if (!Array.isArray(this.data.records)) this.data.records = [];

    this.renderTheme();
    this.setTab(this.data.tab);
    
    // Bind global listener for save
    document.getElementById('saveCalcBtn').onclick = () => this.saveCalc();
  },

  save() {
    localStorage.setItem('ustrip_v20_2_final', JSON.stringify(this.data));
    if(this.data.tab === 'assets') this.renderAssets();
  },

  showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1500);
  },

  renderTheme() { document.body.className = this.data.theme; },
  toggleTheme() {
    this.data.theme = this.data.theme === 'light' ? 'dark' : 'light';
    this.renderTheme();
    this.save();
  },

  setTab(t) {
    this.data.tab = t;
    document.getElementById('page-assets').style.display = t==='assets' ? 'flex' : 'none';
    document.getElementById('page-calc').style.display = t==='calc' ? 'flex' : 'none';
    document.getElementById('tab-assets').className = t==='assets' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('tab-calc').className = t==='calc' ? 'tab-btn active' : 'tab-btn';
    document.getElementById('headerTitle').innerText = t==='assets'?'我的金库':'汇率计算';
    if(t==='assets') this.renderAssets();
    else this.renderCalc();
    this.save();
  },

  // 🌟 Logic: TWD to MYR using "100 TWD = X MYR" rate
  // 1 TWD = (Rate / 100) MYR
  twdToMyr(twd) { return twd * (this.data.rate / 100); },
  myrToTwd(myr) { return myr / (this.data.rate / 100); },

  // --- Calc Page ---
  renderCalc() {
    document.getElementById('calcRateDisplay').innerText = this.data.rate;
    document.getElementById('inBig').innerText = this.data.calcIn;
    
    let res = 0;
    try { 
      const twd = parseFloat(eval(this.data.calcIn.replace(/×/g,'*').replace(/÷/g,'/')));
      if(!isNaN(twd)) res = this.twdToMyr(twd);
    } catch {}
    document.getElementById('outBig').innerText = res.toFixed(2);
  },

  onKey(k) {
    let s = this.data.calcIn;
    if(k === 'AC') s = '0';
    else if(k === 'DEL') s = s.length > 1 ? s.slice(0, -1) : '0';
    else if(k === '=') {
        try { 
          const val = eval(s.replace(/×/g,'*').replace(/÷/g,'/'));
          s = String(parseFloat(val.toFixed(2))); 
        } catch { s = 'Error'; }
    }
    else {
        if(s === '0' && !['.','+','-','*','/'].includes(k)) s = k;
        else s += k;
    }
    this.data.calcIn = s;
    this.renderCalc();
  },

  saveCalc() {
    try {
        const twd = parseFloat(eval(this.data.calcIn.replace(/×/g,'*').replace(/÷/g,'/')));
        if(!twd || twd <= 0) return;
        const myr = this.twdToMyr(twd);
        
        this.data.history.unshift({
            id: Date.now(), twd: twd.toFixed(2), rm: myr.toFixed(2), 
            date: new Date().toLocaleDateString()
        });
        this.data.calcIn = '0';
        this.save();
        this.renderCalc();
        this.showToast('✅ 已保存');
    } catch {}
  },

  // --- Modals ---
  openModal(html) {
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('modalOverlay').className = 'modal-overlay open';
  },
  closeModal() {
    document.getElementById('modalOverlay').className = 'modal-overlay';
  },

  // 🌟 Exchange Modal (Fix: Editable rate, Input right side button)
  openExchange() {
    this.data.exMode = 'MYR'; this.data.exVal = '';
    this.renderExchange();
  },
  renderExchange() {
    const mode = this.data.exMode;
    const val = parseFloat(this.data.exVal)||0;
    
    // Preview calculation
    let twd=0, rm=0;
    if(mode === 'MYR') { // Input is MYR, convert to TWD
       rm = val;
       twd = this.myrToTwd(val);
    } else { // Input is TWD
       twd = val;
       rm = this.twdToMyr(val);
    }

    const rowClass = mode === 'MYR' ? 'mode-blue' : 'mode-orange';
    const btnClass = mode === 'MYR' ? 'blue' : 'orange';

    this.openModal(`
      <div class="modal-header">
        <div class="modal-title">存入资金</div>
        <div class="btn-icon" onclick="tripApp.closeModal()">✕</div>
      </div>
      
      <div class="rate-card">
        <div style="font-size:10px; font-weight:bold; color:#64748b">JAGS RATE (100 TWD)</div>
        <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
          <input class="rate-input" type="number" value="${this.data.rate}" oninput="tripApp.data.rate=parseFloat(this.value)||1; tripApp.renderExchange()">
          <span style="font-size:14px;font-weight:bold">MYR</span>
        </div>
      </div>

      <div style="margin-bottom:8px; font-size:12px; font-weight:bold; color:var(--text); opacity:0.6">输入金额</div>
      
      <div class="smart-input-row ${rowClass}">
        <input type="number" class="smart-input" placeholder="0" value="${this.data.exVal}" oninput="tripApp.data.exVal=this.value; tripApp.renderExchange()" autofocus>
        <div class="toggle-btn ${btnClass}" onclick="tripApp.data.exMode='${mode==='MYR'?'TWD':'MYR'}'; tripApp.data.exVal=''; tripApp.renderExchange()">
          ${mode} ⇄
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;padding:0 8px; margin-bottom:20px;">
        <span style="font-size:12px;font-weight:bold;color:#64748b">自动换算为</span>
        <span style="font-size:24px;font-weight:900;color:${mode==='MYR'?'var(--accent-orange)':'var(--accent-blue)'}">
          ${mode==='MYR' ? Math.round(twd) : rm.toFixed(2)} <span style="font-size:14px">${mode==='MYR'?'TWD':'MYR'}</span>
        </span>
      </div>

      <button class="full-btn" onclick="tripApp.submitEx()">确认存入</button>
    `);
    setTimeout(()=>document.querySelector('.smart-input').focus(), 50);
  },
  submitEx() {
    const val = parseFloat(this.data.exVal);
    if(!val) return;
    let twd = 0, rm = 0;
    if(this.data.exMode==='MYR') { rm=val; twd=this.myrToTwd(val); }
    else { twd=val; rm=this.twdToMyr(val); }
    
    this.data.records.unshift({id:Date.now(), type:'in', title:'换汇存入', twd:twd, rm:rm.toFixed(2), icon:'🔄'});
    this.save();
    this.closeModal();
    this.showToast('✅ 已存入');
  },

  // Expense Modal
  openExpense() {
    this.data.expCat = 0; this.data.expVal = '';
    this.renderExpense();
  },
  renderExpense() {
    const catsHtml = this.cats.map((c,i) => `
      <div class="cat ${this.data.expCat===i?'active':''}" onclick="tripApp.data.expCat=${i}; tripApp.renderExpense()">
        <div class="cat-icon">${c.i}</div>
        <div class="cat-name">${c.n}</div>
      </div>
    `).join('');
    
    const currentVal = document.getElementById('expInput') ? document.getElementById('expInput').value : this.data.expVal;

    this.openModal(`
      <div class="modal-header">
        <div class="modal-title">记录开销</div>
        <div class="btn-icon" onclick="tripApp.closeModal()">✕</div>
      </div>
      <div class="cats">${catsHtml}</div>
      
      <div class="smart-input-row mode-orange">
        <input type="number" id="expInput" class="smart-input" placeholder="0" value="${currentVal}" oninput="tripApp.data.expVal=this.value" autofocus>
        <span style="font-weight:900; color:var(--accent-orange); margin-right:16px">TWD</span>
      </div>
      <button class="full-btn" onclick="tripApp.submitExp()">确认记账</button>
    `);
    setTimeout(()=>{
       const el = document.getElementById('expInput');
       if(el) { el.focus(); el.value = el.value; }
    }, 0);
  },
  submitExp() {
    const val = parseFloat(this.data.expVal);
    if(!val) return;
    const c = this.cats[this.data.expCat];
    this.data.records.unshift({id:Date.now(), type:'out', title: c.n, twd:val, icon:c.i});
    this.save();
    this.closeModal();
    this.showToast('✅ 已记录');
  },

  // History
  openHistory() {
    const html = this.data.history.map((h, i) => `
        <div class="hist-item">
            <div>
                <div style="font-weight:bold; font-size:16px">${h.twd} TWD</div>
                <div style="font-size:12px; color:var(--muted)">${h.date}</div>
            </div>
            <div style="display:flex;align-items:center;gap:10px">
                <div style="text-align:right">
                    <div style="font-weight:bold; color:var(--primary)">${h.rm} MYR</div>
                </div>
                <div class="btn-mini bg-red" onclick="tripApp.delHist(${i})">✕</div>
            </div>
        </div>
    `).join('') || '<div style="padding:20px; text-align:center; color:#999">暂无记录</div>';

    this.openModal(`
      <div class="modal-header">
        <div class="modal-title">历史记录</div>
        <div style="display:flex;gap:10px">
            <span style="font-size:12px; font-weight:bold; color:var(--danger); cursor:pointer;" onclick="tripApp.clearHistory()">清空</span>
            <div class="btn-icon" onclick="tripApp.closeModal()">✕</div>
        </div>
      </div>
      <div>${html}</div>
    `);
  },
  delHist(i) {
    if(confirm('删除?')) {
        this.data.history.splice(i, 1);
        this.save();
        this.openHistory();
    }
  },
  clearHistory() {
    if(confirm('清空所有?')) {
        this.data.history = [];
        this.save();
        this.openHistory();
    }
  },

  // Assets Render
  renderAssets() {
    const totalIn = this.data.records.filter(r=>r.type==='in').reduce((a,b)=>a+(Number(b.twd)||0),0);
    const totalOut = this.data.records.filter(r=>r.type==='out').reduce((a,b)=>a+(Number(b.twd)||0),0);
    document.getElementById('assetBalance').innerText = (totalIn - totalOut).toFixed(0);
    document.getElementById('assetIn').innerText = '总存: '+totalIn.toFixed(0);
    document.getElementById('assetOut').innerText = '总花: '+totalOut.toFixed(0);

    const listEl = document.getElementById('recordsList');
    if(this.data.records.length === 0) {
      listEl.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8">暂无记录</div>';
      return;
    }
    listEl.innerHTML = this.data.records.sort((a,b)=>b.id-a.id).map(r => `
      <div class="list-item">
        <div class="left">
          <div class="emoji">${r.icon || '💸'}</div>
          <div>
            <div style="font-weight:bold">${r.title}</div>
            <div style="font-size:12px;opacity:0.6">${new Date(r.id).toLocaleDateString()}</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-weight:bold; color:${r.type==='in'?'var(--primary)':'var(--text)'}">
            ${r.type==='in'?'+':'-'}${Number(r.twd).toFixed(0)}
          </div>
          <div style="font-size:10px;opacity:0.6">${r.rm?'RM '+r.rm:''}</div>
        </div>
        <div class="btn-mini bg-red" style="margin-left:10px" onclick="tripApp.delRec(${r.id})">✕</div>
      </div>
    `).join('');
  }
};

window.tripApp.init();
</script>
</body>
</html>
