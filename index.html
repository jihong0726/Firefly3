<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>金库 · 换算</title>
  <style>
    :root{
      --bg1:#eef6ff;
      --bg2:#e9fbf1;
      --card:#ffffffcc;
      --card2:#ffffffea;
      --stroke:#dfe8f3;
      --text:#0e1726;
      --muted:#6b7a90;
      --shadow: 0 20px 60px rgba(16,24,40,.10);
      --shadow2: 0 10px 30px rgba(16,24,40,.10);
      --radius: 28px;
      --radius2: 22px;
      --accent:#15b981;
      --accent2:#2f7dff;
      --danger:#ff4d4f;
      --tabH: 84px;
      --safeB: env(safe-area-inset-bottom, 0px);
      --safeT: env(safe-area-inset-top, 0px);
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC","Microsoft YaHei", Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1400px 700px at 15% 10%, rgba(46,139,255,.18), transparent 60%),
        radial-gradient(1200px 700px at 80% 20%, rgba(18,200,140,.18), transparent 60%),
        linear-gradient(180deg, #f6fbff, #f3f7ff 35%, #f6fbff);
      overflow:hidden; 
    }
    body.dark{
      --bg1:#0a1222;
      --bg2:#071a16;
      --card:#0f1a2b99;
      --card2:#0f1a2bea;
      --stroke:#1f2b44;
      --text:#eaf0ff;
      --muted:#a9b6cf;
      --shadow: 0 30px 90px rgba(0,0,0,.45);
      --shadow2: 0 16px 48px rgba(0,0,0,.35);
      background:
        radial-gradient(1400px 700px at 15% 10%, rgba(46,139,255,.16), transparent 60%),
        radial-gradient(1200px 700px at 80% 20%, rgba(18,200,140,.12), transparent 60%),
        linear-gradient(180deg, #070c16, #070c16 35%, #060b14);
    }

    body.modal-open{overflow:hidden;touch-action:none;}
    
    *{box-sizing:border-box;}
    button{font:inherit;}
    
    /* 🌟 核心布局修复：Flex Column */
    .app{
      height:100%;
      display:flex;
      flex-direction:column;
      overflow: hidden; /* 防止整体滚动 */
    }

    /* Top: 固定头部 */
    .top{
      padding: calc(14px + var(--safeT)) 18px 12px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      flex:0 0 auto; /* 不收缩 */
      z-index: 10;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0;}
    .logo{
      width:48px;height:48px;border-radius:16px;
      background: linear-gradient(135deg, rgba(21,185,129,.95), rgba(46,139,255,.25));
      display:grid;place-items:center;
      box-shadow: var(--shadow2);
      border:1px solid rgba(255,255,255,.35);
      flex:0 0 auto;
    }
    .logo svg{opacity:.95}
    .titleWrap{min-width:0;}
    .title{
      font-size:34px;letter-spacing:.5px;font-weight:900;margin:0;line-height:1.05;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .subtitle{
      margin:4px 0 0;color:var(--muted);font-size:13px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    .topActions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
    .iconBtn{
      width:52px;height:52px;border-radius:18px;
      border:1px solid var(--stroke);
      background: var(--card2);
      box-shadow: var(--shadow2);
      display:grid;place-items:center;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      position:relative;
    }
    .iconBtn:hover{transform: translateY(-1px); box-shadow: 0 14px 34px rgba(16,24,40,.14);}
    .iconBtn:active{transform: translateY(0px) scale(.98);}
    .moonDot{
      position:absolute;right:10px;top:10px;width:10px;height:10px;border-radius:999px;
      background: var(--accent);box-shadow: 0 0 0 3px rgba(21,185,129,.18);
      opacity:0;transform:scale(.9);transition:.2s;
    }
    body.dark .moonDot{opacity:1; transform:scale(1);}

    /* 🌟 Content: 弹性区域，自动填充剩余空间并滚动 */
    .content{
      flex:1 1 auto;
      overflow-y:auto;
      overflow-x:hidden;
      padding: 10px 16px 20px; /* 底部留一点呼吸空间，不再需要计算 */
      -webkit-overflow-scrolling:touch;
      position: relative;
    }
    .content::-webkit-scrollbar{width:6px;}
    .content::-webkit-scrollbar-thumb{background: rgba(100,120,160,.25); border-radius:999px;}

    .panel{
      max-width: 980px;
      margin: 0 auto;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .pillRow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
    .pill{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 14px;border-radius:999px;
      border:1px solid var(--stroke);
      background: var(--card2);
      box-shadow: var(--shadow2);
      color:var(--text);
      font-weight:700;
      letter-spacing:.2px;
    }
    .pill small{font-weight:800;color:var(--muted);letter-spacing:.2px;}
    .pill .dot{width:10px;height:10px;border-radius:99px;background: var(--accent);box-shadow: 0 0 0 4px rgba(21,185,129,.15);}
    .pillBtn{cursor:pointer;transition: transform .12s ease, box-shadow .12s ease;}
    .pillBtn:hover{transform: translateY(-1px);}
    .pillBtn:active{transform: translateY(0px) scale(.99);}

    /* Exchange card */
    .exchangeCard{
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.80), rgba(255,255,255,.55));
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    body.dark .exchangeCard{background: linear-gradient(180deg, rgba(15,26,43,.70), rgba(15,26,43,.45));}
    .exchangeGrid{display:grid;grid-template-columns: 1fr 1fr;gap:0;}
    .side{
      padding:16px 18px;
      min-height: 140px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    .side.left{
      background: linear-gradient(180deg, rgba(47,125,255,.12), rgba(47,125,255,.04));
      border-right:1px solid var(--stroke);
    }
    .side.right{background: linear-gradient(180deg, rgba(21,185,129,.12), rgba(21,185,129,.04));}
    body.dark .side.left{background: linear-gradient(180deg, rgba(47,125,255,.16), rgba(47,125,255,.05));}
    body.dark .side.right{background: linear-gradient(180deg, rgba(21,185,129,.14), rgba(21,185,129,.05));}

    .sideTop{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;color:var(--muted);font-size:13px;}
    .tag{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;border-radius:999px;border:1px solid var(--stroke);
      background: rgba(255,255,255,.65);color:var(--text);font-weight:900;
      box-shadow: 0 10px 22px rgba(16,24,40,.06);
    }
    body.dark .tag{background: rgba(15,26,43,.55);}
    .tag .miniDot{width:10px;height:10px;border-radius:99px;}
    .miniDot.blue{background: var(--accent2); box-shadow:0 0 0 4px rgba(47,125,255,.15);}
    .miniDot.green{background: var(--accent); box-shadow:0 0 0 4px rgba(21,185,129,.15);}
    .onlyShow{font-weight:900;color:var(--muted);display:flex;align-items:center;gap:8px;}
    .onlyShow .lock{
      width:28px;height:28px;border-radius:10px;display:grid;place-items:center;
      background: rgba(255,255,255,.70);border:1px solid var(--stroke);
    }
    body.dark .onlyShow .lock{background: rgba(15,26,43,.55);}

    .bigLine{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
    .big{
      font-size:64px;line-height:1;font-weight:1000;letter-spacing:1px;
      font-variant-numeric: tabular-nums;
      word-break:break-word;
    }
    .big.blue{color:#0e1726;}
    body.dark .big.blue{color:#eaf0ff;}
    .big.green{color: #11a66f;}
    .unit{
      font-weight:900;color:var(--muted);font-size:16px;
    }
    .rmPrefix{
      font-weight:1000;
      color: var(--muted);
      font-size:18px;
      letter-spacing:.2px;
    }

    .hintRow{
      padding: 12px 16px;border-top:1px solid var(--stroke);
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      background: linear-gradient(90deg, rgba(47,125,255,.06), rgba(21,185,129,.06));
    }
    .hintRow .hint{font-weight:900;color:var(--muted);}
    .saveBtn{
      border:none;cursor:pointer;padding: 12px 16px;border-radius: 999px;
      background: linear-gradient(135deg, rgba(21,185,129,.95), rgba(21,185,129,.75));
      color:white;font-weight:1000;letter-spacing:.4px;
      box-shadow: 0 18px 40px rgba(21,185,129,.25);
      display:inline-flex;align-items:center;gap:10px;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      min-width: 190px;justify-content:center;
    }
    .saveBtn:hover{transform: translateY(-1px); filter:saturate(1.03); box-shadow: 0 22px 50px rgba(21,185,129,.30);}
    .saveBtn:active{transform: translateY(0px) scale(.99);}

    /* Vault */
    .vaultHero{
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(14,23,38,.92), rgba(14,23,38,.75));
      color:#f4f7ff;
      box-shadow: var(--shadow);
      overflow:hidden;
      padding:18px;
      position:relative;
    }
    body.dark .vaultHero{background: linear-gradient(135deg, rgba(8,12,20,.92), rgba(10,16,28,.78));}
    .vaultHero .rateBadge{
      position:absolute;right:16px;top:16px;
      padding:10px 12px;border-radius:999px;
      background: rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.16);
      font-weight:900;letter-spacing:.4px;
    }
    .vaultHero .label{color: rgba(255,255,255,.75); font-weight:900;}
    .vaultHero .balance{
      font-size:72px;font-weight:1100;letter-spacing:1px;margin:8px 0 10px;
      font-variant-numeric: tabular-nums;
    }
    .vaultHero .subRow{
      display:flex;gap:18px;flex-wrap:wrap;color: rgba(255,255,255,.75);font-weight:900;
    }

    .vaultActions{display:grid;grid-template-columns: 1fr 1fr;gap:12px;}
    .actionCard{
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      background: var(--card2);
      box-shadow: var(--shadow2);
      padding:14px;
      display:flex;align-items:center;gap:12px;
      cursor:pointer;
      transition: transform .12s ease, box-shadow .12s ease;
      min-height: 86px;
    }
    .actionCard:hover{transform: translateY(-1px);}
    .actionCard:active{transform: translateY(0px) scale(.99);}
    .actionIcon{
      width:54px;height:54px;border-radius:18px;
      display:grid;place-items:center;
      border:1px solid var(--stroke);
      background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.55));
    }
    body.dark .actionIcon{background: rgba(15,26,43,.55);}
    .actionText h3{margin:0;font-size:18px;font-weight:1000;}
    .actionText p{margin:4px 0 0;color:var(--muted);font-weight:900;font-size:12px;}

    .sectionTitle{
      margin: 6px 0 0;
      font-weight:1000;letter-spacing:.4px;font-size:14px;color:var(--muted);
      display:flex;align-items:center;justify-content:space-between;gap:10px;
    }
    .records{
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      background: var(--card2);
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .recordItem{
      padding:14px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      cursor:pointer;transition: background .12s ease;
      border-top:1px solid rgba(120,140,180,.14);
    }
    .recordItem:first-child{border-top:none;}
    .recordItem:hover{background: rgba(47,125,255,.06);}
    body.dark .recordItem:hover{background: rgba(47,125,255,.10);}
    .recLeft{display:flex;align-items:center;gap:12px;min-width:0;}
    .emoji{
      width:44px;height:44px;border-radius:16px;display:grid;place-items:center;
      border:1px solid var(--stroke);background: rgba(255,255,255,.6);
      box-shadow: 0 10px 22px rgba(16,24,40,.06);
      flex:0 0 auto;font-size:20px;
    }
    body.dark .emoji{background: rgba(15,26,43,.55);}
    .recMeta{min-width:0;}
    .recTitle{font-weight:1000;margin:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .recSub{margin:4px 0 0;font-weight:900;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .recAmt{text-align:right;font-variant-numeric: tabular-nums;min-width:150px;}
    .recAmt .topAmt{font-weight:1100;font-size:18px;margin:0;white-space:nowrap;}
    .recAmt .botAmt{margin:4px 0 0;font-weight:900;color:var(--muted);font-size:12px;white-space:nowrap;}
    .pos{color: var(--accent);}
    .neg{color: #ff5a5f;}

    /* 🌟 Bottom: 弹性底部，不使用 fixed 定位，避免遮挡 */
    .bottom{
      flex: 0 0 auto; /* 不允许压缩 */
      padding: 10px 16px calc(10px + var(--safeB));
      z-index:50;
      width: 100%;
    }
    .bottomInner{
      max-width: 980px;margin:0 auto;
      display:flex;flex-direction:column;gap:10px;
    }

    .tabBar{
      pointer-events:auto;
      border:1px solid var(--stroke);
      border-radius: 999px;
      background: var(--card2);
      box-shadow: var(--shadow);
      display:grid;grid-template-columns: 1fr 1fr;
      overflow:hidden;
      height: var(--tabH);
      align-items:stretch;
    }
    .tabBtn{
      border:none;background: transparent;cursor:pointer;
      display:flex;align-items:center;justify-content:center;gap:10px;
      font-weight:1000;font-size:16px;color:var(--muted);
      transition: background .12s ease, color .12s ease;
    }
    .tabBtn.active{
      background: linear-gradient(135deg, rgba(21,185,129,.20), rgba(47,125,255,.12));
      color: var(--text);
    }
    .tabBtn svg{opacity:.9}

    /* Keyboard */
    .kbdWrap{display:none;}
    .kbdWrap.show{display:block;}
    .kbd{
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      background: var(--card2);
      box-shadow: var(--shadow);
      padding:14px;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:12px;
    }
    .key{
      border:none;cursor:pointer;border-radius: 22px;padding: 0;
      height: 74px;display:grid;place-items:center;
      font-weight:1100;font-size:24px;color:var(--text);
      background: rgba(255,255,255,.78);
      border:1px solid rgba(160,180,220,.28);
      box-shadow: 0 16px 36px rgba(16,24,40,.08);
      transition: transform .10s ease, box-shadow .10s ease, filter .10s ease;
      user-select:none;
    }
    body.dark .key{
      background: rgba(15,26,43,.62);
      border:1px solid rgba(150,180,240,.16);
      box-shadow: 0 16px 34px rgba(0,0,0,.25);
    }
    .key:hover{transform: translateY(-1px); filter:saturate(1.03);}
    .key:active{transform: translateY(0px) scale(.98); box-shadow: 0 10px 24px rgba(16,24,40,.10);}
    .k-func{background: rgba(255,210,210,.55);border:1px solid rgba(255,120,120,.25);color: #e22b2b;}
    body.dark .k-func{background: rgba(255,90,90,.14); border-color: rgba(255,90,90,.25);}
    .k-op{background: rgba(21,185,129,.14);border:1px solid rgba(21,185,129,.20);color: #0f9c67;font-size:26px;}
    body.dark .k-op{background: rgba(21,185,129,.14);}
    .k-mid{background: rgba(47,125,255,.12);border:1px solid rgba(47,125,255,.18);color: #2f67ff;}
    body.dark .k-mid{background: rgba(47,125,255,.14);}
    .span2{grid-column: span 2;}
    .tallEq{
      height: 74px;
      background: linear-gradient(135deg, rgba(21,185,129,.95), rgba(21,185,129,.70));
      color:#fff;border:none;
      box-shadow: 0 22px 52px rgba(21,185,129,.26);
    }
    .tallEq:hover{box-shadow: 0 26px 60px rgba(21,185,129,.30);}
    .tallEq:active{box-shadow: 0 18px 42px rgba(21,185,129,.22);}

    @media (max-width: 520px){
      .big{font-size:56px;}
      .key{height: 68px; border-radius: 20px;}
      .kbd{padding:12px;}
      .grid{gap:10px;}
      .tabBar{height: 76px;}
      :root{--tabH:76px;}
    }
    @media (max-width: 380px){
      .big{font-size:48px;}
      .key{height: 62px;}
    }

    /* Modal */
    .backdrop{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.35);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:100;
      padding: 18px;
    }
    body.dark .backdrop{background: rgba(0,0,0,.55);}
    .backdrop.show{display:flex;}

    /* 弹窗自身固定 */
    .modal{
      width: min(820px, 100%);
      border-radius: 32px;
      border:1px solid var(--stroke);
      background: var(--card2);
      box-shadow: var(--shadow);
      overflow:hidden;
      max-height: 92vh;
      display:flex;
      flex-direction:column;
    }
    .mHead{
      display:flex;align-items:flex-start;justify-content:space-between;
      padding:18px 18px 10px;gap:14px;
      flex:0 0 auto;
    }
    .mTitle{display:flex;align-items:center;gap:12px;min-width:0;}
    .mIcon{
      width:52px;height:52px;border-radius:18px;
      display:grid;place-items:center;
      border:1px solid var(--stroke);
      background: rgba(21,185,129,.16);
      flex:0 0 auto;
    }
    .mText{min-width:0;}
    .mText h2{margin:0;font-size:26px;font-weight:1100;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .mText p{margin:6px 0 0;color:var(--muted);font-weight:900;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .mClose{
      width:48px;height:48px;border-radius:18px;border:1px solid var(--stroke);
      background: rgba(255,255,255,.65);
      cursor:pointer;display:grid;place-items:center;
      transition: transform .12s ease;flex:0 0 auto;
    }
    body.dark .mClose{background: rgba(15,26,43,.55);}
    .mClose:hover{transform: translateY(-1px);}
    .mClose:active{transform: scale(.98);}

    .mBody{
      padding: 10px 18px 18px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      flex:1 1 auto;
    }

    .mActions{display:grid;grid-template-columns: 1fr;gap:12px;margin: 10px 0 14px;}
    .mBtn{
      border:none;cursor:pointer;border-radius: 22px;padding: 14px 16px;
      font-weight:1100;font-size:18px;
      background: rgba(255,255,255,.70);
      border:1px solid var(--stroke);
      box-shadow: var(--shadow2);
      transition: transform .12s ease;
    }
    body.dark .mBtn{background: rgba(15,26,43,.55);}
    .mBtn:hover{transform: translateY(-1px);}
    .mBtn:active{transform: scale(.99);}
    .mBtn.danger{
      background: rgba(255,90,90,.15);
      border-color: rgba(255,90,90,.25);
      color: #e03b3b;
      font-weight:1200;
    }

    .list{display:flex;flex-direction:column;gap:12px;}
    .rowCard{
      border:1px solid var(--stroke);
      border-radius: 26px;
      background: rgba(255,255,255,.70);
      padding: 14px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
    }
    body.dark .rowCard{background: rgba(15,26,43,.55);}
    .rowCard:hover{transform: translateY(-1px); background: rgba(47,125,255,.06);}
    body.dark .rowCard:hover{background: rgba(47,125,255,.10);}
    .rowMain{min-width:0;display:flex;flex-direction:column;gap:6px;}
    .rowMain .r1{font-weight:1100;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .rowMain .r2{font-weight:900;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .rowAmt{text-align:right;font-variant-numeric: tabular-nums;flex:0 0 auto;}
    .rowAmt .rm{font-weight:1200;font-size:22px;color: var(--accent);white-space:nowrap;}
    .rowAmt .twd{margin-top:4px;font-weight:900;color:var(--muted);font-size:12px;white-space:nowrap;}

    /* Detail modal */
    .detailCard{
      border:1px solid var(--stroke);
      border-radius: 28px;
      background: rgba(255,255,255,.72);
      padding: 14px;
      box-shadow: var(--shadow2);
    }
    body.dark .detailCard{background: rgba(15,26,43,.55);}
    .detailGrid{display:grid;grid-template-columns: 1fr 1fr;gap: 12px;}
    .dBox{
      border-radius: 24px;border:1px solid var(--stroke);
      padding: 14px;background: rgba(255,255,255,.65);
      min-height: 108px;display:flex;flex-direction:column;justify-content:space-between;
    }
    body.dark .dBox{background: rgba(15,26,43,.50);}
    .dBox.left{background: linear-gradient(180deg, rgba(47,125,255,.10), rgba(255,255,255,.45));}
    .dBox.right{background: linear-gradient(180deg, rgba(21,185,129,.10), rgba(255,255,255,.45));}
    body.dark .dBox.left{background: linear-gradient(180deg, rgba(47,125,255,.12), rgba(15,26,43,.40));}
    body.dark .dBox.right{background: linear-gradient(180deg, rgba(21,185,129,.12), rgba(15,26,43,.40));}
    .dLabel{color:var(--muted);font-weight:1000;font-size:12px;}
    .dVal{
      font-size:30px;font-weight:1200;
      font-variant-numeric: tabular-nums;
      letter-spacing:.2px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .dVal.green{color: var(--accent);}
    .dMeta{
      margin-top: 10px;color:var(--muted);
      font-weight:900;font-size:12px;
      display:flex;gap:12px;flex-wrap:wrap;
    }
    .detailActions{display:flex;gap:12px;margin-top: 14px;flex-wrap:wrap;}
    .btnPrimary{
      border:none;cursor:pointer;border-radius: 22px;padding: 14px 16px;
      font-weight:1100;background: linear-gradient(135deg, rgba(21,185,129,.95), rgba(21,185,129,.70));
      color:#fff;box-shadow: 0 18px 40px rgba(21,185,129,.25);
      transition: transform .12s ease;min-width: 160px;text-align:center;
    }
    .btnPrimary:hover{transform: translateY(-1px);}
    .btnPrimary:active{transform: scale(.99);}
    .btnGhost{
      border:1px solid var(--stroke);cursor:pointer;border-radius: 22px;padding: 14px 16px;
      font-weight:1100;background: rgba(255,255,255,.70);color: var(--text);
      box-shadow: var(--shadow2);transition: transform .12s ease;
      min-width: 160px;text-align:center;
    }
    body.dark .btnGhost{background: rgba(15,26,43,.55);}
    .btnGhost:hover{transform: translateY(-1px);}
    .btnGhost:active{transform: scale(.99);}
    .btnDanger{
      border:1px solid rgba(255,90,90,.28);
      cursor:pointer;border-radius: 22px;padding: 14px 16px;
      font-weight:1200;background: rgba(255,90,90,.15);color: #e03b3b;
      box-shadow: var(--shadow2);transition: transform .12s ease;
      min-width: 160px;text-align:center;
    }
    .btnDanger:hover{transform: translateY(-1px);}
    .btnDanger:active{transform: scale(.99);}

    /* Forms */
    .formGrid{display:grid;grid-template-columns: 1fr 1fr;gap:12px;margin-top: 8px;}
    .field{
      border:1px solid var(--stroke);
      border-radius: 24px;
      background: rgba(255,255,255,.70);
      padding: 12px 12px;
    }
    body.dark .field{background: rgba(15,26,43,.55);}
    .field label{display:block;color:var(--muted);font-weight:1000;font-size:12px;margin-bottom:8px;}
    .field input, .field select{
      width:100%;border:none;outline:none;background: transparent;
      font-weight:1200;font-size:18px;color:var(--text);
      font-variant-numeric: tabular-nums;
    }
    .segRow{
      display:flex;gap:10px;flex-wrap:wrap;margin-top: 10px;
    }
    .seg{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.70);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight:1000;
      cursor:pointer;
      transition: transform .10s ease, background .10s ease;
      user-select:none;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    body.dark .seg{background: rgba(15,26,43,.55);}
    .seg:hover{transform: translateY(-1px);}
    .seg.active{background: rgba(21,185,129,.18);border-color: rgba(21,185,129,.25);}

    .catRow{display:flex;gap:10px;flex-wrap:wrap;margin-top: 10px;}
    .chip{
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.70);
      border-radius: 999px;
      padding: 10px 12px;
      font-weight:1000;
      cursor:pointer;
      transition: transform .10s ease, background .10s ease;
      user-select:none;
    }
    body.dark .chip{background: rgba(15,26,43,.55);}
    .chip:hover{transform: translateY(-1px);}
    .chip.active{background: rgba(21,185,129,.18);border-color: rgba(21,185,129,.25);}

    @media (max-width: 720px){
      .exchangeGrid{grid-template-columns:1fr;}
      .side.left{border-right:none;border-bottom:1px solid var(--stroke);}
      .vaultActions{grid-template-columns: 1fr;}
      .detailGrid{grid-template-columns: 1fr;}
      .formGrid{grid-template-columns: 1fr;}
      .big{font-size:58px;}
    }
  </style>
</head>

  <script>
    // ---------------------------
    // Storage + State
    // ---------------------------
    const LS_KEY = "vault_calc_v2";

    const DEFAULT_RATE = 7.949; // 1 MYR = 7.949 TWD
    const DEFAULT_RECORD_ID = "default-3200";
    const DEFAULT_RECORD = {
      id: DEFAULT_RECORD_ID,
      type: "exchange",
      emoji: "💱",
      title: "换台币",
      rate: DEFAULT_RATE,
      twd: 3200,
      rm: 402.55,
      at: new Date("2026-02-04T12:00:00").toISOString(),
      note: ""
    };

    const CATS = [
      {e:"🍔", t:"吃喝"},
      {e:"🚗", t:"交通"},
      {e:"🎮", t:"玩乐"},
      {e:"🏨", t:"住宿"},
      {e:"🛒", t:"购物"},
      {e:"🎁", t:"礼物"},
      {e:"💊", t:"医药"},
      {e:"📦", t:"杂项"},
      {e:"💡", t:"生活"},
      {e:"💼", t:"工作"},
    ];

    function loadState(){
      try{
        const raw = localStorage.getItem(LS_KEY);
        if(!raw) return null;
        return JSON.parse(raw);
      }catch(e){ return null; }
    }
    function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

    function ensureDefault(s){
      if(!s.history || !Array.isArray(s.history)) s.history = [];
      if(!s.vault || typeof s.vault !== "object") s.vault = { balanceTWD: 0, records: [] };

      const hasDefHist = s.history.some(r => r.id === DEFAULT_RECORD_ID);
      if(!hasDefHist) s.history.unshift(DEFAULT_RECORD);

      const hasDefVault = s.vault.records.some(r => r.id === DEFAULT_RECORD_ID);
      if(!hasDefVault) s.vault.records.unshift({...DEFAULT_RECORD});

      if(!s.rate || typeof s.rate !== "number") s.rate = DEFAULT_RATE;
      if(!s.ui) s.ui = { tab: "calc", dark: false };
      if(!s.calc) s.calc = { input: "0" };

      // 余额 = sum(exchange.twd) - sum(expense.twd)
      const sumIn = s.vault.records.filter(r=>r.type==="exchange").reduce((a,r)=>a + (Number(r.twd)||0), 0);
      const sumOut = s.vault.records.filter(r=>r.type==="expense").reduce((a,r)=>a + (Number(r.twd)||0), 0);
      s.vault.balanceTWD = Math.max(0, round2(sumIn - sumOut, 0));

      return s;
    }

    let state = ensureDefault(loadState() || {
      rate: DEFAULT_RATE,
      history: [],
      vault: { balanceTWD: 0, records: [] },
      ui: { tab: "calc", dark: false },
      calc: { input: "0" }
    });

    // ---------------------------
    // Helpers
    // ---------------------------
    const $ = (id)=>document.getElementById(id);

    function round2(n, digits=2){
      const p = Math.pow(10, digits);
      return Math.round((Number(n)||0) * p) / p;
    }
    function fmtTWD(n){
      const v = (Number(n)||0);
      return String(v % 1 === 0 ? v.toFixed(0) : v.toFixed(2)).replace(/\.00$/,"");
    }
    function fmtRM(n){ return round2(n, 2).toFixed(2); }
    function nowISO(){ return new Date().toISOString(); }

    function calcRMFromTWD(twd, rate){
      const r = Number(rate || state.rate || DEFAULT_RATE);
      return round2((Number(twd)||0) / r, 2);
    }
    function calcTWDFromRM(rm, rate){
      const r = Number(rate || state.rate || DEFAULT_RATE);
      return round2((Number(rm)||0) * r, 2);
    }
    function humanTime(iso){
      const d = new Date(iso);
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      const hh = String(d.getHours()).padStart(2,"0");
      const mi = String(d.getMinutes()).padStart(2,"0");
      return `${mm}-${dd} ${hh}:${mi}`;
    }
    function uid(prefix="r"){
      return `${prefix}-${Math.random().toString(16).slice(2)}-${Date.now().toString(16)}`;
    }
    function escapeHTML(s){
      return String(s ?? "").replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    // ---------------------------
    // UI: Theme + Tabs + Bottom heights
    // ---------------------------
    function applyTheme(){
      document.body.classList.toggle("dark", !!state.ui.dark);
      saveState();
    }

    function setTab(tab){
      state.ui.tab = tab;
      saveState();

      const isCalc = tab === "calc";
      $("viewCalc").style.display = isCalc ? "" : "none";
      $("viewVault").style.display = isCalc ? "none" : "";

      $("tabCalc").classList.toggle("active", isCalc);
      $("tabVault").classList.toggle("active", !isCalc);

      $("pageTitle").textContent = isCalc ? "换算" : "金库";
      $("pageSub").textContent = isCalc ? "换算模式" : "记录换汇与开销，点进详情可删除（默认记录不可删）";

      $("kbdWrap").classList.toggle("show", isCalc);

      // 移除JS计算高度逻辑，依靠 Flexbox
      renderAll();
    }

    // ---------------------------
    // Render
    // ---------------------------
    function renderRate(){
      $("rateText").textContent = `1 : ${state.rate.toFixed(3)} TWD/MYR`;
      $("vaultRate").textContent = `1 : ${state.rate.toFixed(3)}`;
    }

    function renderCalc(){
      const input = String(state.calc.input || "0").replace(/^0+(?=\d)/, "0");
      $("inBig").textContent = input;
      const rm = calcRMFromTWD(Number(input), state.rate);
      $("outBig").textContent = fmtRM(rm);
      $("hintLine").textContent = `按当前汇率换算（${state.rate.toFixed(3)}）`;
    }

    function renderVault(){
      $("vaultBalance").textContent = fmtTWD(state.vault.balanceTWD);
      $("vaultSub2").textContent = `当前共有 ${state.vault.records.length} 条记录`;

      const box = $("vaultRecords");
      const records = [...state.vault.records].sort((a,b)=> (b.at||"").localeCompare(a.at||""));
      if(records.length === 0){
        box.innerHTML = `<div style="padding:16px;color:var(--muted);font-weight:900;">暂无记录</div>`;
        return;
      }
      box.innerHTML = records.map(r=>{
        const isIn = r.type === "exchange";
        const emoji = r.emoji || (isIn ? "💱" : "🧾");
        const title = r.title || (isIn ? "换台币" : "开销");
        const sub = isIn
          ? `${humanTime(r.at)} · Rate ${Number(r.rate||state.rate).toFixed(3)}`
          : `${humanTime(r.at)} · ${r.catText || "开销"}`;
        const topAmt = isIn ? `+${fmtTWD(r.twd)} TWD` : `-${fmtTWD(r.twd)} TWD`;
        const botAmt = isIn ? `RM ${fmtRM(r.rm)}` : ``;
        return `
          <div class="recordItem" data-open-vault="${r.id}">
            <div class="recLeft">
              <div class="emoji">${emoji}</div>
              <div class="recMeta">
                <p class="recTitle">${escapeHTML(title)}</p>
                <p class="recSub">${escapeHTML(sub)}</p>
              </div>
            </div>
            <div class="recAmt">
              <p class="topAmt ${isIn ? "pos":"neg"}">${escapeHTML(topAmt)}</p>
              <p class="botAmt">${escapeHTML(botAmt)}</p>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderHistoryModal(){
      const list = $("historyList");
      const items = [...state.history].sort((a,b)=> (b.at||"").localeCompare(a.at||""));
      if(items.length === 0){
        list.innerHTML = `<div style="padding:10px;color:var(--muted);font-weight:900;">暂无历史</div>`;
        return;
      }
      list.innerHTML = items.map(r=>{
        const rm = fmtRM(r.rm ?? calcRMFromTWD(r.twd, r.rate || state.rate));
        const t = `${humanTime(r.at)} · Rate ${Number(r.rate||state.rate).toFixed(3)}`;
        const left = `${fmtTWD(r.twd)} TWD`;
        const right = `RM ${rm}`;
        return `
          <div class="rowCard" data-open-history="${r.id}">
            <div class="rowMain">
              <div class="r1">${escapeHTML((r.emoji||"🕘") + " " + (r.title||"换算记录"))}</div>
              <div class="r2">${escapeHTML(t)}</div>
            </div>
            <div class="rowAmt">
              <div class="rm">${escapeHTML(right)}</div>
              <div class="twd">${escapeHTML(left)}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderAll(){
      renderRate();
      renderCalc();
      renderVault();
      if($("historyModal").classList.contains("show")) renderHistoryModal();
    }

    // ---------------------------
    // Modal
    // ---------------------------
    function openModal(id){
      document.body.classList.add("modal-open");
      $(id).classList.add("show");
      $(id).setAttribute("aria-hidden","false");
      if(id === "historyModal") renderHistoryModal();
      $(id).addEventListener("touchmove", stopTouchMove, {passive:false});
    }
    function closeModal(id){
      $(id).classList.remove("show");
      $(id).setAttribute("aria-hidden","true");
      $(id).removeEventListener("touchmove", stopTouchMove);
      const anyOpen = Array.from(document.querySelectorAll(".backdrop")).some(b=>b.classList.contains("show"));
      if(!anyOpen){
        document.body.classList.remove("modal-open");
      }
    }
    function stopTouchMove(e){
      const inBody = e.target.closest(".mBody");
      if(!inBody) e.preventDefault();
    }

    // ---------------------------
    // Detail modal
    // ---------------------------
    let currentDetailId = null;
    let currentDetailSource = null;

    function openDetailFrom(source, id){
      currentDetailId = id;
      currentDetailSource = source;

      const dataset = source === "vault" ? state.vault.records : state.history;
      const r = dataset.find(x=>x.id===id);
      if(!r) return;

      const isExchange = r.type === "exchange";
      $("detailTitle").textContent = isExchange ? "换汇详情" : "开销详情";
      $("detailSub").textContent = humanTime(r.at) + (isExchange ? ` · Rate ${Number(r.rate||state.rate).toFixed(3)}` : "");

      $("detailIcon").innerHTML = `<div style="font-size:20px;">${r.emoji || (isExchange?"💱":"🧾")}</div>`;

      if(isExchange){
        $("dl1").textContent = "换到的金额";
        $("dv1").textContent = `${fmtTWD(r.twd)} TWD`;
        $("dl2").textContent = "支付金额";
        $("dv2").textContent = `RM ${fmtRM(r.rm)}`;
        $("detailMeta").innerHTML = `<span>汇率：1 MYR = ${Number(r.rate||state.rate).toFixed(3)} TWD</span>`;
      }else{
        $("dl1").textContent = "开销金额";
        $("dv1").textContent = `${fmtTWD(r.twd)} TWD`;
        $("dl2").textContent = "分类";
        $("dv2").textContent = `${r.emoji||"🧾"} ${r.catText||"开销"}`;
        $("detailMeta").innerHTML = ``;
      }

      const canDelete = (id !== DEFAULT_RECORD_ID);
      $("deleteBtn").style.display = canDelete ? "" : "none";

      openModal("detailModal");
    }

    function deleteRecordById(source, id){
      if(id === DEFAULT_RECORD_ID) return; 

      if(source === "history"){
        state.history = state.history.filter(r=>r.id !== id);
      }else{
        state.vault.records = state.vault.records.filter(r=>r.id !== id);
      }

      const sumIn = state.vault.records.filter(r=>r.type==="exchange").reduce((a,r)=>a + (Number(r.twd)||0), 0);
      const sumOut = state.vault.records.filter(r=>r.type==="expense").reduce((a,r)=>a + (Number(r.twd)||0), 0);
      state.vault.balanceTWD = Math.max(0, round2(sumIn - sumOut, 0));

      state = ensureDefault(state);
      saveState();
      renderAll();
    }

    // ---------------------------
    // Actions
    // ---------------------------
    function saveCalcToHistorySilently(){
      const twd = Number(state.calc.input || 0);
      if(!twd || twd <= 0) return;

      const rec = {
        id: uid("hist"),
        type: "exchange",
        emoji: "🧾",
        title: "换算记录",
        rate: state.rate,
        twd: round2(twd, 2),
        rm: calcRMFromTWD(twd, state.rate),
        at: nowISO(),
        note: ""
      };
      state.history.unshift(rec);
      saveState();
    }

    function addVaultExchangeIn(twd, rm, rate){
      const t = Number(twd||0);
      const m = Number(rm||0);
      const r = Number(rate||state.rate||DEFAULT_RATE);

      if(!t || t <= 0 || !m || m <= 0) return;

      const rec = {
        id: uid("vx"),
        type: "exchange",
        emoji: "💱",
        title: "换台币",
        rate: r,
        twd: round2(t, 2),
        rm: round2(m, 2),
        at: nowISO(),
        note: ""
      };

      state.vault.records.unshift(rec);
      state.history.unshift({ ...rec, emoji:"🧾", title:"换算记录" });
      state.vault.balanceTWD = round2(state.vault.balanceTWD + t, 0);
      saveState();
    }

    function addVaultExpense(twd, cat){
      const n = Number(twd || 0);
      if(!n || n <= 0) return;

      const rec = {
        id: uid("exp"),
        type: "expense",
        emoji: cat?.e || "🧾",
        title: cat?.t ? `${cat.e} ${cat.t}` : "开销",
        catText: cat?.t || "开销",
        twd: round2(n, 2),
        at: nowISO()
      };
      state.vault.records.unshift(rec);
      state.vault.balanceTWD = Math.max(0, round2(state.vault.balanceTWD - n, 0));
      saveState();
    }

    // ---------------------------
    // Keypad input logic (calc only)
    // ---------------------------
    function applyKey(k){
      let s = String(state.calc.input ?? "0");

      if(k === "AC"){
        s = "0";
      }else if(k === "BK"){
        s = s.length <= 1 ? "0" : s.slice(0,-1);
        if(s === "-" || s === "" ) s = "0";
      }else if(k === "."){
        if(!s.includes(".")) s += ".";
      }else if(k === "00"){
        if(s === "0") s = "0";
        else s += "00";
      }else if(k === "="){
        // just update state
      }else{
        if(/[0-9]/.test(k)){
          if(s === "0") s = k;
          else s += k;
        }
      }

      if(s.length > 14) s = s.slice(0,14);

      state.calc.input = s;
      saveState();
      renderCalc();
    }

    // ---------------------------
    // Exchange-in logic
    // ---------------------------
    let exMode = "TWD"; 
    function setExMode(mode){
      exMode = mode;
      document.querySelectorAll("#exSegRow .seg").forEach(el=>{
        el.classList.toggle("active", el.getAttribute("data-exmode") === mode);
      });
      $("exInLabel").textContent = mode === "TWD" ? "输入金额（TWD）" : "输入金额（RM）";
      $("exInAmount").value = "";
      recomputeExchangePreview();
      setTimeout(()=>$("exInAmount").focus(), 30);
    }

    function recomputeExchangePreview(){
      const rate = Number(($("exRate").value||"").trim()) || state.rate || DEFAULT_RATE;
      const v = Number(($("exInAmount").value||"").replace(/,/g,"")) || 0;

      if(exMode === "TWD"){
        const twd = v;
        const rm = calcRMFromTWD(twd, rate);
        $("exOutTwd").value = `${fmtTWD(twd)} TWD`;
        $("exOutRm").value = `RM ${fmtRM(rm)}`;
      }else{
        const rm = v;
        const twd = calcTWDFromRM(rm, rate);
        $("exOutTwd").value = `${fmtTWD(twd)} TWD`;
        $("exOutRm").value = `RM ${fmtRM(rm)}`;
      }
    }

    // ---------------------------
    // Init + Events
    // ---------------------------
    let selectedCat = CATS[0];

    function initCats(){
      const row = $("catRow");
      row.innerHTML = CATS.map((c,idx)=>`<div class="chip" data-cat="${idx}">${c.e} ${c.t}</div>`).join("");
      updateCatUI();
    }
    function updateCatUI(){
      document.querySelectorAll("#catRow .chip").forEach((c)=>{
        const idx = Number(c.getAttribute("data-cat"));
        c.classList.toggle("active", CATS[idx] === selectedCat);
      });
    }

    function attachEvents(){
      $("themeBtn").addEventListener("click", ()=>{
        state.ui.dark = !state.ui.dark;
        applyTheme();
      });

      $("resetBtn").addEventListener("click", ()=>{
        state.calc.input = "0";
        saveState();
        renderCalc();
      });

      $("tabCalc").addEventListener("click", ()=>setTab("calc"));
      $("tabVault").addEventListener("click", ()=>setTab("vault"));

      $("historyBtn").addEventListener("click", ()=>openModal("historyModal"));

      // close modals
      document.addEventListener("click", (e)=>{
        const btn = e.target.closest("[data-close]");
        if(!btn) return;
        closeModal(btn.getAttribute("data-close"));
      });

      // click backdrop
      document.querySelectorAll(".backdrop").forEach(b=>{
        b.addEventListener("click", (e)=>{
          if(e.target === b) closeModal(b.id);
        });
      });

      // keypad
      $("kbd").addEventListener("click", (e)=>{
        const b = e.target.closest("[data-key]");
        if(!b) return;
        applyKey(b.getAttribute("data-key"));
      });

      // save calc
      $("saveCalcBtn").addEventListener("click", ()=>{
        saveCalcToHistorySilently();
        renderAll();
      });

      // clear history
      $("clearBtn").addEventListener("click", ()=>{
        state.history = state.history.filter(r=>r.id === DEFAULT_RECORD_ID);
        saveState();
        renderHistoryModal();
        renderAll();
      });

      // open detail
      $("historyList").addEventListener("click", (e)=>{
        const row = e.target.closest("[data-open-history]");
        if(!row) return;
        openDetailFrom("history", row.getAttribute("data-open-history"));
      });
      $("vaultRecords").addEventListener("click", (e)=>{
        const row = e.target.closest("[data-open-vault]");
        if(!row) return;
        openDetailFrom("vault", row.getAttribute("data-open-vault"));
      });

      // delete
      $("deleteBtn").addEventListener("click", ()=>{
        if(!currentDetailId || !currentDetailSource) return;
        deleteRecordById(currentDetailSource, currentDetailId);
        closeModal("detailModal");
      });

      // vault actions
      $("btnExchangeIn").addEventListener("click", ()=>{
        $("exRate").value = state.rate.toFixed(3);
        setExMode("TWD");
        $("exOutTwd").value = `0 TWD`;
        $("exOutRm").value = `RM 0.00`;
        openModal("exchangeInModal");
        setTimeout(()=>$("exInAmount").focus(), 50);
      });

      $("btnExpenseOut").addEventListener("click", ()=>{
        selectedCat = CATS[0];
        $("expTwd").value = "";
        updateCatUI();
        openModal("expenseModal");
        setTimeout(()=>$("expTwd").focus(), 50);
      });

      // exchange logic
      $("exSegRow").addEventListener("click", (e)=>{
        const seg = e.target.closest("[data-exmode]");
        if(!seg) return;
        setExMode(seg.getAttribute("data-exmode"));
      });
      $("exInAmount").addEventListener("input", recomputeExchangePreview);
      $("exRate").addEventListener("input", recomputeExchangePreview);

      $("confirmExchangeIn").addEventListener("click", ()=>{
        const rate = Number(($("exRate").value||"").trim()) || state.rate || DEFAULT_RATE;
        const v = Number(($("exInAmount").value||"").replace(/,/g,"")) || 0;
        if(!v || v<=0) return;

        if(exMode === "TWD"){
          const twd = v;
          const rm = calcRMFromTWD(twd, rate);
          addVaultExchangeIn(twd, rm, rate);
        }else{
          const rm = v;
          const twd = calcTWDFromRM(rm, rate);
          addVaultExchangeIn(twd, rm, rate);
        }

        closeModal("exchangeInModal");
        renderAll();
      });

      // expense
      $("confirmExpense").addEventListener("click", ()=>{
        const v = Number(($("expTwd").value||"").replace(/,/g,"")) || 0;
        if(!v || v<=0) return;
        addVaultExpense(v, selectedCat);
        closeModal("expenseModal");
        renderAll();
      });

      $("catRow").addEventListener("click", (e)=>{
        const chip = e.target.closest("[data-cat]");
        if(!chip) return;
        const idx = Number(chip.getAttribute("data-cat"));
        selectedCat = CATS[idx] || CATS[0];
        updateCatUI();
      });
    }

    (function boot(){
      initCats();
      attachEvents();
      applyTheme();
      setTab(state.ui.tab || "calc");
    })();
  </script>
</body>
</html>
