<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>UsTrip Finance v19.1</title>
  <style>
    :root{
      --bg1:#eef6ff;
      --bg2:#e9fbf1;
      --card:#ffffffcc;
      --card2:#ffffffea;
      --stroke:#dfe8f3;
      --text:#0e1726;
      --muted:#6b7a90;
      --shadow: 0 20px 60px rgba(16,24,40,.10);
      --shadow2: 0 10px 30px rgba(16,24,40,.10);
      --radius: 28px;
      --radius2: 22px;
      --accent:#15b981;
      --accent2:#2f7dff;
      --danger:#ff4d4f;
      --bottomH: 84px;
      --tabH: 84px;
      --kbdH: 0px;
      --safeB: env(safe-area-inset-bottom, 0px);
      --safeT: env(safe-area-inset-top, 0px);
    }
    html,body{height:100%;}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC","Microsoft YaHei", Segoe UI, Roboto, Arial;
      color:var(--text);
      background:
        radial-gradient(1400px 700px at 15% 10%, rgba(46,139,255,.18), transparent 60%),
        radial-gradient(1200px 700px at 80% 20%, rgba(18,200,140,.18), transparent 60%),
        linear-gradient(180deg, #f6fbff, #f3f7ff 35%, #f6fbff);
      overflow:hidden; 
    }
    body.dark{
      --bg1:#0a1222;
      --bg2:#071a16;
      --card:#0f1a2b99;
      --card2:#0f1a2bea;
      --stroke:#1f2b44;
      --text:#eaf0ff;
      --muted:#a9b6cf;
      --shadow: 0 30px 90px rgba(0,0,0,.45);
      --shadow2: 0 16px 48px rgba(0,0,0,.35);
      background:
        radial-gradient(1400px 700px at 15% 10%, rgba(46,139,255,.16), transparent 60%),
        radial-gradient(1200px 700px at 80% 20%, rgba(18,200,140,.12), transparent 60%),
        linear-gradient(180deg, #070c16, #070c16 35%, #060b14);
    }

    body.modal-open{overflow:hidden;touch-action:none;}
    body.modal-open .content{overflow:hidden !important;touch-action:none;}

    *{box-sizing:border-box;}
    button{font:inherit;}
    .app{height:100%;display:flex;flex-direction:column;}

    /* Top */
    .top{
      padding: calc(14px + var(--safeT)) 18px 12px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      flex:0 0 auto;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0;}
    .logo{
      width:48px;height:48px;border-radius:16px;
      background: linear-gradient(135deg, rgba(21,185,129,.95), rgba(46,139,255,.25));
      display:grid;place-items:center;
      box-shadow: var(--shadow2);
      border:1px solid rgba(255,255,255,.35);
      flex:0 0 auto;
    }
    .logo svg{opacity:.95; width:26px; height:26px;}
    .titleWrap{min-width:0;}
    .title{
      font-size:34px;letter-spacing:.5px;font-weight:900;margin:0;line-height:1.05;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .subtitle{
      margin:4px 0 0;color:var(--muted);font-size:13px;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }

    .topActions{display:flex;align-items:center;gap:10px;flex:0 0 auto;}
    .iconBtn{
      width:52px;height:52px;border-radius:18px;
      border:1px solid var(--stroke);
      background: var(--card2);
      box-shadow: var(--shadow2);
      display:grid;place-items:center;
      cursor:pointer;
      transition: transform .12s ease;
      position:relative;
    }
    .iconBtn:active{transform: scale(.95);}
    .moonDot{
      position:absolute;right:10px;top:10px;width:10px;height:10px;border-radius:999px;
      background: var(--accent);box-shadow: 0 0 0 3px rgba(21,185,129,.18);
      opacity:0;transform:scale(.9);transition:.2s;
    }
    body.dark .moonDot{opacity:1; transform:scale(1);}

    /* Content */
    .content{
      flex:1 1 auto;
      overflow:auto;
      padding: 10px 16px calc(var(--bottomH) + 14px);
      -webkit-overflow-scrolling:touch;
    }
    .content::-webkit-scrollbar{width:0px;}

    .panel{max-width: 980px;margin: 0 auto;display:flex;flex-direction:column;gap:14px;}

    .pillRow{display:flex;justify-content:space-between;align-items:center;gap:10px;}
    .pill{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 14px;border-radius:999px;
      border:1px solid var(--stroke);
      background: var(--card2);
      box-shadow: var(--shadow2);
      color:var(--text);font-weight:700;letter-spacing:.2px;
    }
    .pill small{font-weight:800;color:var(--muted);}
    .pill .dot{width:10px;height:10px;border-radius:99px;background: var(--accent);box-shadow: 0 0 0 4px rgba(21,185,129,.15);}
    .pillBtn{
        cursor:pointer; padding:10px 14px; border-radius:999px; border:1px solid var(--stroke); 
        background:var(--card2); font-weight:800; display:flex; gap:6px; align-items:center;
        box-shadow: var(--shadow2); transition: transform .1s;
    }
    .pillBtn:active{transform:scale(0.95);}

    /* Exchange Cards */
    .exchangeCard{
      border:1px solid var(--stroke);border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.80), rgba(255,255,255,.55));
      box-shadow: var(--shadow);overflow:hidden;
    }
    body.dark .exchangeCard{background: linear-gradient(180deg, rgba(15,26,43,.70), rgba(15,26,43,.45));}
    .exchangeGrid{display:grid;grid-template-columns: 1fr 1fr;gap:0;}
    .side{padding:16px 18px;min-height: 140px;display:flex;flex-direction:column;justify-content:space-between;}
    .side.left{background: linear-gradient(180deg, rgba(47,125,255,.12), rgba(47,125,255,.04));border-right:1px solid var(--stroke);}
    .side.right{background: linear-gradient(180deg, rgba(21,185,129,.12), rgba(21,185,129,.04));}
    body.dark .side.left{background: linear-gradient(180deg, rgba(47,125,255,.16), rgba(47,125,255,.05));}
    body.dark .side.right{background: linear-gradient(180deg, rgba(21,185,129,.14), rgba(21,185,129,.05));}

    .sideTop{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;color:var(--muted);font-size:13px;}
    .tag{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;border-radius:999px;border:1px solid var(--stroke);
      background: rgba(255,255,255,.65);color:var(--text);font-weight:900;
    }
    body.dark .tag{background: rgba(15,26,43,.55);}
    .tag .miniDot{width:10px;height:10px;border-radius:99px;}
    .miniDot.blue{background: var(--accent2);}
    .miniDot.green{background: var(--accent);}

    .bigLine{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
    .big{font-size:52px;line-height:1;font-weight:1000;letter-spacing:1px;font-variant-numeric: tabular-nums;word-break:break-all;}
    .unit{font-weight:900;color:var(--muted);font-size:16px;}
    
    .hintRow{
      padding: 12px 16px;border-top:1px solid var(--stroke);
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      background: linear-gradient(90deg, rgba(47,125,255,.06), rgba(21,185,129,.06));
    }
    .saveBtn{
      border:none;cursor:pointer;padding: 12px 20px;border-radius: 999px;
      background: linear-gradient(135deg, rgba(21,185,129,.95), rgba(21,185,129,.75));
      color:white;font-weight:1000;box-shadow: 0 10px 30px rgba(21,185,129,.25);
      display:inline-flex;align-items:center;gap:8px;
      transition: transform .1s;
    }
    .saveBtn:active{transform:scale(0.98);}

    /* Vault */
    .vaultHero{
      border:1px solid var(--stroke);border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(14,23,38,.92), rgba(14,23,38,.75));
      color:#f4f7ff;box-shadow: var(--shadow);overflow:hidden;
      padding:18px;position:relative;
    }
    body.dark .vaultHero{background: linear-gradient(135deg, rgba(8,12,20,.92), rgba(10,16,28,.78));}
    .vaultHero .rateBadge{
      position:absolute;right:16px;top:16px;padding:10px 12px;border-radius:999px;
      background: rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);font-weight:900;
    }
    .vaultHero .balance{font-size:64px;font-weight:1100;letter-spacing:1px;margin:8px 0 10px;}

    .vaultActions{display:grid;grid-template-columns: 1fr 1fr;gap:12px;}
    .actionCard{
      border:1px solid var(--stroke);border-radius: var(--radius);background: var(--card2);
      box-shadow: var(--shadow2);padding:14px;display:flex;align-items:center;gap:12px;
      cursor:pointer;transition: transform .1s;
    }
    .actionCard:active{transform:scale(0.98);}
    .actionIcon{
      width:54px;height:54px;border-radius:18px;display:grid;place-items:center;
      border:1px solid var(--stroke);background: linear-gradient(180deg, rgba(255,255,255,.78), rgba(255,255,255,.55));
    }
    body.dark .actionIcon{background: rgba(15,26,43,.55);}

    .records{border:1px solid var(--stroke);border-radius: var(--radius);background: var(--card2);overflow:hidden;}
    .recordItem{
      padding:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;
      cursor:pointer;border-top:1px solid rgba(120,140,180,.14);
    }
    .recordItem:first-child{border-top:none;}
    .recLeft{display:flex;align-items:center;gap:12px;}
    .emoji{
        width:44px;height:44px;border-radius:16px;display:grid;place-items:center;
        border:1px solid var(--stroke);background: rgba(255,255,255,.6);font-size:22px;
    }
    body.dark .emoji{background: rgba(15,26,43,.55);}
    .recAmt{text-align:right;}
    .pos{color: var(--accent);} .neg{color: #ff5a5f;}

    /* Bottom Fixed */
    .bottom{
      position:fixed;left:0;right:0;bottom:0;
      padding: 10px 16px calc(10px + var(--safeB));
      pointer-events:none;z-index:50;
    }
    .bottomInner{max-width: 980px;margin:0 auto;display:flex;flex-direction:column;gap:10px;pointer-events:none;}

    .tabBar{
      pointer-events:auto;border:1px solid var(--stroke);border-radius: 999px;
      background: var(--card2);box-shadow: var(--shadow);display:grid;grid-template-columns: 1fr 1fr;
      height: var(--tabH);align-items:stretch;overflow:hidden;
    }
    .tabBtn{
      border:none;background: transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;
      gap:10px;font-weight:1000;font-size:16px;color:var(--muted);transition: 0.2s;
    }
    .tabBtn.active{background: linear-gradient(135deg, rgba(21,185,129,.20), rgba(47,125,255,.12));color: var(--text);}

    /* Keyboard */
    .kbdWrap{pointer-events:auto;display:none;}
    .kbdWrap.show{display:block;}
    .kbd{
      width: 100%;max-width: 600px;margin: 0 auto;border:1px solid var(--stroke);
      border-radius: var(--radius);background: var(--card2);box-shadow: var(--shadow);padding:14px;
    }
    .grid{display:grid;grid-template-columns: repeat(4, 1fr);gap:10px;}
    .key{
      border:none;cursor:pointer;border-radius: 20px;height: 68px;display:grid;place-items:center;
      font-weight:1100;font-size:24px;color:var(--text);background: rgba(255,255,255,.78);
      border:1px solid rgba(160,180,220,.28);box-shadow: 0 4px 0 rgba(16,24,40,.08);transition:0.1s;
    }
    body.dark .key{background: rgba(15,26,43,.62);box-shadow: 0 4px 0 rgba(0,0,0,.25);}
    .key:active{transform:translateY(4px);box-shadow:none;}
    .k-func{background: rgba(255,210,210,.55);color: #e22b2b;}
    .k-op{background: rgba(21,185,129,.14);color: #0f9c67;}
    .tallEq{height:100%;background:var(--accent);color:#fff;grid-row:span 2;}

    @media (max-width: 400px){
        .big{font-size:42px;}
        .key{height:60px;}
    }

    /* Modals */
    .backdrop{
      position:fixed;inset:0;background: rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;backdrop-filter:blur(4px);
    }
    .backdrop.show{display:flex;}
    .modal{
      width: min(100%, 420px); border-radius: 32px; border:1px solid var(--stroke);
      background: var(--card2); box-shadow: var(--shadow); overflow:hidden; display:flex;flex-direction:column;
    }
    .mHead{padding:18px;display:flex;justify-content:space-between;align-items:center;}
    .mTitle{font-size:20px;font-weight:1100;}
    .mClose{width:40px;height:40px;border-radius:12px;background:rgba(0,0,0,0.05);display:grid;place-items:center;cursor:pointer;}
    .mBody{padding:0 18px 18px; overflow-y:auto; max-height:70vh;}

    .field{background:rgba(255,255,255,0.5); border:1px solid var(--stroke); border-radius:18px; padding:12px;}
    body.dark .field{background:rgba(255,255,255,0.05);}
    
    /* 🌟 New Input Group */
    .input-group{
        display:flex; align-items:center; justify-content:space-between;
        background:var(--card); border:2px solid transparent; border-radius:20px; padding:12px;
        transition:0.2s; margin-top:8px;
    }
    .input-group:focus-within{border-color:var(--accent); box-shadow:0 0 0 4px rgba(21,185,129,0.15);}
    .input-group input{
        border:none; background:transparent; font-size:28px; font-weight:900; width:100%; outline:none; color:var(--text);
    }
    .suffix-btn{
        background:var(--bg2); color:var(--accent2); padding:8px 16px; border-radius:12px; font-weight:800; font-size:14px;
        cursor:pointer; user-select:none; white-space:nowrap; border:1px solid rgba(0,0,0,0.05);
    }
    .suffix-btn:active{transform:scale(0.95);}

    .catGrid{display:grid;grid-template-columns: repeat(5, 1fr); gap:8px; margin-top:12px;}
    .catItem{
        display:flex; flex-direction:column; align-items:center; padding:10px 4px; border-radius:16px; border:1px solid transparent; cursor:pointer;
    }
    .catItem.active{background:rgba(21,185,129,0.1); border-color:var(--accent);}
    .catEmoji{font-size:24px;}
    .catName{font-size:10px; font-weight:bold; margin-top:4px; color:var(--muted);}

    .mainBtn{
        width:100%; padding:16px; border-radius:18px; border:none; background:var(--ink); color:var(--card);
        font-size:18px; font-weight:900; margin-top:20px; cursor:pointer; box-shadow:0 10px 20px rgba(0,0,0,0.1);
    }
    .mainBtn:active{transform:scale(0.98);}
  </style>
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <div class="logo">
           <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M12 12h.01"/></svg>
        </div>
        <div class="titleWrap">
          <h1 class="title" id="pageTitle">换算</h1>
          <p class="subtitle" id="pageSub">TWD ⇄ MYR</p>
        </div>
      </div>
      <div class="topActions">
        <div class="iconBtn" onclick="window.app.toggleTheme()"><span style="font-size:20px">🌓</span></div>
      </div>
    </div>

    <div class="content">
      <div class="panel">
        
        <div id="viewCalc">
          <div class="pillRow">
            <div class="pill"><span class="dot"></span><small>当前汇率</small><span id="rateText">1 : 7.949</span></div>
            <div class="pillBtn" onclick="window.app.openHistory()">
                <span>📜 历史记录</span>
            </div>
          </div>

          <div class="exchangeCard">
            <div class="exchangeGrid">
              <div class="side left">
                <div class="sideTop"><span class="tag">输入</span></div>
                <div class="bigLine"><div class="big blue" id="inBig">0</div><div class="unit">TWD</div></div>
              </div>
              <div class="side right">
                <div class="sideTop"><span class="tag">换算</span></div>
                <div class="bigLine"><div class="unit">RM</div><div class="big green" id="outBig">0.00</div></div>
              </div>
            </div>
            <div class="hintRow">
              <div class="hint" style="font-size:12px; font-weight:bold; color:#aaa">按当前汇率自动计算</div>
              <button class="saveBtn" onclick="window.app.saveCalc()">保存记录</button>
            </div>
          </div>
        </div>

        <div id="viewVault" style="display:none;">
          <div class="vaultHero">
            <div class="rateBadge" id="vaultRate">Rate: 7.949</div>
            <div class="label">台币余额</div>
            <div class="balance" id="vaultBalance">0</div>
            <div class="subRow">
                <span>总入: <span id="vIn">0</span></span>
                <span style="margin-left:12px">总出: <span id="vOut">0</span></span>
            </div>
          </div>

          <div class="vaultActions">
            <div class="actionCard" onclick="window.app.openModal('exchange')">
              <div class="actionIcon">🔄</div>
              <div class="actionText"><h3>换汇存入</h3><p>输入 TWD 或 RM</p></div>
            </div>
            <div class="actionCard" onclick="window.app.openModal('expense')">
              <div class="actionIcon">💸</div>
              <div class="actionText"><h3>记开销</h3><p>选择分类记录</p></div>
            </div>
          </div>

          <div class="sectionTitle">
            <span>最近记录</span>
          </div>
          <div class="records" id="vaultList"></div>
        </div>

      </div>
    </div>

    <div class="bottom">
      <div class="bottomInner">
        <div class="kbdWrap" id="kbdWrap">
          <div class="kbd">
            <div class="grid">
              <button class="key k-func" onclick="window.app.key('AC')">AC</button>
              <button class="key k-func" onclick="window.app.key('DEL')">⌫</button>
              <button class="key k-op" onclick="window.app.key('%')">%</button>
              <button class="key k-op" onclick="window.app.key('/')">÷</button>
              <button class="key" onclick="window.app.key('7')">7</button>
              <button class="key" onclick="window.app.key('8')">8</button>
              <button class="key" onclick="window.app.key('9')">9</button>
              <button class="key k-op" onclick="window.app.key('*')">×</button>
              <button class="key" onclick="window.app.key('4')">4</button>
              <button class="key" onclick="window.app.key('5')">5</button>
              <button class="key" onclick="window.app.key('6')">6</button>
              <button class="key k-op" onclick="window.app.key('-')">-</button>
              <button class="key" onclick="window.app.key('1')">1</button>
              <button class="key" onclick="window.app.key('2')">2</button>
              <button class="key" onclick="window.app.key('3')">3</button>
              <button class="key k-op" onclick="window.app.key('+')">+</button>
              <button class="key span2" onclick="window.app.key('0')">0</button>
              <button class="key" onclick="window.app.key('.')">.</button>
              <button class="key tallEq" onclick="window.app.key('=')">=</button>
            </div>
          </div>
        </div>

        <div class="tabBar">
          <button class="tabBtn" id="tabVault" onclick="window.app.setTab('vault')">
            <span style="font-size:20px">👛</span> 金库
          </button>
          <button class="tabBtn active" id="tabCalc" onclick="window.app.setTab('calc')">
            <span style="font-size:20px">🧮</span> 换算
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="backdrop" id="modalExchange">
    <div class="modal">
      <div class="mHead">
        <div class="mTitle">换汇存入</div>
        <div class="mClose" onclick="window.app.closeModal('modalExchange')">✕</div>
      </div>
      <div class="mBody">
        <div class="field" style="display:flex; justify-content:space-between; align-items:center;">
            <div style="font-size:12px; color:var(--muted); font-weight:800;">当前汇率 (100 TWD)</div>
            <div style="display:flex; align-items:center; gap:8px;">
                <input type="number" id="exRateInput" value="12.63" style="width:60px; font-weight:bold; text-align:center; border:1px solid #ddd; padding:4px; border-radius:8px;">
                <span style="font-size:12px; font-weight:900;">MYR</span>
            </div>
        </div>

        <div style="margin-top:16px;">
            <div style="font-size:12px; margin-bottom:4px; font-weight:800; color:var(--muted);">输入金额</div>
            <div class="input-group">
                <input type="number" id="exAmount" placeholder="0" oninput="window.app.calcExPreview()">
                <div class="suffix-btn" id="exCcyBtn" onclick="window.app.toggleExCcy()">TWD ⇄</div>
            </div>
        </div>

        <div style="margin-top:16px; background:rgba(0,0,0,0.03); padding:12px; border-radius:16px; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:12px; font-weight:800; color:var(--muted)">自动换算为</span>
            <span style="font-size:20px; font-weight:900; color:var(--accent)" id="exPreview">0.00 MYR</span>
        </div>

        <button class="mainBtn" onclick="window.app.confirmExchange()">确认存入</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="modalExpense">
    <div class="modal">
      <div class="mHead">
        <div class="mTitle">记录开销</div>
        <div class="mClose" onclick="window.app.closeModal('modalExpense')">✕</div>
      </div>
      <div class="mBody">
        <div class="catGrid" id="catGrid"></div>
        
        <div style="margin-top:20px;">
            <div style="font-size:12px; margin-bottom:4px; font-weight:800; color:var(--muted);">金额 (TWD)</div>
            <div class="input-group">
                <input type="number" id="expAmount" placeholder="0">
                <span style="font-weight:900; color:var(--accent); margin-right:8px;">TWD</span>
            </div>
        </div>

        <button class="mainBtn" onclick="window.app.confirmExpense()">确认记账</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="modalHistory">
    <div class="modal">
        <div class="mHead">
            <div class="mTitle">历史记录</div>
            <div style="display:flex; gap:12px;">
                <span style="font-size:12px; font-weight:bold; color:var(--danger); cursor:pointer;" onclick="window.app.clearHistory()">清空</span>
                <div class="mClose" onclick="window.app.closeModal('modalHistory')">✕</div>
            </div>
        </div>
        <div class="mBody" id="histList"></div>
    </div>
  </div>

<script>
// --------------------------------------------------------
// CORE LOGIC (No Framework)
// --------------------------------------------------------
window.app = {
    data: {
        records: [],
        history: [],
        rate: 12.63, // 100 TWD = 12.63 MYR
        calcIn: '0',
        exCcy: 'TWD',
        expCatIdx: 0,
        theme: 'light'
    },
    cats: [
        {e:'🍔',n:'饮食'}, {e:'🚗',n:'交通'}, {e:'🛍️',n:'购物'}, {e:'🎮',n:'娱乐'},
        {e:'🏨',n:'住宿'}, {e:'🍦',n:'零食'}, {e:'🎁',n:'礼物'}, {e:'📦',n:'其他'}
    ],

    init() {
        // Load data
        const raw = localStorage.getItem('ustrip_v19_1');
        if(raw) {
            try { this.data = {...this.data, ...JSON.parse(raw)}; } catch(e){}
        }
        if(!this.data.records) this.data.records = [];
        if(!this.data.history) this.data.history = [];

        this.renderTheme();
        this.renderAll();
        this.renderCats();
        
        // Listeners for rate input changes
        document.getElementById('exRateInput').addEventListener('input', (e) => {
            this.data.rate = parseFloat(e.target.value) || 1;
            this.save();
            this.renderAll();
            this.calcExPreview();
        });
    },

    save() {
        localStorage.setItem('ustrip_v19_1', JSON.stringify(this.data));
    },

    toggleTheme() {
        this.data.theme = this.data.theme === 'light' ? 'dark' : 'light';
        this.renderTheme();
        this.save();
    },
    renderTheme() {
        document.body.className = this.data.theme === 'dark' ? 'dark' : '';
    },

    setTab(t) {
        document.getElementById('viewCalc').style.display = t === 'calc' ? 'block' : 'none';
        document.getElementById('viewVault').style.display = t === 'vault' ? 'block' : 'none';
        document.getElementById('tabCalc').className = t === 'calc' ? 'tabBtn active' : 'tabBtn';
        document.getElementById('tabVault').className = t === 'vault' ? 'tabBtn active' : 'tabBtn';
        document.getElementById('kbdWrap').style.display = t === 'calc' ? 'block' : 'none';
        document.getElementById('pageTitle').innerText = t === 'calc' ? '换算' : '我的金库';
        
        // Adjust style for bottom safe area
        const kbdHeight = t === 'calc' ? '300px' : '0px'; // Approx
        // Actually CSS handles display none/block
    },

    // --- Calculator ---
    key(k) {
        let s = this.data.calcIn;
        if(k === 'AC') s = '0';
        else if(k === 'DEL') s = s.length > 1 ? s.slice(0, -1) : '0';
        else if(k === '=') {
            try { s = eval(s.replace(/×/g,'*').replace(/÷/g,'/')).toFixed(2); } catch { s = 'Error'; }
        }
        else {
            if(s === '0' && !['.','+','-','*','/'].includes(k)) s = k;
            else s += k;
        }
        this.data.calcIn = s;
        this.renderCalc();
    },
    saveCalc() {
        try {
            const twd = parseFloat(eval(this.data.calcIn.replace(/×/g,'*').replace(/÷/g,'/')));
            if(!twd) return;
            const rate = 100 / this.data.rate; // TWD per MYR
            const rm = twd / rate;
            
            this.data.history.unshift({
                id: Date.now(), twd: twd.toFixed(2), rm: rm.toFixed(2), date: new Date().toLocaleDateString()
            });
            this.save();
            alert('已保存到历史');
            this.data.calcIn = '0';
            this.renderCalc();
        } catch {}
    },
    renderCalc() {
        document.getElementById('inBig').innerText = this.data.calcIn;
        try {
            const val = eval(this.data.calcIn.replace(/×/g,'*').replace(/÷/g,'/'));
            const rate = 100 / this.data.rate;
            const res = val / rate;
            document.getElementById('outBig').innerText = isNaN(res) ? '0.00' : res.toFixed(2);
        } catch {
            document.getElementById('outBig').innerText = '---';
        }
        document.getElementById('rateText').innerText = `100 : ${this.data.rate}`;
    },

    // --- History ---
    openHistory() {
        const list = document.getElementById('histList');
        list.innerHTML = this.data.history.map((h, i) => `
            <div class="recordItem">
                <div class="recLeft">
                    <div style="font-weight:bold; font-size:16px">${h.twd} TWD</div>
                    <div style="font-size:12px; color:var(--muted)">${h.date}</div>
                </div>
                <div style="text-align:right">
                    <div style="font-weight:bold; color:var(--accent)">${h.rm} MYR</div>
                    <button style="border:none; background:rgba(255,0,0,0.1); color:red; padding:4px 8px; border-radius:8px; margin-top:4px; font-size:12px" onclick="window.app.delHist(${i})">删除</button>
                </div>
            </div>
        `).join('') || '<div style="padding:20px; text-align:center; color:#999">暂无记录</div>';
        this.openModal('modalHistory');
    },
    delHist(i) {
        if(confirm('删除?')) {
            this.data.history.splice(i, 1);
            this.save();
            this.openHistory(); // refresh
        }
    },
    clearHistory() {
        if(confirm('清空所有?')) {
            this.data.history = [];
            this.save();
            this.openHistory();
        }
    },

    // --- Exchange Modal ---
    toggleExCcy() {
        this.data.exCcy = this.data.exCcy === 'TWD' ? 'RM' : 'TWD';
        document.getElementById('exCcyBtn').innerText = this.data.exCcy + ' ⇄';
        this.calcExPreview();
    },
    calcExPreview() {
        const amt = parseFloat(document.getElementById('exAmount').value) || 0;
        const rate = 100 / this.data.rate; // TWD per 1 MYR
        
        if (this.data.exCcy === 'TWD') {
            // TWD -> MYR
            const myr = amt / rate;
            document.getElementById('exPreview').innerText = myr.toFixed(2) + ' MYR';
        } else {
            // MYR -> TWD
            const twd = amt * rate;
            document.getElementById('exPreview').innerText = twd.toFixed(0) + ' TWD';
        }
    },
    confirmExchange() {
        const amt = parseFloat(document.getElementById('exAmount').value);
        if(!amt) return;
        
        let twd = 0, rm = 0;
        const rate = 100 / this.data.rate;

        if (this.data.exCcy === 'TWD') {
            twd = amt; rm = amt / rate;
        } else {
            rm = amt; twd = amt * rate;
        }

        this.data.records.unshift({
            id: Date.now(), type: 'in', title: '换汇存入', twd: twd, rm: rm.toFixed(2), date: new Date().toLocaleDateString()
        });
        this.save();
        this.closeModal('modalExchange');
        this.renderAll();
    },

    // --- Expense Modal ---
    renderCats() {
        const grid = document.getElementById('catGrid');
        grid.innerHTML = this.cats.map((c, i) => `
            <div class="catItem ${this.data.expCatIdx === i ? 'active' : ''}" onclick="window.app.selectCat(${i})">
                <div class="catEmoji">${c.e}</div>
                <div class="catName">${c.n}</div>
            </div>
        `).join('');
    },
    selectCat(i) {
        this.data.expCatIdx = i;
        this.renderCats();
    },
    confirmExpense() {
        const amt = parseFloat(document.getElementById('expAmount').value);
        if(!amt) return;
        const cat = this.cats[this.data.expCatIdx];
        
        this.data.records.unshift({
            id: Date.now(), type: 'out', title: cat.e + ' ' + cat.n, twd: amt, date: new Date().toLocaleDateString()
        });
        this.save();
        this.closeModal('modalExpense');
        this.renderAll();
    },

    // --- Global Render ---
    renderAll() {
        // Vault
        let totalIn = 0, totalOut = 0;
        this.data.records.forEach(r => {
            if(r.type === 'in') totalIn += parseFloat(r.twd);
            else totalOut += parseFloat(r.twd);
        });
        document.getElementById('vaultBalance').innerText = (totalIn - totalOut).toFixed(0);
        document.getElementById('vIn').innerText = totalIn.toFixed(0);
        document.getElementById('vOut').innerText = totalOut.toFixed(0);

        document.getElementById('vaultList').innerHTML = this.data.records.map((r, i) => `
            <div class="recordItem">
                <div class="recLeft">
                    <div class="emoji">${r.type==='in' ? '🔄' : r.title.split(' ')[0]}</div>
                    <div>
                        <div style="font-weight:bold">${r.title}</div>
                        <div style="font-size:12px; color:var(--muted)">${r.date}</div>
                    </div>
                </div>
                <div class="recAmt ${r.type==='in'?'pos':'neg'}">
                    ${r.type==='in'?'+':'-'}${parseFloat(r.twd).toFixed(0)}
                </div>
            </div>
        `).join('');
        
        // Settings inputs
        if(document.getElementById('exRateInput'))
            document.getElementById('exRateInput').value = this.data.rate;
    },

    // --- Utils ---
    openModal(id) {
        document.getElementById(id).classList.add('show');
        if(id === 'modalExchange') {
            document.getElementById('exAmount').value = '';
            this.calcExPreview();
        }
        if(id === 'modalExpense') {
            document.getElementById('expAmount').value = '';
        }
    },
    closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }
};

window.app.init();
</script>
</body>
</html>
