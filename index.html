<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>UsTrip Finance v20.0</title>
<style>
  :root{
    --bg:#f7fafc;
    --text:#0f172a;
    --muted:#64748b;
    --card:#ffffff;
    --border:#e2e8f0;
    --primary:#10b981;
    --blue:#3b82f6;
    --orange:#f97316;
    --danger:#ef4444;

    --safe-b: env(safe-area-inset-bottom);
    --safe-t: env(safe-area-inset-top);

    --header-h: 64px;
    --tab-h: 74px; /* 不含 safe-area */
    --radius-1: 18px;
    --radius-2: 24px;
    --shadow-1: 0 10px 30px rgba(15, 23, 42, .08);
    --shadow-2: 0 18px 50px rgba(15, 23, 42, .12);
  }

  body.dark{
    --bg:#0b1220;
    --text:#eef2f7;
    --muted:#94a3b8;
    --card:#111b2e;
    --border:#1f2a44;
    --shadow-1: 0 10px 30px rgba(0,0,0,.25);
    --shadow-2: 0 18px 50px rgba(0,0,0,.35);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:-apple-system, system-ui, Segoe UI, Roboto, sans-serif;
    color:var(--text);
    background: radial-gradient(1200px 600px at 20% 0%, rgba(16,185,129,.18), transparent 60%),
                radial-gradient(900px 500px at 90% 10%, rgba(59,130,246,.16), transparent 60%),
                var(--bg);
    overflow:hidden; /* 三段式：页面本体不滚动 */
  }

  /* ====== App Layout: Header / Content / Tab ====== */
  .app{
    height:100%;
    display:flex;
    flex-direction:column;
    padding-top: var(--safe-t);
  }

  .header{
    height: var(--header-h);
    padding: 10px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex: 0 0 auto;
  }

  .header-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }

  .app-icon{
    width:44px; height:44px;
    border-radius:14px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.55), transparent 55%),
                linear-gradient(135deg, rgba(16,185,129,1), rgba(16,185,129,.65));
    display:grid; place-items:center;
    box-shadow: var(--shadow-1);
    flex:0 0 auto;
  }
  .app-icon span{ font-size:20px; filter: drop-shadow(0 6px 10px rgba(0,0,0,.18)); }

  .title-wrap{ min-width:0; }
  .title{
    margin:0;
    font-size:28px;
    font-weight:900;
    letter-spacing:-0.02em;
    line-height:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .subtitle{
    margin-top:4px;
    font-size:12px;
    color:var(--muted);
    font-weight:700;
  }

  .header-right{
    display:flex; align-items:center; gap:10px;
  }

  .icon-btn{
    width:44px; height:44px;
    border-radius:16px;
    border:1px solid var(--border);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    display:grid; place-items:center;
    cursor:pointer;
    box-shadow: 0 10px 25px rgba(15,23,42,.06);
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    user-select:none;
  }
  .icon-btn:hover{ transform: translateY(-1px); box-shadow: var(--shadow-1); }
  .icon-btn:active{ transform: translateY(1px) scale(.98); box-shadow:none; }

  .theme-btn{
    position:relative;
    overflow:hidden;
  }
  .theme-badge{
    position:absolute;
    right:6px; bottom:6px;
    width:10px; height:10px; border-radius:99px;
    background: var(--primary);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--card) 70%, transparent);
    opacity:.9;
  }

  /* ===== Content ===== */
  .content{
    flex: 1 1 auto;
    min-height:0;
    padding: 10px 14px 0;
    position:relative;
  }

  .page{
    height:100%;
    display:none;
  }
  .page.active{ display:flex; flex-direction:column; gap:12px; }

  /* ===== Bottom Tab (fixed) ===== */
  .tabbar{
    flex: 0 0 auto;
    height: calc(var(--tab-h) + var(--safe-b));
    padding: 10px 12px calc(10px + var(--safe-b));
    background: color-mix(in srgb, var(--card) 92%, transparent);
    border-top:1px solid var(--border);
  }

  .tab-inner{
    height: 100%;
    border-radius: 22px;
    border:1px solid var(--border);
    background: color-mix(in srgb, var(--card) 96%, transparent);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 8px;
    gap:8px;
    box-shadow: 0 18px 40px rgba(15,23,42,.10);
  }

  .tab{
    flex:1;
    height:100%;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-weight:900;
    cursor:pointer;
    color: color-mix(in srgb, var(--text) 45%, var(--muted));
    user-select:none;
    transition: background .15s ease, transform .12s ease, color .15s ease;
  }
  .tab span{ font-size:18px; }
  .tab.active{
    background: radial-gradient(900px 90px at 20% 50%, rgba(16,185,129,.16), transparent 60%),
                color-mix(in srgb, var(--card) 86%, rgba(16,185,129,.06));
    color: var(--text);
  }
  .tab:active{ transform: scale(.99); }

  /* ===== Cards / Common ===== */
  .card{
    background: color-mix(in srgb, var(--card) 92%, transparent);
    border:1px solid var(--border);
    border-radius: var(--radius-2);
    box-shadow: var(--shadow-1);
  }

  /* ===== Assets Page ===== */
  .asset-hero{
    padding:18px 18px 16px;
    border-radius: 28px;
    background: linear-gradient(135deg, #0b1220, #0f172a);
    color:#fff;
    border: none;
  }
  body.dark .asset-hero{
    background: linear-gradient(135deg, #0a0f1c, #0e162a);
  }
  .hero-top{
    display:flex; align-items:center; justify-content:space-between;
    opacity:.86;
    font-weight:800;
    font-size:12px;
  }
  .hero-rate{
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.12);
    font-weight:900;
  }
  .hero-balance{
    margin-top:12px;
    font-size:54px;
    font-weight:950;
    letter-spacing:-0.03em;
    line-height:1;
  }
  .hero-sub{
    margin-top:10px;
    display:flex;
    gap:16px;
    font-size:12px;
    opacity:.78;
    font-weight:800;
  }

  .action-row{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
  }
  .action-btn{
    padding: 14px 14px;
    border-radius: 22px;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    box-shadow: var(--shadow-1);
    user-select:none;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .action-btn:hover{ transform: translateY(-1px); box-shadow: var(--shadow-2); }
  .action-btn:active{ transform: translateY(1px) scale(.99); box-shadow:none; }
  .action-icon{
    width:44px; height:44px;
    border-radius:16px;
    display:grid; place-items:center;
    font-size:20px;
    font-weight:900;
  }
  .action-title{
    font-weight:950;
    font-size:16px;
  }
  .action-sub{
    font-size:12px;
    color:var(--muted);
    font-weight:800;
    margin-top:2px;
  }

  .records{
    flex:1;
    min-height:0;
    overflow:auto; /* 金库列表可以滚动 */
    padding-bottom: 10px;
  }

  .rec{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 12px 12px;
    border-radius: 18px;
    background: color-mix(in srgb, var(--card) 92%, transparent);
    border:1px solid var(--border);
    margin-bottom:10px;
  }
  .rec-left{
    display:flex; align-items:center; gap:10px;
    min-width:0;
  }
  .rec-dot{
    width:12px; height:12px; border-radius:999px;
    background: var(--primary);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 18%, transparent);
    flex:0 0 auto;
  }
  .rec-title{
    font-weight:950;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .rec-meta{
    font-size:11px;
    color:var(--muted);
    font-weight:800;
    margin-top:2px;
  }
  .rec-right{
    text-align:right;
    display:flex;
    align-items:center;
    gap:10px;
    flex:0 0 auto;
  }
  .rec-amt{
    font-weight:950;
    letter-spacing:-.01em;
  }
  .rec-amt small{
    font-weight:900;
    opacity:.7;
    margin-left:6px;
  }
  .rec-subamt{
    font-size:11px;
    color:var(--muted);
    font-weight:900;
  }

  .rec-del{
    width:34px; height:34px;
    border-radius: 12px;
    border:1px solid color-mix(in srgb, var(--danger) 30%, var(--border));
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    display:grid; place-items:center;
    cursor:pointer;
    user-select:none;
    transition: transform .12s ease, background .12s ease;
    font-weight:950;
    color: var(--danger);
  }
  .rec-del:hover{ background: color-mix(in srgb, var(--danger) 16%, transparent); }
  .rec-del:active{ transform: scale(.98); }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 8px 12px;
    border-radius: 999px;
    border:1px solid var(--border);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    font-weight:900;
    color: var(--muted);
    user-select:none;
  }

  /* ===== Calc Page ===== */
  .calc-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }

  .rate-pill{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding: 10px 14px;
    border-radius:999px;
    border:1px solid var(--border);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    font-weight:950;
    color: var(--muted);
    user-select:none;
    white-space:nowrap;
  }
  .rate-pill strong{ color: var(--text); letter-spacing:-.01em; }

  .history-btn{
    padding: 10px 14px;
    border-radius: 999px;
    border:1px solid var(--border);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    cursor:pointer;
    font-weight:950;
    display:inline-flex;
    gap:8px;
    align-items:center;
    user-select:none;
  }
  .history-btn:active{ transform: scale(.99); }

  /* 中间内容（不滚动） */
  .calc-mid{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:12px;
    overflow:hidden; /* 关键：不滑动 */
  }

  .swap-card{
    padding: 16px;
    border-radius: 26px;
    background: linear-gradient(90deg,
      color-mix(in srgb, var(--blue) 18%, transparent),
      color-mix(in srgb, var(--primary) 16%, transparent)
    );
    border: 1px solid var(--border);
    box-shadow: var(--shadow-1);
  }

  .swap-grid{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:12px;
    align-items:stretch;
  }

  .side{
    border-radius: 20px;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    padding: 14px 14px;
    position:relative;
    overflow:hidden;
  }

  .side.left::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(500px 150px at 30% 0%, rgba(59,130,246,.18), transparent 55%);
    pointer-events:none;
  }
  .side.right::before{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(500px 150px at 70% 0%, rgba(16,185,129,.16), transparent 55%);
    pointer-events:none;
  }

  .side-top{
    position:relative;
    z-index:1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 10px;
    color: var(--muted);
    font-weight:950;
    font-size:12px;
  }

  .tag{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding: 6px 10px;
    border-radius: 999px;
    border:1px solid var(--border);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    font-weight:950;
    color: var(--text);
    user-select:none;
  }
  .dot{
    width:10px; height:10px; border-radius:999px;
    background: var(--blue);
    box-shadow: 0 0 0 4px rgba(59,130,246,.12);
  }
  .dot.green{
    background: var(--primary);
    box-shadow: 0 0 0 4px rgba(16,185,129,.12);
  }
  .locked{
    opacity:.7;
  }

  .value{
    position:relative;
    z-index:1;
    display:flex;
    align-items:baseline;
    gap:10px;
    font-weight:950;
    letter-spacing:-.03em;
    line-height:1;
  }

  .value .num{
    font-size: 54px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width: 100%;
  }
  .value .unit{
    font-size: 16px;
    font-weight:950;
    opacity:.75;
    white-space:nowrap;
  }

  .value.right .num{ color: var(--primary); }

  .hint{
    position:relative;
    z-index:1;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    font-weight:900;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }

  .save-row{
    display:flex;
    gap:12px;
    align-items:center;
    justify-content:space-between;
  }
  .save-btn{
    width: 100%;
    max-width: 420px;
    margin-left:auto;
    padding: 14px 16px;
    border-radius: 999px;
    border:none;
    cursor:pointer;
    color:#fff;
    font-weight:950;
    background: linear-gradient(135deg, rgba(16,185,129,1), rgba(16,185,129,.72));
    box-shadow: 0 18px 40px rgba(16,185,129,.20);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    user-select:none;
    transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
  }
  .save-btn:hover{ transform: translateY(-1px); }
  .save-btn:active{ transform: translateY(1px) scale(.99); box-shadow:none; }
  .save-btn[disabled]{ opacity:.45; cursor:not-allowed; box-shadow:none; transform:none; }

  /* ===== Keyboard (Fixed) ===== */
  .kbd-wrap{
    flex: 0 0 auto;
    padding-bottom: 12px; /* 给一点喘息 */
  }

  .keyboard{
    width:100%;
    max-width: 600px;        /* 防止宽屏拉伸 */
    margin: 0 auto;          /* 居中 */
    border-radius: 28px;
    border: 1px solid var(--border);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    box-shadow: var(--shadow-2);
    padding: 14px;
  }

  .keys{
    display:grid;
    grid-template-columns: repeat(4, 1fr); /* 3列数字 + 1列运算符 */
    gap: 12px;
    align-items:stretch;
  }

  .key{
    border:1px solid var(--border);
    background: color-mix(in srgb, var(--card) 94%, transparent);
    border-radius: 22px;
    cursor:pointer;
    user-select:none;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:950;
    font-size: 22px;

    min-height: 74px;            /* 手机端不会太扁 */
    aspect-ratio: 1 / 1;         /* 让按键更接近方形 */
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    box-shadow: 0 10px 24px rgba(15,23,42,.06);
  }

  /* 宽屏时稍微高一点 */
  @media (min-width: 900px){
    .key{ min-height: 86px; font-size:24px; }
    .value .num{ font-size: 64px; }
  }

  .key:hover{
    transform: translateY(-1px);
    box-shadow: var(--shadow-1);
  }
  .key:active{
    transform: translateY(1px) scale(.99);
    box-shadow:none;
  }

  .key.fn{
    background: color-mix(in srgb, var(--blue) 10%, var(--card));
    color: color-mix(in srgb, var(--blue) 80%, var(--text));
  }
  .key.ac{
    background: color-mix(in srgb, var(--danger) 10%, var(--card));
    color: var(--danger);
  }
  .key.op{
    background: color-mix(in srgb, var(--primary) 10%, var(--card));
    color: color-mix(in srgb, var(--primary) 85%, var(--text));
  }
  .key.eq{
    background: linear-gradient(135deg, rgba(16,185,129,1), rgba(16,185,129,.70));
    color:#fff;
    border: none;
    box-shadow: 0 20px 40px rgba(16,185,129,.22);
    aspect-ratio: auto; /* 让它可以变大 */
  }
  .key.eq:hover{ box-shadow: 0 24px 50px rgba(16,185,129,.26); }

  /* Grid Placement: 数字在左三列，运算符最右列 */
  .k-ac   { grid-column: 1; grid-row: 1; }
  .k-del  { grid-column: 2; grid-row: 1; }
  .k-dot  { grid-column: 3; grid-row: 1; }
  .k-div  { grid-column: 4; grid-row: 1; }

  .k-7 { grid-column: 1; grid-row: 2; }
  .k-8 { grid-column: 2; grid-row: 2; }
  .k-9 { grid-column: 3; grid-row: 2; }
  .k-mul{ grid-column: 4; grid-row: 2; }

  .k-4 { grid-column: 1; grid-row: 3; }
  .k-5 { grid-column: 2; grid-row: 3; }
  .k-6 { grid-column: 3; grid-row: 3; }
  .k-sub{ grid-column: 4; grid-row: 3; }

  .k-1 { grid-column: 1; grid-row: 4; }
  .k-2 { grid-column: 2; grid-row: 4; }
  .k-3 { grid-column: 3; grid-row: 4; }
  .k-add{ grid-column: 4; grid-row: 4; }

  .k-0  { grid-column: 1 / span 2; grid-row: 5; aspect-ratio:auto; }
  .k-00 { grid-column: 3; grid-row: 5; }
  .k-eq { grid-column: 4; grid-row: 5 / span 1; }

  /* ===== Modal ===== */
  .overlay{
    position:fixed;
    inset:0;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:999;
    padding: 18px;
  }
  .overlay.open{ display:flex; }

  .modal{
    width:min(520px, 100%);
    border-radius: 26px;
    background: color-mix(in srgb, var(--card) 94%, transparent);
    border:1px solid var(--border);
    box-shadow: var(--shadow-2);
    overflow:hidden;
  }
  .modal-h{
    padding: 14px 14px 10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid var(--border);
  }
  .modal-h .t{
    font-weight:950;
    font-size:18px;
  }
  .modal-b{
    padding: 14px;
    max-height: min(70vh, 540px);
    overflow:auto; /* 弹窗内部可滚动 */
  }

  .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:12px;
  }

  .input{
    width:100%;
    padding: 12px 14px;
    font-size: 22px;
    font-weight:950;
    border-radius: 18px;
    border:1px solid var(--border);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    outline:none;
    color: var(--text);
  }

  .seg{
    display:flex;
    border:1px solid var(--border);
    border-radius: 18px;
    overflow:hidden;
    background: color-mix(in srgb, var(--card) 92%, transparent);
  }
  .seg button{
    flex:1;
    padding: 10px 12px;
    border:none;
    cursor:pointer;
    font-weight:950;
    background: transparent;
    color: var(--muted);
  }
  .seg button.active{
    background: linear-gradient(135deg, rgba(16,185,129,.18), transparent);
    color: var(--text);
  }

  .btn{
    width:100%;
    padding: 14px 16px;
    border-radius: 18px;
    border:none;
    cursor:pointer;
    font-weight:950;
    background: #0f172a;
    color:#fff;
  }
  body.dark .btn{ background:#fff; color:#0f172a; }
  .btn:active{ transform: scale(.99); }

  .mini{
    width:auto;
    padding: 10px 12px;
    border-radius: 14px;
    border:1px solid var(--border);
    background: color-mix(in srgb, var(--card) 92%, transparent);
    cursor:pointer;
    font-weight:950;
  }
  .mini.danger{
    border-color: color-mix(in srgb, var(--danger) 30%, var(--border));
    color: var(--danger);
    background: color-mix(in srgb, var(--danger) 10%, transparent);
  }

  /* small helper */
  .muted{ color: var(--muted); font-weight:900; font-size:12px; }
  .divider{ height:1px; background: var(--border); margin: 12px 0; }

</style>
</head>

<body>
<div class="app" id="app">

  <!-- ===== Header (Fixed) ===== -->
  <div class="header">
    <div class="header-left">
      <div class="app-icon"><span>🧾</span></div>
      <div class="title-wrap">
        <h1 class="title" id="hdrTitle">我的金库</h1>
        <div class="subtitle" id="hdrSub">记录换汇与开销</div>
      </div>
    </div>
    <div class="header-right">
      <div class="icon-btn theme-btn" id="themeBtn" title="切换夜间模式">
        <span id="themeIcon">🌙</span>
        <span class="theme-badge" id="themeBadge"></span>
      </div>
    </div>
  </div>

  <!-- ===== Content (Middle) ===== -->
  <div class="content">

    <!-- Assets Page -->
    <div class="page active" id="pageAssets">
      <div class="asset-hero card">
        <div class="hero-top">
          <div>台币余额</div>
          <div class="hero-rate" id="heroRate">1 : 7.949</div>
        </div>
        <div class="hero-balance" id="twdBalance">0</div>
        <div class="hero-sub">
          <div>总存: <span id="sumIn">0</span></div>
          <div>总花: <span id="sumOut">0</span></div>
        </div>
      </div>

      <div class="action-row">
        <div class="action-btn" id="btnDeposit">
          <div class="action-icon" style="background: rgba(59,130,246,.12); color: var(--blue);">💱</div>
          <div>
            <div class="action-title">换汇存入</div>
            <div class="action-sub">可自定义汇率</div>
          </div>
        </div>
        <div class="action-btn" id="btnExpense">
          <div class="action-icon" style="background: rgba(249,115,22,.12); color: var(--orange);">💸</div>
          <div>
            <div class="action-title">记录开销</div>
            <div class="action-sub">用分类快速记账</div>
          </div>
        </div>
      </div>

      <div class="records" id="recordList"></div>
    </div>

    <!-- Calc Page -->
    <div class="page" id="pageCalc">
      <div class="calc-top">
        <div class="rate-pill" id="ratePill">
          <span>⚡</span>
          <span>当前汇率</span>
          <strong id="rateText">1 : 7.949</strong>
          <span class="muted">TWD/MYR</span>
        </div>
        <div class="history-btn" id="btnHistory"><span>🕘</span><span>历史</span></div>
      </div>

      <div class="calc-mid">
        <div class="swap-card" id="swapCard">
          <div class="swap-grid">
            <!-- Left: input -->
            <div class="side left">
              <div class="side-top">
                <div class="tag"><span class="dot"></span><span>输入</span></div>
                <div class="muted">可编辑</div>
              </div>
              <div class="value">
                <div class="num" id="inputTwd">0</div>
                <div class="unit">TWD</div>
              </div>
              <div class="hint">
                <span>你输入的金额</span>
                <span class="pill" id="inputPreview">0 TWD</span>
              </div>
            </div>

            <!-- Right: result (readonly) -->
            <div class="side right">
              <div class="side-top">
                <div class="tag locked"><span class="dot green"></span><span>换算</span></div>
                <div class="muted">仅展示</div>
              </div>
              <div class="value right">
                <div class="num" id="resultRm">0.00</div>
                <div class="unit">RM</div>
              </div>
              <div class="hint">
                <span>自动折合结果</span>
                <span class="pill" id="resultPreview">RM 0.00</span>
              </div>
            </div>
          </div>

          <div class="divider"></div>

          <div class="save-row">
            <div class="muted">点击保存会加入历史记录</div>
            <button class="save-btn" id="btnSaveCalc" disabled>
              <span>💾</span><span>保存</span>
            </button>
          </div>
        </div>

        <!-- Keyboard fixed -->
        <div class="kbd-wrap">
          <div class="keyboard">
            <div class="keys">
              <button class="key ac k-ac"  data-k="AC">AC</button>
              <button class="key fn k-del" data-k="DEL">⌫</button>
              <button class="key fn k-dot" data-k=".">.</button>
              <button class="key op k-div" data-k="/">÷</button>

              <button class="key k-7" data-k="7">7</button>
              <button class="key k-8" data-k="8">8</button>
              <button class="key k-9" data-k="9">9</button>
              <button class="key op k-mul" data-k="*">×</button>

              <button class="key k-4" data-k="4">4</button>
              <button class="key k-5" data-k="5">5</button>
              <button class="key k-6" data-k="6">6</button>
              <button class="key op k-sub" data-k="-">-</button>

              <button class="key k-1" data-k="1">1</button>
              <button class="key k-2" data-k="2">2</button>
              <button class="key k-3" data-k="3">3</button>
              <button class="key op k-add" data-k="+">+</button>

              <button class="key k-0" data-k="0">0</button>
              <button class="key fn k-00" data-k="00">00</button>
              <button class="key eq k-eq" data-k="=">=</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /content -->

  <!-- ===== Tab (Fixed) ===== -->
  <div class="tabbar">
    <div class="tab-inner">
      <div class="tab active" id="tabAssets"><span>👛</span><div>金库</div></div>
      <div class="tab" id="tabCalc"><span>🧮</span><div>换算</div></div>
    </div>
  </div>
</div>

<!-- ===== Modal ===== -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<script>
(function(){
  const STORE_KEY = "ustrip_v20";
  const PINNED_ID = "PINNED_3200_TWD";

  const state = {
    tab: "assets",
    theme: "light",
    rate: 7.949,   // TWD per 1 MYR
    calcExpr: "0",
    history: [],
    records: []
  };

  const cats = [
    { n:"饮食", i:"🍔" }, { n:"交通", i:"🚗" }, { n:"购物", i:"🛍️" }, { n:"娱乐", i:"🎮" }, { n:"住宿", i:"🏨" },
    { n:"零食", i:"🍦" }, { n:"礼物", i:"🎁" }, { n:"医疗", i:"💊" }, { n:"生活", i:"💡" }, { n:"其他", i:"📦" }
  ];

  // ---- Helpers
  const $ = (id)=>document.getElementById(id);
  const fmtTwd = (n)=> `${stripZeros(n)} TWD`;
  const fmtRm  = (n)=> `RM ${stripZeros(n,2)}`;
  function stripZeros(num, fixed=null){
    if(num === "" || num === null || num === undefined) return "0";
    const x = Number(num);
    if(!isFinite(x)) return "0";
    if(fixed === null){
      // integer-like
      const s = String(x);
      if(s.includes(".")){
        const t = x.toFixed(8).replace(/0+$/,'').replace(/\.$/,'');
        return t;
      }
      return s;
    }
    return x.toFixed(fixed);
  }

  function nowId(){ return Date.now() + Math.random(); }

  function load(){
    try{
      const raw = localStorage.getItem(STORE_KEY);
      if(raw){
        const saved = JSON.parse(raw);
        Object.assign(state, saved || {});
      }
    }catch(e){}

    // theme apply
    document.body.classList.toggle("dark", state.theme === "dark");
    updateThemeIcon();

    // ensure pinned record exists
    ensurePinnedRecord();

    // sanitize arrays
    if(!Array.isArray(state.records)) state.records = [];
    if(!Array.isArray(state.history)) state.history = [];
  }

  function save(){
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }

  function ensurePinnedRecord(){
    if(!Array.isArray(state.records)) state.records = [];
    const exists = state.records.some(r => r.id === PINNED_ID);
    if(!exists){
      // 默认记录：3200 TWD / RM 402.55（不可删）
      state.records.unshift({
        id: PINNED_ID,
        type: "in",
        title: "💱 换汇存入",
        twd: 3200,
        rm: 402.55,
        rate: 7.949,
        pinned: true,
        createdAt: Date.now() - 86400000
      });
    }
  }

  function setTab(tab){
    state.tab = tab;
    const isAssets = tab === "assets";
    $("pageAssets").classList.toggle("active", isAssets);
    $("pageCalc").classList.toggle("active", !isAssets);
    $("tabAssets").classList.toggle("active", isAssets);
    $("tabCalc").classList.toggle("active", !isAssets);

    $("hdrTitle").textContent = isAssets ? "我的金库" : "换算";
    $("hdrSub").textContent   = isAssets ? "记录换汇与开销" : "输入台币，自动折合马币";

    renderAll();
    save();
  }

  function updateThemeIcon(){
    const dark = document.body.classList.contains("dark");
    $("themeIcon").textContent = dark ? "☀️" : "🌙";
    $("themeBadge").style.background = dark ? "#3b82f6" : "#10b981";
  }

  function toggleTheme(){
    state.theme = (state.theme === "light") ? "dark" : "light";
    document.body.classList.toggle("dark", state.theme === "dark");
    updateThemeIcon();
    save();
  }

  // ----- Assets rendering
  function computeTotals(){
    ensurePinnedRecord();

    const totalIn  = state.records.filter(r=>r.type==="in").reduce((a,b)=>a + Number(b.twd||0), 0);
    const totalOut = state.records.filter(r=>r.type==="out").reduce((a,b)=>a + Number(b.twd||0), 0);
    const balance = totalIn - totalOut;
    return { totalIn, totalOut, balance };
  }

  function renderAssets(){
    const { totalIn, totalOut, balance } = computeTotals();
    $("twdBalance").textContent = stripZeros(balance, 0);
    $("sumIn").textContent = stripZeros(totalIn, 0);
    $("sumOut").textContent = stripZeros(totalOut, 0);

    $("heroRate").textContent = `1 : ${stripZeros(state.rate,3)}`;
    $("rateText").textContent = `1 : ${stripZeros(state.rate,3)}`;

    // list
    const list = $("recordList");
    const items = [...state.records].sort((a,b)=>{
      const ta = (a.pinned ? 1 : 0);
      const tb = (b.pinned ? 1 : 0);
      if(tb !== ta) return tb - ta; // pinned first
      const da = a.createdAt || 0;
      const db = b.createdAt || 0;
      return db - da;
    });

    if(items.length === 0){
      list.innerHTML = `<div class="card" style="padding:18px;border-radius:22px;text-align:center;color:var(--muted);font-weight:900;">暂无记录</div>`;
      return;
    }

    list.innerHTML = items.map(r=>{
      const date = new Date(r.createdAt || Date.now()).toLocaleString(undefined, {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
      const isIn = r.type === "in";
      const twdSign = isIn ? "+" : "-";
      const twdColor = isIn ? "var(--primary)" : "var(--text)";
      const rmText = (r.rm !== undefined && r.rm !== null) ? fmtRm(r.rm) : "";

      const canDelete = !r.pinned && r.id !== PINNED_ID;

      return `
        <div class="rec">
          <div class="rec-left">
            <div class="rec-dot" style="background:${isIn ? "var(--primary)" : "var(--orange)"}; box-shadow:0 0 0 4px ${isIn ? "rgba(16,185,129,.18)" : "rgba(249,115,22,.16)"};"></div>
            <div style="min-width:0">
              <div class="rec-title">${escapeHtml(r.title || (isIn ? "存入" : "开销"))}</div>
              <div class="rec-meta">${date}${r.pinned ? " · 固定记录" : ""}</div>
            </div>
          </div>
          <div class="rec-right">
            <div>
              <div class="rec-amt" style="color:${twdColor}">${twdSign}${stripZeros(r.twd,2)}<small>TWD</small></div>
              <div class="rec-subamt">${rmText}</div>
            </div>
            ${
              canDelete
                ? `<div class="rec-del" title="删除" data-del="${r.id}">✕</div>`
                : `<div class="rec-del" style="opacity:.35;cursor:not-allowed;" title="不可删除">🔒</div>`
            }
          </div>
        </div>
      `;
    }).join("");

    // bind delete
    list.querySelectorAll("[data-del]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-del");
        delRecord(id);
      });
    });
  }

  function delRecord(id){
    // pinned cannot delete
    if(id === PINNED_ID) return;
    const r = state.records.find(x => String(x.id) === String(id));
    if(!r || r.pinned) return;

    if(confirm("删除这条记录？")){
      state.records = state.records.filter(x => String(x.id) !== String(id));
      save();
      renderAssets();
    }
  }

  // ----- Calc logic
  function evalSafe(expr){
    // allow digits, operators, dot, percent
    if(!/^[0-9+\-*/%. ]+$/.test(expr)) return 0;
    try{
      // percent: convert "50%" -> "(50/100)"
      const normalized = expr.replace(/(\d+(\.\d+)?)%/g, "($1/100)");
      const v = Function('"use strict"; return ('+normalized+')')();
      if(typeof v !== "number" || !isFinite(v)) return 0;
      return v;
    }catch(e){
      return 0;
    }
  }

  function getTwdInput(){
    const v = evalSafe(state.calcExpr);
    return v;
  }

  function calcRmFromTwd(twd){
    const rate = Number(state.rate || 1);
    if(!rate || rate <= 0) return 0;
    return twd / rate;
  }

  function renderCalc(){
    $("heroRate").textContent = `1 : ${stripZeros(state.rate,3)}`;
    $("rateText").textContent = `1 : ${stripZeros(state.rate,3)}`;

    const twd = getTwdInput();
    const rm = calcRmFromTwd(twd);

    $("inputTwd").textContent = stripZeros(twd, twd % 1 === 0 ? 0 : 2);
    $("resultRm").textContent = stripZeros(rm, 2);

    $("inputPreview").textContent = fmtTwd(twd);
    $("resultPreview").textContent = fmtRm(rm);

    $("btnSaveCalc").disabled = !(twd > 0);
  }

  function onKey(k){
    const expr = state.calcExpr;

    if(k === "AC"){
      state.calcExpr = "0";
      renderCalc();
      return;
    }
    if(k === "DEL"){
      if(expr.length <= 1){
        state.calcExpr = "0";
      }else{
        state.calcExpr = expr.slice(0,-1);
        if(state.calcExpr === "" || state.calcExpr === "-") state.calcExpr = "0";
      }
      renderCalc();
      return;
    }
    if(k === "="){
      const v = evalSafe(expr);
      // keep up to 4 decimals then strip
      const fixed = Number(v.toFixed(4));
      state.calcExpr = String(fixed).replace(/\.0+$/,'').replace(/(\.\d*?)0+$/,'$1');
      renderCalc();
      return;
    }

    // append
    let next = expr;

    const isOp = ["+","-","*","/","%"].includes(k);
    if(next === "0" && !isOp && k !== "."){
      next = k;
    }else{
      // avoid double operators
      if(isOp){
        if(/[+\-*/%]$/.test(next)) next = next.slice(0,-1) + k;
        else next += k;
      }else if(k === "."){
        // prevent two dots in the current number segment
        const seg = next.split(/[+\-*/%]/).pop() || "";
        if(seg.includes(".")) { /* ignore */ }
        else next += ".";
      }else{
        next += k;
      }
    }

    state.calcExpr = next;
    renderCalc();
  }

  function saveCalcToHistory(){
    const twd = getTwdInput();
    if(!(twd > 0)) return;

    const rm = calcRmFromTwd(twd);

    state.history.unshift({
      id: nowId(),
      twd: Number(twd.toFixed(2)),
      rm: Number(rm.toFixed(2)),
      rate: Number(Number(state.rate).toFixed(3)),
      createdAt: Date.now()
    });

    // reset
    state.calcExpr = "0";
    save();
    renderCalc();
    // 要求：不要跳出通知（不 alert / 不 toast）
  }

  // ----- Modals
  function openModal(title, bodyHtml, footerHtml=""){
    const overlay = $("overlay");
    const modal = $("modal");
    modal.innerHTML = `
      <div class="modal-h">
        <div class="t">${escapeHtml(title)}</div>
        <button class="mini" id="modalClose">✕</button>
      </div>
      <div class="modal-b">
        ${bodyHtml}
        ${footerHtml ? `<div class="divider"></div>${footerHtml}` : ""}
      </div>
    `;
    overlay.classList.add("open");
    $("modalClose").addEventListener("click", closeModal);
    overlay.addEventListener("click", onOverlayClick, { once:true });
  }
  function onOverlayClick(e){
    if(e.target === $("overlay")) closeModal();
  }
  function closeModal(){
    $("overlay").classList.remove("open");
    $("modal").innerHTML = "";
  }

  function openHistory(){
    // pinned history is not requested; only pinned record in vault is required
    const list = Array.isArray(state.history) ? state.history : [];
    const html = list.length
      ? list.map(h=>{
          const date = new Date(h.createdAt||Date.now()).toLocaleString(undefined, {month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit"});
          return `
            <div class="rec" style="margin-bottom:10px;">
              <div class="rec-left">
                <div class="rec-dot" style="background:var(--primary);"></div>
                <div style="min-width:0">
                  <div class="rec-title">${fmtTwd(h.twd)}</div>
                  <div class="rec-meta">${date} · 汇率 1:${stripZeros(h.rate,3)}</div>
                </div>
              </div>
              <div class="rec-right">
                <div style="text-align:right;">
                  <div class="rec-amt" style="color:var(--primary)">${fmtRm(h.rm)}</div>
                  <div class="rec-subamt"></div>
                </div>
                <div class="rec-del" data-hdel="${h.id}" title="删除">✕</div>
              </div>
            </div>
          `;
        }).join("")
      : `<div class="card" style="padding:18px;border-radius:22px;text-align:center;color:var(--muted);font-weight:900;">暂无历史</div>`;

    openModal("历史记录", `
      ${html}
      <div class="divider"></div>
      <button class="mini danger" id="clearHistory" style="width:100%;">清空历史</button>
    `);

    // bind delete
    $("modal").querySelectorAll("[data-hdel]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-hdel");
        state.history = state.history.filter(x => String(x.id) !== String(id));
        save();
        closeModal();
        openHistory();
      });
    });

    $("clearHistory").addEventListener("click", ()=>{
      if(confirm("清空全部历史？")){
        state.history = [];
        save();
        closeModal();
      }
    });
  }

  // ----- Deposit (custom rate + choose input currency)
  function openDeposit(){
    ensurePinnedRecord();

    const body = `
      <div class="row">
        <div class="muted">汇率（TWD/MYR）</div>
        <input class="input" id="depRate" inputmode="decimal" placeholder="7.949" value="${stripZeros(state.rate,3)}" />
      </div>

      <div class="row">
        <div class="muted">输入币种</div>
        <div class="seg" style="flex:1;">
          <button id="segTwd" class="active">输入 TWD</button>
          <button id="segRm">输入 RM</button>
        </div>
      </div>

      <div class="row">
        <div class="muted">输入金额</div>
        <input class="input" id="depAmount" inputmode="decimal" placeholder="0" value="" />
      </div>

      <div class="card" style="padding:14px;border-radius:22px;">
        <div class="muted" style="margin-bottom:8px;">将存入</div>
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;">
          <div style="font-weight:950;font-size:22px;" id="depTwdShow">0 TWD</div>
          <div style="font-weight:950;font-size:22px;color:var(--primary);" id="depRmShow">RM 0.00</div>
        </div>
      </div>

      <div class="divider"></div>
      <button class="btn" id="depConfirm">确认存入</button>
    `;

    openModal("换汇存入", body);

    let mode = "TWD"; // or "RM"
    const depRate = $("depRate");
    const depAmount = $("depAmount");
    const segTwd = $("segTwd");
    const segRm = $("segRm");

    function normalizeRate(){
      const r = Number(depRate.value);
      if(isFinite(r) && r > 0) return r;
      return state.rate || 7.949;
    }

    function calcPreview(){
      const r = normalizeRate();
      const v = Number(depAmount.value);
      const amt = (isFinite(v) && v > 0) ? v : 0;

      let twd=0, rm=0;
      if(mode === "TWD"){
        twd = amt;
        rm = (r>0) ? (amt / r) : 0;
      }else{
        rm = amt;
        twd = amt * r;
      }

      $("depTwdShow").textContent = `${stripZeros(twd, twd%1===0?0:2)} TWD`;
      $("depRmShow").textContent  = `RM ${stripZeros(rm,2)}`;
    }

    segTwd.addEventListener("click", ()=>{
      mode="TWD";
      segTwd.classList.add("active");
      segRm.classList.remove("active");
      depAmount.value = "";
      calcPreview();
      depAmount.focus();
    });
    segRm.addEventListener("click", ()=>{
      mode="RM";
      segRm.classList.add("active");
      segTwd.classList.remove("active");
      depAmount.value = "";
      calcPreview();
      depAmount.focus();
    });

    depRate.addEventListener("input", calcPreview);
    depAmount.addEventListener("input", calcPreview);

    $("depConfirm").addEventListener("click", ()=>{
      const r = normalizeRate();
      const v = Number(depAmount.value);
      if(!(isFinite(v) && v > 0)) return;

      // set global rate to latest user input
      state.rate = Number(r.toFixed(3));

      let twd=0, rm=0;
      if(mode === "TWD"){
        twd = v;
        rm  = v / state.rate;
      }else{
        rm  = v;
        twd = v * state.rate;
      }

      state.records.unshift({
        id: nowId(),
        type: "in",
        title: "💱 换汇存入",
        twd: Number(twd.toFixed(2)),
        rm: Number(rm.toFixed(2)),
        rate: state.rate,
        pinned: false,
        createdAt: Date.now()
      });

      save();
      closeModal();
      renderAll();
    });

    // focus
    setTimeout(()=>depAmount.focus(), 50);
    calcPreview();
  }

  // ----- Expense
  function openExpense(){
    const catButtons = cats.map((c, idx)=>`
      <button class="mini" data-cat="${idx}" style="display:flex;align-items:center;gap:10px;width:100%;justify-content:flex-start;padding:12px 12px;border-radius:18px;margin-bottom:8px;">
        <span style="font-size:22px;">${c.i}</span>
        <span style="font-weight:950;">${escapeHtml(c.n)}</span>
      </button>
    `).join("");

    const body = `
      <div class="muted" style="margin-bottom:10px;">选择分类</div>
      <div id="catList">${catButtons}</div>

      <div class="divider"></div>

      <div class="row">
        <div class="muted">金额</div>
        <input class="input" id="expAmount" inputmode="decimal" placeholder="0" value="" />
      </div>

      <button class="btn" id="expConfirm">确认记账</button>
    `;

    openModal("记录开销", body);

    let selected = 0;
    const expAmount = $("expAmount");
    const catList = $("catList");

    // mark first
    function highlight(){
      [...catList.querySelectorAll("[data-cat]")].forEach(btn=>{
        const on = Number(btn.getAttribute("data-cat")) === selected;
        btn.style.background = on ? "linear-gradient(135deg, rgba(249,115,22,.14), transparent)" : "";
        btn.style.borderColor = on ? "rgba(249,115,22,.35)" : "var(--border)";
        btn.style.color = on ? "var(--text)" : "var(--text)";
      });
    }
    highlight();

    catList.addEventListener("click", (e)=>{
      const btn = e.target.closest("[data-cat]");
      if(!btn) return;
      selected = Number(btn.getAttribute("data-cat")) || 0;
      highlight();
    });

    $("expConfirm").addEventListener("click", ()=>{
      const v = Number(expAmount.value);
      if(!(isFinite(v) && v > 0)) return;
      const c = cats[selected] || cats[0];

      state.records.unshift({
        id: nowId(),
        type: "out",
        title: `${c.i} ${c.n}`,
        twd: Number(v.toFixed(2)),
        rm: null,
        rate: state.rate,
        pinned: false,
        createdAt: Date.now()
      });

      save();
      closeModal();
      renderAll();
    });

    setTimeout(()=>expAmount.focus(), 50);
  }

  // ----- Escape
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function renderAll(){
    // shared rate text
    $("heroRate").textContent = `1 : ${stripZeros(state.rate,3)}`;
    $("rateText").textContent = `1 : ${stripZeros(state.rate,3)}`;
    renderAssets();
    renderCalc();
  }

  // ===== Bind UI
  function bind(){
    $("tabAssets").addEventListener("click", ()=>setTab("assets"));
    $("tabCalc").addEventListener("click", ()=>setTab("calc"));

    $("themeBtn").addEventListener("click", toggleTheme);

    $("btnDeposit").addEventListener("click", openDeposit);
    $("btnExpense").addEventListener("click", openExpense);

    $("btnHistory").addEventListener("click", openHistory);
    $("btnSaveCalc").addEventListener("click", saveCalcToHistory);

    // keyboard
    document.querySelectorAll(".key[data-k]").forEach(btn=>{
      btn.addEventListener("click", ()=>onKey(btn.getAttribute("data-k")));
    });

    // prevent accidental scroll bounce on iOS
    document.addEventListener("touchmove", (e)=>{
      // allow scroll inside .records and modal body only
      const inScrollable = e.target.closest(".records") || e.target.closest(".modal-b");
      if(!inScrollable) e.preventDefault();
    }, { passive:false });
  }

  // ===== init
  load();
  bind();
  setTab(state.tab || "assets");
  renderAll();
})();
</script>
</body>
</html>
