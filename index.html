<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>汇率兑换</title>
  <style>
    :root{
      --primary: #007aff; 
      --text: #1c1c1e; --sub: #8e8e93;
      --glass-bg: #ffffff; 
      --glass-border: 1px solid rgba(0,0,0,0.05);
      --glass-shadow: 0 8px 30px rgba(0,0,0,0.08);
      --bg-color: #f5f5f7;
    }
    @media (prefers-color-scheme: dark) {
      :root{
        --text: #f2f2f7; --sub: #98989d;
        --glass-bg: #1c1c1e;
        --glass-border: 1px solid rgba(255, 255, 255, 0.1);
        --bg-color: #000;
      }
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 20px; background: var(--bg-color); color: var(--text); font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    
    .converter-card { background: var(--glass-bg); border-radius: 24px; border: var(--glass-border); box-shadow: var(--glass-shadow); padding: 24px; width: 100%; max-width: 400px; }
    .card-title { font-size: 20px; font-weight: 800; margin-bottom: 24px; text-align: center; }
    
    .input-group { background: rgba(120,120,128,0.05); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: 0.2s; }
    .input-group:focus-within { border-color: var(--primary); background: rgba(0,122,255,0.03); }
    
    .currency-select { border: none; background: transparent; font-size: 18px; font-weight: 700; color: var(--text); outline: none; -webkit-appearance: none; cursor: pointer; }
    .amount-input { border: none; background: transparent; text-align: right; font-size: 28px; font-weight: 800; color: var(--primary); width: 100%; outline: none; padding-left: 10px; }
    .amount-input::placeholder { color: rgba(120,120,128,0.3); }
    
    .result-group { padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .myr-label { font-size: 18px; font-weight: 700; color: var(--sub); }
    .myr-val { font-size: 32px; font-weight: 800; color: var(--text); }
    
    .rate-hint { text-align: center; font-size: 13px; color: var(--sub); margin-top: 10px; font-weight: 500; background: rgba(120,120,128,0.08); padding: 8px; border-radius: 10px; }
  </style>
</head>
<body>

<div class="converter-card">
  <div class="card-title">汇率兑换</div>
  
  <div class="input-group">
    <select id="currencySelect" class="currency-select" onchange="handleCalculate()">
      <option value="JPY">🇯🇵 JPY</option>
      <option value="THB">🇹🇭 THB</option>
      <option value="TWD">🇹🇼 TWD</option>
      <option value="KRW">🇰🇷 KRW</option>
    </select>
    <input type="number" id="foreignAmount" class="amount-input" placeholder="0" inputmode="decimal" oninput="handleCalculate()">
  </div>

  <div class="result-group">
    <div class="myr-label">🇲🇾 RM</div>
    <div class="myr-val" id="myrResult">0.00</div>
  </div>

  <div class="rate-hint" id="rateHint">
    当前预设加载中...
  </div>
</div>

<script>
  // 预设数据池
  const PRESETS = {
    'JPY': { unit: 100, myrVal: 2.5350 },
    'THB': { unit: 100, myrVal: 12.6000 },
    'TWD': { unit: 100, myrVal: 12.5800 },
    'KRW': { unit: 1000, myrVal: 2.7150 }
  };

  const el = id => document.getElementById(id);
  
  // 核心计算与渲染逻辑
  function handleCalculate() {
      const code = el('currencySelect').value;
      const amount = parseFloat(el('foreignAmount').value) || 0;
      const preset = PRESETS[code];
      
      // 更新下方提示文字 (例如: 100 JPY = RM 2.5350)
      el('rateHint').innerText = `预设汇率：${preset.unit} ${code} = RM ${preset.myrVal.toFixed(4)}`;
      
      // 计算马币
      if(amount > 0) {
          const totalMYR = (amount / preset.unit) * preset.myrVal;
          el('myrResult').innerText = totalMYR.toFixed(2);
      } else {
          el('myrResult').innerText = "0.00";
      }
  }

  // 初始化加载
  handleCalculate();
</script>
</body>
</html>
