<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>换算</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --ink:#0b1324;
      --muted:rgba(11,19,36,.55);
      --line:rgba(11,19,36,.08);

      --green:#14a874;
      --green-weak:rgba(20,168,116,.10);

      --blue:#2b6cff;
      --blue-weak:rgba(43,108,255,.10);

      --shadow:0 18px 40px rgba(0,0,0,.07);
      --radius:26px;

      --tabH:78px; /* 底部tab高度 */
    }
    [data-theme="dark"]{
      --bg:#0b1220;
      --card:#121a2b;
      --ink:#e9eefc;
      --muted:rgba(233,238,252,.58);
      --line:rgba(233,238,252,.10);

      --green:#28d18f;
      --green-weak:rgba(40,209,143,.12);

      --blue:#5c8cff;
      --blue-weak:rgba(92,140,255,.14);

      --shadow:0 18px 40px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", Arial;
      background: radial-gradient(1000px 500px at 20% -10%, rgba(20,168,116,.18), transparent 55%),
                  radial-gradient(900px 500px at 90% 0%, rgba(43,108,255,.14), transparent 55%),
                  var(--bg);
      color:var(--ink);
    }

    /* 顶部栏 */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:18px 18px 10px;
      gap:14px;
    }
    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .appIcon{
      width:52px;height:52px;border-radius:18px;
      background: linear-gradient(145deg, rgba(20,168,116,1), rgba(20,168,116,.65));
      display:grid;place-items:center;
      box-shadow: 0 14px 30px rgba(20,168,116,.25);
      flex:0 0 auto;
    }
    .appIcon svg{opacity:.95}
    .titleWrap{min-width:0}
    .title{
      font-size:38px;
      font-weight:900;
      letter-spacing:-.5px;
      line-height:1;
      margin:0;
    }
    .subtitle{
      margin-top:6px;
      font-size:13px;
      color:var(--muted);
      font-weight:700;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .actions{
      display:flex;
      align-items:center;
      gap:12px;
      flex:0 0 auto;
    }
    .iconBtn{
      width:54px;height:54px;border-radius:20px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      box-shadow: 0 10px 26px rgba(0,0,0,.05);
      display:grid;place-items:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .iconBtn:active{transform:scale(.98)}
    .pillRow{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:8px 18px 10px;
    }
    .ratePill{
      display:flex;
      align-items:center;
      gap:10px;
      padding:14px 16px;
      border-radius:999px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      box-shadow: 0 12px 28px rgba(0,0,0,.05);
      min-width:0;
    }
    .ratePill .bolt{
      width:22px;height:22px;border-radius:10px;
      background:var(--green-weak);
      display:grid;place-items:center;
      color:var(--green);
      font-weight:900;
      flex:0 0 auto;
    }
    .rateText{
      font-weight:900;
      letter-spacing:.2px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .rateText b{color:var(--ink)}
    .rightPill{
      display:flex;align-items:center;gap:10px;
    }
    .histBtn{
      padding:14px 16px;
      border-radius:999px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      box-shadow: 0 12px 28px rgba(0,0,0,.05);
      font-weight:900;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      display:flex;align-items:center;gap:10px;
    }
    .histBtn:active{transform:scale(.99)}

    /* 主体布局：保证键盘永远不被 tab 覆盖 */
    .screen{
      height:calc(100vh - 0px);
      display:flex;
      flex-direction:column;
      padding-bottom: calc(var(--tabH) + env(safe-area-inset-bottom));
    }

    /* 输入/换算展示区（用颜色让用户秒懂左右） */
    .fxPanel{
      margin:6px 18px 10px;
      border-radius: var(--radius);
      background:
        linear-gradient(90deg, var(--blue-weak), transparent 55%),
        linear-gradient(270deg, var(--green-weak), transparent 55%),
        var(--card);
      border:1px solid var(--line);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .fxInner{
      padding:18px 18px 14px;
      display:flex;
      align-items:stretch;
      gap:16px;
    }
    .col{
      flex:1; min-width:0;
      border-radius:22px;
      padding:14px 14px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      border:1px solid rgba(0,0,0,0);
    }
    .col.left{
      background: linear-gradient(180deg, rgba(43,108,255,.12), transparent 70%);
      border:1px solid color-mix(in srgb, var(--blue) 18%, transparent);
    }
    .col.right{
      background: linear-gradient(180deg, rgba(20,168,116,.12), transparent 70%);
      border:1px solid color-mix(in srgb, var(--green) 18%, transparent);
      text-align:right;
    }
    .miniRow{
      display:flex;align-items:center;justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .tag{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border-radius:999px;
      font-size:13px;
      font-weight:900;
      color:var(--muted);
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--card) 75%, transparent);
      user-select:none;
      white-space:nowrap;
    }
    .tag .dot{
      width:10px;height:10px;border-radius:999px;
      background:var(--blue);
      box-shadow:0 0 0 6px rgba(43,108,255,.10);
    }
    .right .tag .dot{
      background:var(--green);
      box-shadow:0 0 0 6px rgba(20,168,116,.10);
    }
    .hint{
      font-size:12px;
      font-weight:900;
      color:rgba(11,19,36,.40);
    }
    [data-theme="dark"] .hint{color:rgba(233,238,252,.42)}
    .bigLine{
      display:flex;
      align-items:baseline;
      gap:12px;
    }
    .right .bigLine{justify-content:flex-end}
    .bigNum{
      font-size:64px;
      font-weight:950;
      letter-spacing:-1.8px;
      line-height:1;
      color:var(--ink);
    }
    .right .bigNum{color:var(--green)}
    .unit{
      font-size:18px;
      font-weight:950;
      color:rgba(11,19,36,.35);
    }
    [data-theme="dark"] .unit{color:rgba(233,238,252,.35)}

    .saveBar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:12px 14px 14px;
      border-top:1px solid var(--line);
      background: linear-gradient(90deg, rgba(43,108,255,.06), rgba(20,168,116,.08));
    }
    .saveText{
      font-weight:950;
      letter-spacing:.2px;
      color:var(--muted);
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .saveText b{color:var(--ink)}
    .saveBtn{
      flex:0 0 auto;
      display:flex;align-items:center;gap:10px;
      padding:14px 18px;
      border-radius:999px;
      background: linear-gradient(135deg, rgba(20,168,116,1), rgba(20,168,116,.72));
      color:white;
      border:none;
      font-weight:950;
      cursor:pointer;
      box-shadow: 0 18px 34px rgba(20,168,116,.28);
      -webkit-tap-highlight-color: transparent;
      user-select:none;
    }
    .saveBtn:active{transform:scale(.99)}
    .saveBtn svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.18))}

    /* 键盘区域：自动填满剩余高度，不留空、不被tab压住 */
    .padWrap{
      flex:1;
      display:flex;
      padding:0 18px 18px;
    }
    .pad{
      width:100%;
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--card) 90%, transparent);
      border:1px solid var(--line);
      box-shadow: var(--shadow);
      padding:14px;
      display:grid;
      grid-template-columns: 1fr 1fr 1fr 1.05fr;
      grid-template-rows: repeat(5, minmax(54px, 1fr));
      gap:14px;
      align-items:stretch;
      min-height: 340px;
    }
    .key{
      border-radius:22px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      display:flex;align-items:center;justify-content:center;
      font-weight:950;
      font-size:28px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 12px 26px rgba(0,0,0,.05);
    }
    .key:active{transform:scale(.99)}
    .key.op{
      background: color-mix(in srgb, var(--blue-weak) 45%, var(--card));
      color: color-mix(in srgb, var(--blue) 75%, var(--ink));
    }
    .key.ac{
      background: rgba(255,60,60,.10);
      color:#ff3b30;
      border-color: rgba(255,60,60,.18);
    }
    .key.eq{
      background: linear-gradient(135deg, rgba(20,168,116,1), rgba(20,168,116,.72));
      color:white;
      border:none;
      box-shadow: 0 18px 34px rgba(20,168,116,.28);
      grid-row: 4 / span 2;
      grid-column: 4;
      font-size:34px;
      border-radius:26px;
    }
    .key.zero{
      grid-column: 1 / span 2;
      justify-content:center;
    }
    .key.back{
      font-size:22px;
    }

    /* 底部 tab：固定在底部，主内容已预留空间，不覆盖键盘 */
    .tabbar{
      position:fixed;
      left:0;right:0;bottom:0;
      height: calc(var(--tabH) + env(safe-area-inset-bottom));
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      display:flex;
      justify-content:center;
      pointer-events:none;
    }
    .tabInner{
      width:min(520px, calc(100% - 24px));
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border:1px solid var(--line);
      border-radius: 26px;
      box-shadow: var(--shadow);
      display:flex;
      overflow:hidden;
      pointer-events:auto;
    }
    .tab{
      flex:1;
      padding:12px 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      font-weight:950;
      color:rgba(11,19,36,.42);
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    [data-theme="dark"] .tab{color:rgba(233,238,252,.48)}
    .tab.active{
      color:var(--ink);
      background: linear-gradient(90deg, rgba(43,108,255,.08), rgba(20,168,116,.10));
    }
    .tab + .tab{border-left:1px solid var(--line)}
    .tab svg{opacity:.9}

    /* 弹窗（历史记录 / 详情） */
    .overlay{
      position:fixed; inset:0;
      background: rgba(0,0,0,.38);
      display:none;
      align-items:center;
      justify-content:center;
      padding:18px;
      z-index:50;
    }
    .overlay.show{display:flex}
    .modal{
      width:min(680px, 100%);
      border-radius: 30px;
      background: var(--card);
      border:1px solid var(--line);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .modalHead{
      display:flex;align-items:center;justify-content:space-between;
      padding:18px 18px 10px;
      gap:12px;
    }
    .modalTitle{
      display:flex;align-items:center;gap:12px;min-width:0;
    }
    .modalTitle h2{
      margin:0;
      font-size:28px;
      font-weight:950;
      letter-spacing:-.4px;
      line-height:1.1;
    }
    .modalTitle p{
      margin:4px 0 0;
      font-size:13px;
      color:var(--muted);
      font-weight:850;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .modalIcon{
      width:52px;height:52px;border-radius:18px;
      background: var(--green-weak);
      display:grid;place-items:center;
      color:var(--green);
      flex:0 0 auto;
    }
    .closeBtn{
      width:52px;height:52px;border-radius:20px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      display:grid;place-items:center;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .closeBtn:active{transform:scale(.99)}
    .modalActions{
      display:flex;
      gap:12px;
      padding:10px 18px 14px;
    }
    .ghostBtn{
      flex:1;
      padding:16px 14px;
      border-radius: 22px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      font-weight:950;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .ghostBtn:active{transform:scale(.99)}
    .dangerBtn{
      flex:1;
      padding:16px 14px;
      border-radius: 22px;
      border:1px solid rgba(255,60,60,.18);
      background: rgba(255,60,60,.10);
      color:#ff3b30;
      font-weight:950;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .dangerBtn:active{transform:scale(.99)}

    .list{
      padding:0 18px 18px;
      display:flex;
      flex-direction:column;
      gap:12px;
      max-height: min(62vh, 560px);
      overflow:auto;
    }
    .item{
      border-radius: 24px;
      border:1px solid var(--line);
      background:
        linear-gradient(90deg, var(--blue-weak), transparent 55%),
        linear-gradient(270deg, var(--green-weak), transparent 55%),
        color-mix(in srgb, var(--card) 96%, transparent);
      padding:14px 14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      cursor:pointer;
      user-select:none;
      -webkit-tap-highlight-color: transparent;
    }
    .item:active{transform:scale(.998)}
    .itemLeft{
      min-width:0;
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .line1{
      display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
      font-weight:950;
      letter-spacing:-.2px;
    }
    .line1 .twd{
      color:var(--ink);
      font-size:26px;
    }
    .line1 .twd small{
      font-size:14px;
      color:rgba(11,19,36,.40);
      font-weight:950;
      margin-left:6px;
    }
    [data-theme="dark"] .line1 .twd small{color:rgba(233,238,252,.38)}
    .chip{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--card) 78%, transparent);
      font-size:13px;
      color:var(--muted);
      font-weight:950;
      white-space:nowrap;
    }
    .line2{
      font-size:13px;
      color:var(--muted);
      font-weight:850;
      display:flex;gap:10px;flex-wrap:wrap;
    }
    .itemRight{
      text-align:right;
      display:flex;
      flex-direction:column;
      gap:6px;
      flex:0 0 auto;
      align-items:flex-end;
    }
    .rm{
      font-size:30px;
      font-weight:950;
      color:var(--green);
      letter-spacing:-.4px;
    }
    .rm small{
      font-size:14px;
      color:rgba(11,19,36,.40);
      font-weight:950;
      margin-left:6px;
    }
    [data-theme="dark"] .rm small{color:rgba(233,238,252,.38)}
    .empty{
      border-radius: 24px;
      border:1px dashed var(--line);
      padding:18px;
      color:var(--muted);
      font-weight:900;
      text-align:center;
      background: color-mix(in srgb, var(--card) 92%, transparent);
    }

    /* 详情弹窗 */
    .detailBody{
      padding:0 18px 18px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .detailCard{
      border-radius: 26px;
      border:1px solid var(--line);
      background:
        linear-gradient(90deg, var(--blue-weak), transparent 55%),
        linear-gradient(270deg, var(--green-weak), transparent 55%),
        color-mix(in srgb, var(--card) 96%, transparent);
      padding:16px 16px;
    }
    .detailTop{
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-start;
    }
    .detailTop .leftBlock{
      display:flex;flex-direction:column;gap:8px;min-width:0;
    }
    .detailTop .rightBlock{
      text-align:right;
      display:flex;flex-direction:column;gap:8px;align-items:flex-end;
    }
    .bigPair{
      display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    }
    .bigPair .num{
      font-size:44px;font-weight:950;letter-spacing:-1px;
    }
    .bigPair .u{
      font-size:16px;font-weight:950;color:rgba(11,19,36,.42);
    }
    [data-theme="dark"] .bigPair .u{color:rgba(233,238,252,.40)}
    .bigPair.rm .num{color:var(--green)}
    .meta{
      font-size:13px;
      color:var(--muted);
      font-weight:850;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .detailBtns{
      display:flex;
      gap:12px;
    }
    .primaryClose{
      flex:1;
      padding:18px 14px;
      border-radius: 22px;
      border:1px solid var(--line);
      background: color-mix(in srgb, var(--card) 92%, transparent);
      font-weight:950;
      cursor:pointer;
    }
    .deleteBtn{
      flex:1;
      padding:18px 14px;
      border-radius: 22px;
      border:1px solid rgba(255,60,60,.18);
      background: rgba(255,60,60,.10);
      color:#ff3b30;
      font-weight:950;
      cursor:pointer;
    }

    /* 小屏优化 */
    @media (max-width:420px){
      .title{font-size:34px}
      .bigNum{font-size:58px}
      .fxInner{gap:12px}
      .col{padding:12px}
      .pad{gap:12px}
      .key{font-size:26px;border-radius:20px}
    }
  </style>
</head>

<body>
  <div class="screen" id="screen">
    <div class="topbar">
      <div class="brand">
        <div class="appIcon" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <rect x="6" y="3.8" width="12" height="16.4" rx="2.2" stroke="white" stroke-width="2"/>
            <path d="M8.5 8.5h7" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M8.5 12h7" stroke="white" stroke-width="2" stroke-linecap="round"/>
            <path d="M8.5 15.5h4.5" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="titleWrap">
          <div class="title">换算</div>
          <div class="subtitle" id="subTitle">输入 TWD，右侧自动折合 RM</div>
        </div>
      </div>

      <div class="actions">
        <div class="iconBtn" id="themeBtn" title="切换主题" aria-label="切换主题">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M21 12.5A8.5 8.5 0 1 1 11.5 3a6.2 6.2 0 0 0 9.5 9.5Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="iconBtn" id="undoBtn" title="撤回输入" aria-label="撤回输入">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M9 9H4V4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 9a8 8 0 1 1 2.4 5.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="pillRow">
      <div class="ratePill" title="目前兑换汇率">
        <div class="bolt">⚡</div>
        <div class="rateText">当前汇率 <b id="rateLabel">1 : 7.949</b> <span style="opacity:.8">TWD/MYR</span></div>
      </div>

      <div class="rightPill">
        <div class="histBtn" id="openHistory">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 12a9 9 0 1 0 3-6.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 4v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 7v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          历史
        </div>
      </div>
    </div>

    <!-- 颜色提示：左输入(蓝) 右换算(绿) -->
    <div class="fxPanel">
      <div class="fxInner">
        <div class="col left">
          <div class="miniRow">
            <div class="tag"><span class="dot"></span> 输入</div>
            <div class="hint">可编辑</div>
          </div>
          <div class="bigLine">
            <span class="bigNum" id="twdValue">0</span>
            <span class="unit">TWD</span>
          </div>
        </div>

        <div class="col right">
          <div class="miniRow">
            <div class="tag"><span class="dot"></span> 换算</div>
            <div class="hint">仅显示</div>
          </div>
          <div class="bigLine">
            <span class="bigNum" id="rmValue">0.00</span>
            <span class="unit">RM</span>
          </div>
        </div>
      </div>

      <div class="saveBar">
        <div class="saveText">用当前汇率 <b id="rateSmall">1 : 7.949</b> 保存这次换算</div>
        <button class="saveBtn" id="saveBtn" type="button" title="保存记录">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M19 21H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h10l6 6v8a2 2 0 0 1-2 2Z" stroke="white" stroke-width="2" stroke-linejoin="round"/>
            <path d="M7 21v-8h10v8" stroke="white" stroke-width="2" stroke-linejoin="round"/>
            <path d="M7 5v4h8" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          保存
        </button>
      </div>
    </div>

    <!-- 键盘：自动填满剩余空间 -->
    <div class="padWrap">
      <div class="pad" id="pad">
        <div class="key ac" data-act="ac">AC</div>
        <div class="key op back" data-act="back">⌫</div>
        <div class="key op" data-act="div">÷</div>
        <div class="key op" data-act="mul">×</div>

        <div class="key" data-act="7">7</div>
        <div class="key" data-act="8">8</div>
        <div class="key" data-act="9">9</div>
        <div class="key op" data-act="sub">−</div>

        <div class="key" data-act="4">4</div>
        <div class="key" data-act="5">5</div>
        <div class="key" data-act="6">6</div>
        <div class="key op" data-act="add">+</div>

        <div class="key" data-act="1">1</div>
        <div class="key" data-act="2">2</div>
        <div class="key" data-act="3">3</div>
        <div class="key eq" data-act="eq">=</div>

        <div class="key zero" data-act="0">0</div>
        <div class="key" data-act="dot">.</div>
      </div>
    </div>
  </div>

  <!-- 底部 Tab（不会覆盖键盘，因为 screen 已预留 padding-bottom） -->
  <div class="tabbar">
    <div class="tabInner">
      <div class="tab" id="tabVault">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="6" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="2"/>
          <path d="M7 10h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        金库
      </div>
      <div class="tab active" id="tabCalc">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="5" y="3" width="14" height="18" rx="2.5" stroke="currentColor" stroke-width="2"/>
          <path d="M8 8h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M8 16h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        换算
      </div>
    </div>
  </div>

  <!-- 历史记录弹窗 -->
  <div class="overlay" id="historyOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modalHead">
        <div class="modalTitle">
          <div class="modalIcon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M3 12a9 9 0 1 0 3-6.7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M3 4v5h5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M12 7v6l4 2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <div style="min-width:0">
            <h2>历史记录</h2>
            <p>点击一条记录查看详情，详情页才提供删除</p>
          </div>
        </div>
        <div class="closeBtn" id="closeHistory" aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="modalActions">
        <button class="ghostBtn" id="exportBtn" type="button">导出</button>
        <button class="dangerBtn" id="clearBtn" type="button">清空</button>
      </div>

      <div class="list" id="historyList">
        <!-- items -->
      </div>
    </div>
  </div>

  <!-- 详情弹窗（删除只在这里出现） -->
  <div class="overlay" id="detailOverlay" role="dialog" aria-modal="true">
    <div class="modal">
      <div class="modalHead">
        <div class="modalTitle">
          <div class="modalIcon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
              <path d="M8 7h8M9 7v14m6-14v14M6 7l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M10 4h4a2 2 0 0 1 2 2v1H8V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            </svg>
          </div>
          <div style="min-width:0">
            <h2 id="detailTitle">记录详情</h2>
            <p id="detailSub"> </p>
          </div>
        </div>
        <div class="closeBtn" id="closeDetail" aria-label="关闭">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="detailBody">
        <div class="detailCard">
          <div class="detailTop">
            <div class="leftBlock">
              <div class="bigPair">
                <span class="num" id="detailTwd">0</span>
                <span class="u">TWD</span>
              </div>
              <div class="meta" id="detailMetaLeft"></div>
            </div>
            <div class="rightBlock">
              <div class="bigPair rm">
                <span class="num" id="detailRm">0.00</span>
                <span class="u">RM</span>
              </div>
              <div class="meta" id="detailMetaRight"></div>
            </div>
          </div>
        </div>

        <div class="detailBtns">
          <button class="primaryClose" id="detailCloseBtn" type="button">关闭</button>
          <button class="deleteBtn" id="detailDeleteBtn" type="button">删除</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =====================
    // Settings / Theme
    // =====================
    const themeBtn = document.getElementById("themeBtn");
    const root = document.documentElement;

    function loadTheme(){
      const t = localStorage.getItem("fx_theme");
      if (t === "dark") document.body.dataset.theme = "dark";
      else document.body.dataset.theme = "light";
    }
    function toggleTheme(){
      const next = (document.body.dataset.theme === "dark") ? "light" : "dark";
      document.body.dataset.theme = next;
      localStorage.setItem("fx_theme", next);
    }
    themeBtn.addEventListener("click", toggleTheme);
    loadTheme();

    // =====================
    // Rate (固定展示：你可以换成从你真实“目前兑换”里拿到的值)
    // 这里不提供“平均/最近/手动”，只用“当前”
    // =====================
    let currentRate = 7.949; // TWD per MYR
    const rateLabel = document.getElementById("rateLabel");
    const rateSmall = document.getElementById("rateSmall");
    function renderRate(){
      const txt = `1 : ${Number(currentRate).toFixed(3)}`;
      rateLabel.textContent = txt;
      rateSmall.textContent = txt;
    }
    renderRate();

    // =====================
    // History Storage (Keep old records)
    // =====================
    const HISTORY_KEY = "fx_history_v2";
    const LEGACY_KEYS = ["fx_history","history","convert_history","records","exchange_history"];

    function normalizeRecord(raw) {
      if (!raw) return null;
      const ts = Number(raw.ts ?? raw.time ?? raw.timestamp ?? Date.now());
      const rate = Number(raw.rate ?? raw.fxRate ?? raw.exchangeRate ?? 0);
      const twd = Number(raw.twd ?? raw.inputTWD ?? raw.amountTWD ?? raw.input ?? 0);
      const rm  = Number(raw.rm  ?? raw.outputRM ?? raw.amountRM ?? raw.output ?? 0);
      const note = (raw.note ?? raw.remark ?? raw.memo ?? "").toString();
      const category = (raw.category ?? raw.type ?? raw.tag ?? "").toString();
      const id = raw.id ?? `${Math.round(ts/1000)}_${rate}_${twd}_${rm}`;
      if (!Number.isFinite(ts) || !Number.isFinite(rate) || !Number.isFinite(twd) || !Number.isFinite(rm)) return null;
      return { id, ts, rate, twd, rm, category, note };
    }
    function safeParse(json){ try { return JSON.parse(json); } catch { return null; } }
    function readArrayFromKey(key){
      const txt = localStorage.getItem(key);
      if (!txt) return [];
      const parsed = safeParse(txt);
      if (!parsed) return [];
      const arr = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.list) ? parsed.list : []);
      return arr.map(normalizeRecord).filter(Boolean);
    }
    function mergeUnique(a,b){
      const map = new Map();
      [...a, ...b].forEach(r => { if (r) map.set(r.id, r); });
      return Array.from(map.values()).sort((x,y)=> y.ts - x.ts);
    }
    function migrateHistoryOnce(){
      const cur = readArrayFromKey(HISTORY_KEY);
      let merged = [...cur];
      LEGACY_KEYS.forEach(k=>{
        if (k === HISTORY_KEY) return;
        const legacy = readArrayFromKey(k);
        if (legacy.length) merged = mergeUnique(merged, legacy);
      });
      if (merged.length !== cur.length) localStorage.setItem(HISTORY_KEY, JSON.stringify(merged));
      return merged;
    }
    function loadHistory(){ return migrateHistoryOnce(); }
    function saveHistory(list){ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }
    function addHistory(record){
      const list = loadHistory();
      const n = normalizeRecord(record);
      if (!n) return list;
      const merged = mergeUnique(list, [n]);
      saveHistory(merged);
      return merged;
    }

    // =====================
    // Input / Calculation
    // =====================
    let expr = "0";
    let lastExprStack = [];

    const twdValueEl = document.getElementById("twdValue");
    const rmValueEl  = document.getElementById("rmValue");

    function clampExpr(s){
      if (!s || s === "") return "0";
      if (s.length > 18) return s.slice(0,18);
      return s;
    }
    function prettyNum(n){
      const x = Number(n);
      if (!Number.isFinite(x)) return "0";
      const isInt = Math.abs(x - Math.round(x)) < 1e-10;
      return isInt ? String(Math.round(x)) : String(x);
    }
    function safeEval(s){
      // 只允许数字 + . + 运算符
      if (!/^[0-9.+\-*/() ]+$/.test(s)) return 0;
      try{
        // eslint-disable-next-line no-new-func
        const v = Function("return (" + s + ")")();
        if (!Number.isFinite(v)) return 0;
        return v;
      }catch{
        return 0;
      }
    }
    function calcRM(twd){
      const v = Number(twd) || 0;
      const rate = Number(currentRate) || 1;
      return v / rate;
    }
    function render(){
      const twd = safeEval(expr);
      const rm = calcRM(twd);
      twdValueEl.textContent = prettyNum(twd);
      rmValueEl.textContent = rm.toFixed(2);
    }
    render();

    // =====================
    // Keypad
    // =====================
    const pad = document.getElementById("pad");
    pad.addEventListener("click", (e)=>{
      const btn = e.target.closest(".key");
      if (!btn) return;
      const act = btn.dataset.act;

      lastExprStack.push(expr);
      if (lastExprStack.length > 40) lastExprStack.shift();

      if (act === "ac"){
        expr = "0";
        lastExprStack = [];
        render();
        return;
      }
      if (act === "back"){
        if (expr.length <= 1) expr = "0";
        else expr = expr.slice(0,-1);
        expr = clampExpr(expr);
        render();
        return;
      }
      if (act === "dot"){
        expr = (expr === "0") ? "0." : (expr + ".");
        expr = clampExpr(expr);
        render();
        return;
      }
      if (act === "add") { expr += "+"; expr = clampExpr(expr); render(); return; }
      if (act === "sub") { expr += "-"; expr = clampExpr(expr); render(); return; }
      if (act === "mul") { expr += "*"; expr = clampExpr(expr); render(); return; }
      if (act === "div") { expr += "/"; expr = clampExpr(expr); render(); return; }
      if (act === "eq"){
        const v = safeEval(expr);
        expr = String(Number.isFinite(v) ? v : 0);
        expr = clampExpr(expr);
        render();
        return;
      }
      // number
      if (/^\d$/.test(act)){
        if (expr === "0") expr = act;
        else expr += act;
        expr = clampExpr(expr);
        render();
      }
    });

    // 撤回输入
    document.getElementById("undoBtn").addEventListener("click", ()=>{
      const prev = lastExprStack.pop();
      if (prev !== undefined) expr = prev;
      render();
    });

    // =====================
    // Save
    // =====================
    document.getElementById("saveBtn").addEventListener("click", ()=>{
      const twd = safeEval(expr);
      const rm = calcRM(twd);
      addHistory({
        ts: Date.now(),
        rate: Number(currentRate),
        twd: Number(twd),
        rm: Number(rm.toFixed(2)),
        category: "", // 你之后要加🍔🚗分类也可以放这里
        note: ""      // 备注默认空；你说“点进才显示”，这里先保留字段但不在列表显示
      });
      // 轻提示
      flashSub("已保存到历史记录");
    });

    function flashSub(text){
      const sub = document.getElementById("subTitle");
      const old = sub.textContent;
      sub.textContent = text;
      setTimeout(()=> sub.textContent = old, 900);
    }

    // =====================
    // History Modal
    // =====================
    const historyOverlay = document.getElementById("historyOverlay");
    const historyList = document.getElementById("historyList");

    function fmtTime(ts){
      const d = new Date(ts);
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      const hh = String(d.getHours()).padStart(2,"0");
      const mi = String(d.getMinutes()).padStart(2,"0");
      return `${mm}-${dd} ${hh}:${mi}`;
    }

    function renderHistory(){
      const list = loadHistory();
      historyList.innerHTML = "";

      if (!list.length){
        const div = document.createElement("div");
        div.className = "empty";
        div.textContent = "暂无记录";
        historyList.appendChild(div);
        return;
      }

      list.forEach(rec=>{
        const item = document.createElement("div");
        item.className = "item";
        item.dataset.id = rec.id;

        const left = document.createElement("div");
        left.className = "itemLeft";

        const line1 = document.createElement("div");
        line1.className = "line1";
        line1.innerHTML = `
          <span class="twd">${Number(rec.twd)}<small>TWD</small></span>
          ${rec.category ? `<span class="chip">${rec.category}</span>` : ``}
        `;

        const line2 = document.createElement("div");
        line2.className = "line2";
        line2.innerHTML = `
          <span>${fmtTime(rec.ts)}</span>
          <span>Rate ${Number(rec.rate).toFixed(3)}</span>
        `;

        left.appendChild(line1);
        left.appendChild(line2);

        const right = document.createElement("div");
        right.className = "itemRight";
        right.innerHTML = `<div class="rm">${Number(rec.rm).toFixed(2)}<small>RM</small></div>`;

        item.appendChild(left);
        item.appendChild(right);

        item.addEventListener("click", ()=> openDetail(rec.id));
        historyList.appendChild(item);
      });
    }

    document.getElementById("openHistory").addEventListener("click", ()=>{
      renderHistory();
      historyOverlay.classList.add("show");
    });
    document.getElementById("closeHistory").addEventListener("click", ()=>{
      historyOverlay.classList.remove("show");
    });
    historyOverlay.addEventListener("click", (e)=>{
      if (e.target === historyOverlay) historyOverlay.classList.remove("show");
    });

    // 导出（JSON）
    document.getElementById("exportBtn").addEventListener("click", ()=>{
      const list = loadHistory();
      const blob = new Blob([JSON.stringify(list, null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "fx_history.json";
      a.click();
      URL.revokeObjectURL(a.href);
    });

    // 清空
    document.getElementById("clearBtn").addEventListener("click", ()=>{
      if (!confirm("确定清空全部历史记录？")) return;
      saveHistory([]);
      renderHistory();
    });

    // =====================
    // Detail Modal (Delete only here)
    // =====================
    const detailOverlay = document.getElementById("detailOverlay");
    const detailTwd = document.getElementById("detailTwd");
    const detailRm  = document.getElementById("detailRm");
    const detailSub = document.getElementById("detailSub");
    const metaLeft  = document.getElementById("detailMetaLeft");
    const metaRight = document.getElementById("detailMetaRight");
    let currentDetailId = null;

    function getRecordById(id){
      const list = loadHistory();
      return list.find(x=>x.id===id) || null;
    }

    function openDetail(id){
      const rec = getRecordById(id);
      if (!rec) return;

      currentDetailId = id;

      detailTwd.textContent = Number(rec.twd);
      detailRm.textContent = Number(rec.rm).toFixed(2);
      detailSub.textContent = `${fmtTime(rec.ts)} · Rate ${Number(rec.rate).toFixed(3)}`;

      metaLeft.innerHTML = `
        ${rec.category ? `<span class="chip">${rec.category}</span>` : `<span class="chip">未分类</span>`}
        <span class="chip">输入侧（蓝色）</span>
      `;
      metaRight.innerHTML = `
        <span class="chip">换算侧（绿色）</span>
        <span class="chip">仅显示</span>
      `;

      detailOverlay.classList.add("show");
    }

    function closeDetail(){
      detailOverlay.classList.remove("show");
      currentDetailId = null;
    }
    document.getElementById("closeDetail").addEventListener("click", closeDetail);
    document.getElementById("detailCloseBtn").addEventListener("click", closeDetail);
    detailOverlay.addEventListener("click", (e)=>{
      if (e.target === detailOverlay) closeDetail();
    });

    document.getElementById("detailDeleteBtn").addEventListener("click", ()=>{
      if (!currentDetailId) return;
      if (!confirm("确定删除这条记录？")) return;

      const list = loadHistory();
      const next = list.filter(x=>x.id !== currentDetailId);
      saveHistory(next);

      closeDetail();
      renderHistory();
    });

    // =====================
    // Tabs (这里只做视觉切换，不实现“金库”页面逻辑；你要的话我再补)
    // =====================
    const tabVault = document.getElementById("tabVault");
    const tabCalc  = document.getElementById("tabCalc");
    tabVault.addEventListener("click", ()=>{
      tabVault.classList.add("active");
      tabCalc.classList.remove("active");
      flashSub("金库页面：待接入（目前保留换算功能）");
    });
    tabCalc.addEventListener("click", ()=>{
      tabCalc.classList.add("active");
      tabVault.classList.remove("active");
      flashSub("换算模式");
    });

    // =====================
    // 初次加载：确保旧记录被迁移回来
    // =====================
    migrateHistoryOnce();
  </script>
</body>
</html>
