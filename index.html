<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>换算 / 金库</title>

  <style>
    :root{
      --bg1:#eaf6f3;
      --bg2:#e8efff;
      --ink:#0b1324;
      --muted:rgba(11,19,36,.55);
      --line:rgba(11,19,36,.10);
      --card:rgba(255,255,255,.78);
      --shadow:0 18px 40px rgba(17,26,56,.10);

      --radius:28px;
      --green:#11b981;
      --green2:#0ea773;
      --blue:#4d7cff;
      --red:#ff4d5e;

      --kbdMax:600px;
      --tabMax:900px;

      /* 关键：底部区域总高度（JS会动态写入） */
      --bottomH: 180px;
    }

    body.dark{
      --bg1:#070b14;
      --bg2:#0b1222;
      --ink:#eaf0ff;
      --muted:rgba(234,240,255,.60);
      --line:rgba(234,240,255,.10);
      --card:rgba(18,26,44,.72);
      --shadow:0 18px 42px rgba(0,0,0,.42);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", Arial;
      color:var(--ink);
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(17,185,129,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 0%, rgba(77,124,255,.18), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    /* ✅ 最稳：Flex三段式，不依赖 grid 计算 */
    .app{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      padding:14px 14px calc(14px + env(safe-area-inset-bottom));
      gap:12px;
    }

    /* 顶部固定高度区 */
    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    .brand{display:flex;align-items:center;gap:12px}
    .logo{
      width:54px;height:54px;border-radius:18px;
      display:grid;place-items:center;
      background: linear-gradient(135deg, rgba(17,185,129,.95), rgba(17,185,129,.60));
      box-shadow: var(--shadow);
      flex:0 0 auto;
    }
    .logo svg{width:26px;height:26px}
    .title{
      font-size:40px;font-weight:950;letter-spacing:-1.2px;margin:0;line-height:1;
    }
    .actions{display:flex;gap:10px}
    .iconBtn{
      width:48px;height:48px;border-radius:999px;
      background:var(--card);
      border:1px solid var(--line);
      box-shadow: var(--shadow);
      display:grid;place-items:center;
      cursor:pointer;
      user-select:none;
    }
    .iconBtn svg{width:22px;height:22px;opacity:.75}

    /* ✅ 中间内容区：可滚动；并且让出底部固定区域高度 */
    .content{
      flex:1;
      min-height:0;
      overflow:auto;
      padding-bottom: calc(var(--bottomH) + 10px);
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .pillRow{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .pill{
      display:inline-flex;align-items:center;gap:10px;
      padding:12px 16px;border-radius:999px;
      background:var(--card);
      border:1px solid var(--line);
      box-shadow: var(--shadow);
      font-weight:900;
    }
    .pill small{color:var(--muted);font-weight:950}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--green)}

    /* 换算卡 */
    .card{
      background: rgba(255,255,255,.56);
      border:1px solid rgba(11,19,36,.08);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow:hidden;
    }
    body.dark .card{
      background: rgba(18,26,44,.56);
      border-color: rgba(234,240,255,.10);
    }
    .panels{
      display:grid;
      grid-template-columns: 1fr 1fr;
    }
    .panel{
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
      justify-content:center;
      min-height:170px;
    }
    .panel.left{
      background: linear-gradient(135deg, rgba(77,124,255,.12), rgba(255,255,255,.65));
      border-right:1px solid rgba(11,19,36,.08);
    }
    body.dark .panel.left{
      background: linear-gradient(135deg, rgba(77,124,255,.18), rgba(18,26,44,.60));
      border-right-color: rgba(234,240,255,.10);
    }
    .panel.right{
      background: linear-gradient(135deg, rgba(17,185,129,.12), rgba(255,255,255,.65));
    }
    body.dark .panel.right{
      background: linear-gradient(135deg, rgba(17,185,129,.18), rgba(18,26,44,.60));
    }

    .chip{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      border:1px solid rgba(11,19,36,.10);
      background: rgba(255,255,255,.65);
      width:max-content;
      font-size:13px;font-weight:950;color:var(--muted);
    }
    body.dark .chip{
      border-color: rgba(234,240,255,.12);
      background: rgba(18,26,44,.62);
    }
    .bigRow{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
    .amountInput{
      width:100%;
      border:none;outline:none;background:transparent;
      font-size:64px;font-weight:980;letter-spacing:-1.8px;line-height:.95;
      color:var(--ink);
      padding:0;margin:0;
    }
    .bigNum{font-size:64px;font-weight:980;letter-spacing:-1.8px;line-height:.95}
    .unit{font-size:18px;font-weight:950;color:rgba(11,19,36,.42);transform:translateY(-6px)}
    body.dark .unit{color:rgba(234,240,255,.42)}
    .hint{font-size:13px;font-weight:850;color:var(--muted);min-height:18px}

    .saveBar{
      padding:14px;
      border-top:1px solid rgba(11,19,36,.08);
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      background: linear-gradient(135deg, rgba(17,185,129,.14), rgba(255,255,255,.70));
    }
    body.dark .saveBar{
      border-top-color: rgba(234,240,255,.10);
      background: linear-gradient(135deg, rgba(17,185,129,.16), rgba(18,26,44,.72));
    }
    .saveBtn{
      height:54px;min-width:190px;
      padding:0 28px;border-radius:999px;border:0;
      background: linear-gradient(135deg, var(--green), var(--green2));
      color:#fff;font-weight:980;font-size:18px;
      box-shadow: 0 16px 30px rgba(17,185,129,.22);
      cursor:pointer;
    }

    /* ✅ 底部固定区：tab + 键盘，永远贴底不乱跑 */
    .bottomFixed{
      position:fixed;
      left:0; right:0; bottom:0;
      padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      gap:10px;
      align-items:center;
      pointer-events:none; /* 外层不吃事件 */
    }
    .bottomFixed > *{pointer-events:auto;}

    .calc{
      width:100%;
      max-width:var(--kbdMax);
      background:var(--card);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      border-radius:var(--radius);
      padding:14px;
      backdrop-filter: blur(16px);
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr) 0.92fr;
      gap:12px;
    }
    .btn{
      border-radius:22px;
      border:1px solid rgba(11,19,36,.10);
      background: rgba(255,255,255,.82);
      box-shadow: 0 10px 18px rgba(17,26,56,.08);
      font-size:26px;font-weight:950;
      display:flex;align-items:center;justify-content:center;
      cursor:pointer;user-select:none;
      transition: transform .10s ease, box-shadow .15s ease;
      aspect-ratio: 1 / 1;
      min-height:58px;
    }
    .btn:hover{transform:translateY(-1px);box-shadow:0 14px 26px rgba(17,26,56,.12)}
    .btn:active{transform:translateY(0) scale(.985)}
    body.dark .btn{
      background: rgba(18,26,44,.86);
      border-color: rgba(234,240,255,.12);
      box-shadow: 0 12px 20px rgba(0,0,0,.34);
    }

    .btn.ac{background: rgba(255,77,94,.12);border-color: rgba(255,77,94,.18);color:#ff3a4d}
    .btn.func{background: rgba(77,124,255,.12);border-color: rgba(77,124,255,.18);color:#2d4bff}
    .btn.op{background: rgba(17,185,129,.12);border-color: rgba(17,185,129,.18);color:var(--green2)}
    .btn.eq{
      background: linear-gradient(135deg, rgba(17,185,129,.95), rgba(17,185,129,.62));
      border:0;color:#fff;
    }
    .btn.zero{grid-column:1 / span 2; aspect-ratio: 2 / 1}

    .tabbar{
      width:100%;
      max-width:var(--tabMax);
      height:70px;
      background:var(--card);
      border:1px solid var(--line);
      box-shadow:var(--shadow);
      border-radius:999px;
      display:grid;
      grid-template-columns:1fr 1fr;
      padding:8px;
      gap:8px;
      backdrop-filter: blur(16px);
    }
    .tab{
      border-radius:999px;
      display:flex;align-items:center;justify-content:center;gap:10px;
      font-weight:980;
      color:rgba(11,19,36,.58);
      cursor:pointer;user-select:none;
    }
    body.dark .tab{color:rgba(234,240,255,.58)}
    .tab.active{
      background: linear-gradient(135deg, rgba(17,185,129,.16), rgba(255,255,255,.70));
      color:rgba(11,19,36,.86);
      border:1px solid rgba(17,185,129,.12);
    }
    body.dark .tab.active{
      background: linear-gradient(135deg, rgba(17,185,129,.18), rgba(18,26,44,.80));
      color:rgba(234,240,255,.88);
      border-color: rgba(17,185,129,.18);
    }

    @media (max-width: 780px){
      .panels{grid-template-columns:1fr}
      .panel.left{border-right:none;border-bottom:1px solid rgba(11,19,36,.08)}
      body.dark .panel.left{border-bottom-color: rgba(234,240,255,.10)}
      .amountInput,.bigNum{font-size:56px}
    }
  </style>
</head>

<body>
  <div class="app">
    <!-- 顶部 -->
    <div class="header">
      <div class="brand">
        <div class="logo">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M7.5 4.5h9A2.5 2.5 0 0 1 19 7v10a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 17V7A2.5 2.5 0 0 1 7.5 4.5Z" stroke="white" stroke-width="2"/>
            <path d="M8 9h8M8 12h6M8 15h7" stroke="white" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <h1 class="title" id="title">换算</h1>
      </div>

      <div class="actions">
        <div class="iconBtn" id="themeBtn" title="主题">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a6.5 6.5 0 0 0 10.2 10.2Z" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- 中间内容 -->
    <div class="content" id="content">
      <div class="pillRow">
        <div class="pill" id="ratePill"><span class="dot"></span>当前汇率 <small id="rateText">1 : 7.949 TWD/MYR</small></div>
        <div class="pill" id="historyPill">历史</div>
      </div>

      <div class="card" id="convertCard">
        <div class="panels">
          <div class="panel left">
            <div class="chip">输入</div>
            <div class="bigRow">
              <input class="amountInput" id="twdInput" inputmode="decimal" placeholder="0" />
              <div class="unit">TWD</div>
            </div>
            <div class="hint" id="leftHint"></div>
          </div>

          <div class="panel right">
            <div class="chip">换算（仅展示）</div>
            <div class="bigRow" style="justify-content:flex-end;">
              <div class="bigNum" id="rmText" style="color:var(--green2)">0.00</div>
              <div class="unit">RM</div>
            </div>
            <div class="hint" id="rightHint" style="text-align:right;"></div>
          </div>
        </div>

        <div class="saveBar">
          <div style="font-weight:980">保存 <span style="color:var(--muted);font-weight:950" id="rateShort">1 : 7.949</span></div>
          <button class="saveBtn" id="saveBtn">保存</button>
        </div>
      </div>

      <div class="card" id="vaultCard" style="display:none;padding:18px;">
        <div style="font-weight:980;color:var(--muted);margin-bottom:8px;">金库（示例占位）</div>
        <div style="font-weight:980;font-size:28px;">这里展示金库内容</div>
      </div>
    </div>
  </div>

  <!-- 底部固定区（键盘+tab） -->
  <div class="bottomFixed" id="bottomFixed">
    <div class="calc" id="calcWrap">
      <div class="grid" id="kbd">
        <div class="btn ac" data-k="AC">AC</div>
        <div class="btn func" data-k="BK">⌫</div>
        <div class="btn func" data-k=".">.</div>
        <div class="btn op" data-k="/">÷</div>

        <div class="btn" data-k="7">7</div>
        <div class="btn" data-k="8">8</div>
        <div class="btn" data-k="9">9</div>
        <div class="btn op" data-k="*">×</div>

        <div class="btn" data-k="4">4</div>
        <div class="btn" data-k="5">5</div>
        <div class="btn" data-k="6">6</div>
        <div class="btn op" data-k="-">-</div>

        <div class="btn" data-k="1">1</div>
        <div class="btn" data-k="2">2</div>
        <div class="btn" data-k="3">3</div>
        <div class="btn op" data-k="+">+</div>

        <div class="btn zero" data-k="0">0</div>
        <div class="btn func" data-k="00">00</div>
        <div class="btn eq" data-k="=">=</div>
      </div>
    </div>

    <div class="tabbar">
      <div class="tab" id="tabVault">金库</div>
      <div class="tab active" id="tabConvert">换算</div>
    </div>
  </div>

  <script>
    // ====== 状态 ======
    const state = {
      rate: 7.949,
      page: "convert",
      theme: "light",
      twdStr: "0",
      expr: "0",
      records: []
    };

    // ✅ 强制保留默认记录：402.55 RM -> 3200 TWD（你要求的）
    function ensureDefaultRecord(){
      const exist = state.records.some(r => r.twd === 3200 && r.rm === 402.55);
      if(!exist){
        state.records.unshift({
          id: "default_3200",
          ts: Date.now() - 86400000,
          twd: 3200,
          rm: 402.55,
          rate: 7.949
        });
      }
    }
    ensureDefaultRecord();

    // ====== DOM ======
    const rateText = document.getElementById("rateText");
    const rateShort = document.getElementById("rateShort");
    const twdInput = document.getElementById("twdInput");
    const rmText = document.getElementById("rmText");
    const leftHint = document.getElementById("leftHint");
    const rightHint = document.getElementById("rightHint");

    const tabVault = document.getElementById("tabVault");
    const tabConvert = document.getElementById("tabConvert");
    const convertCard = document.getElementById("convertCard");
    const vaultCard = document.getElementById("vaultCard");
    const calcWrap = document.getElementById("calcWrap");
    const title = document.getElementById("title");

    const themeBtn = document.getElementById("themeBtn");

    // ====== 底部高度动态写入（关键：保证中间内容不被盖住） ======
    function setBottomHeight(){
      const bottom = document.getElementById("bottomFixed");
      const h = bottom.getBoundingClientRect().height;
      document.documentElement.style.setProperty("--bottomH", Math.ceil(h) + "px");
    }
    window.addEventListener("resize", setBottomHeight);

    // ====== 工具 ======
    function clampDigits(str){
      str = String(str ?? "").replace(/[^\d.]/g,"");
      const parts = str.split(".");
      if(parts.length > 2) str = parts[0] + "." + parts.slice(1).join("");
      if(str === "") str = "0";
      if(!str.includes(".")) str = str.replace(/^0+(?=\d)/,"0");
      return str;
    }
    function toNumber(str){
      const n = Number(str);
      return Number.isFinite(n) ? n : 0;
    }
    function fmt2(n){ return Number(n).toFixed(2); }
    function computeRM(twd){ return twd / state.rate; }

    // ====== 渲染 ======
    function renderRate(){
      rateText.textContent = `1 : ${state.rate.toFixed(3)} TWD/MYR`;
      rateShort.textContent = `1 : ${state.rate.toFixed(3)}`;
    }
    function renderConvert(){
      const twd = toNumber(state.twdStr);
      const rm = computeRM(twd);
      twdInput.value = state.twdStr;

      rmText.textContent = fmt2(rm);

      leftHint.textContent  = twd > 0 ? `${twd} TWD` : "";
      rightHint.textContent = twd > 0 ? `RM ${fmt2(rm)}` : "";
    }
    function setPage(page){
      state.page = page;
      const isConvert = page === "convert";

      tabConvert.classList.toggle("active", isConvert);
      tabVault.classList.toggle("active", !isConvert);

      convertCard.style.display = isConvert ? "" : "none";
      vaultCard.style.display   = isConvert ? "none" : "";
      calcWrap.style.display    = isConvert ? "" : "none";

      title.textContent = isConvert ? "换算" : "金库";

      // 页面切换后，底部高度会变化（有无键盘），必须重算
      setTimeout(setBottomHeight, 0);
    }

    // ====== 事件 ======
    tabConvert.addEventListener("click", ()=>setPage("convert"));
    tabVault.addEventListener("click", ()=>setPage("vault"));

    twdInput.addEventListener("input", ()=>{
      state.twdStr = clampDigits(twdInput.value);
      state.expr = state.twdStr;
      renderConvert();
    });

    themeBtn.addEventListener("click", ()=>{
      state.theme = (state.theme === "dark") ? "light" : "dark";
      document.body.classList.toggle("dark", state.theme === "dark");
    });

    document.getElementById("kbd").addEventListener("click", (e)=>{
      const b = e.target.closest(".btn");
      if(!b) return;
      const k = b.dataset.k;

      if(k === "AC"){
        state.expr = "0";
        state.twdStr = "0";
        renderConvert();
        return;
      }
      if(k === "BK"){
        let s = String(state.expr || "0");
        s = (s.length <= 1) ? "0" : s.slice(0,-1);
        state.expr = s;
        state.twdStr = clampDigits(s.replace(/[^0-9.]/g,"") || "0");
        renderConvert();
        return;
      }
      if(k === "="){
        // 简化：不做表达式运算，只保持输入数字
        renderConvert();
        return;
      }

      let s = String(state.expr || "0");
      if(k === "00"){
        if(s !== "0") s += "00";
      }else if(/[0-9]/.test(k)){
        s = (s === "0") ? k : (s + k);
      }else if(k === "."){
        if(!s.includes(".")) s += ".";
      }else{
        // 运算符：先不做（你当前是换算，不需要算式）
      }

      state.expr = s;
      state.twdStr = clampDigits(s);
      renderConvert();
    });

    // 初始
    renderRate();
    setPage("convert");
    renderConvert();
    setTimeout(setBottomHeight, 0);
  </script>
</body>
</html>
