<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>换算 / 金库</title>
  <style>
    :root{
      --bg1:#eaf6f3;
      --bg2:#e8efff;

      --ink:#0b1324;
      --muted:rgba(11,19,36,.52);
      --muter:rgba(11,19,36,.36);

      --card:rgba(255,255,255,.78);
      --card2:rgba(255,255,255,.92);
      --line:rgba(11,19,36,.10);

      --shadow:0 18px 40px rgba(17,26,56,.10);
      --shadow2:0 10px 22px rgba(17,26,56,.08);

      --radius:28px;

      --green:#11b981;
      --green2:#0ea773;
      --red:#ff4d5e;
      --blue:#4d7cff;

      --inputTint: color-mix(in srgb, var(--blue) 12%, transparent);
      --outTint: color-mix(in srgb, var(--green) 14%, transparent);

      --kbdMax: 600px;
    }

    /* 更明显的夜间模式：直接切变量 */
    body.dark{
      --bg1:#070b14;
      --bg2:#0b1222;

      --ink:#eaf0ff;
      --muted:rgba(234,240,255,.62);
      --muter:rgba(234,240,255,.40);

      --card:rgba(18,26,44,.72);
      --card2:rgba(18,26,44,.86);
      --line:rgba(234,240,255,.10);

      --shadow:0 18px 42px rgba(0,0,0,.42);
      --shadow2:0 10px 24px rgba(0,0,0,.32);
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial;
      color:var(--ink);
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(17,185,129,.18), transparent 55%),
        radial-gradient(900px 600px at 85% 0%, rgba(77,124,255,.18), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
      overflow:hidden;
      transition: background .25s ease;
    }
    body.dark{
      background:
        radial-gradient(1200px 700px at 15% 10%, rgba(17,185,129,.12), transparent 55%),
        radial-gradient(900px 600px at 85% 0%, rgba(77,124,255,.12), transparent 55%),
        linear-gradient(135deg, var(--bg1), var(--bg2));
    }

    .app{
      height:100%;
      display:flex;
      flex-direction:column;
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      gap:12px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 2px 2px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }
    .logo{
      width:54px;height:54px;border-radius:18px;
      display:grid;place-items:center;
      background: linear-gradient(135deg, rgba(17,185,129,.95), rgba(17,185,129,.60));
      box-shadow: var(--shadow2);
      flex:0 0 auto;
    }
    .logo svg{width:26px;height:26px;opacity:.96;filter: drop-shadow(0 6px 10px rgba(0,0,0,.12));}
    .titleWrap{min-width:0}
    .title{
      font-size:40px;font-weight:950;letter-spacing:-1.2px;line-height:1.0;
      margin:0;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .subtitle{
      margin-top:6px;
      font-size:13px;font-weight:800;color:var(--muted);
    }

    .actions{
      display:flex;align-items:center;gap:10px;flex:0 0 auto;
    }
    .iconBtn{
      width:48px;height:48px;border-radius:999px;
      background: var(--card);
      border:1px solid var(--line);
      box-shadow: var(--shadow2);
      display:grid;place-items:center;
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, background .15s ease, box-shadow .15s ease;
    }
    .iconBtn:hover{box-shadow: 0 14px 28px rgba(17,26,56,.12)}
    body.dark .iconBtn:hover{box-shadow: 0 14px 28px rgba(0,0,0,.38)}
    .iconBtn:active{transform:scale(.98)}
    .iconBtn svg{width:22px;height:22px;opacity:.78}

    .content{
      flex:1 1 auto;
      min-height:0;
      overflow:auto;
      padding-bottom: 8px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .pillRow{
      display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
      padding: 2px 2px 0;
    }
    .pill{
      display:inline-flex;align-items:center;gap:10px;
      padding: 12px 16px;
      border-radius:999px;
      background: var(--card);
      border:1px solid var(--line);
      box-shadow: var(--shadow2);
      font-size:15px;
      font-weight:900;
      color:var(--ink);
      user-select:none;
      transition: transform .08s ease, box-shadow .15s ease;
    }
    .pill:hover{box-shadow: 0 14px 28px rgba(17,26,56,.12)}
    body.dark .pill:hover{box-shadow: 0 14px 28px rgba(0,0,0,.38)}
    .pill:active{transform:scale(.99)}
    .pill small{font-weight:950;color:var(--muted)}
    .pill .dot{
      width:10px;height:10px;border-radius:50%;
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(17,185,129,.12);
    }

    .convertCard{
      background: rgba(255,255,255,.56);
      border:1px solid rgba(11,19,36,.08);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow:hidden;
    }
    body.dark .convertCard{
      background: rgba(18,26,44,.56);
      border-color: rgba(234,240,255,.10);
    }

    .convertPanels{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:0;
      min-height: 168px;
    }
    .panel{
      padding:18px 18px 16px;
      position:relative;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:12px;
    }
    .panel.left{
      background: linear-gradient(135deg, rgba(77,124,255,.12), rgba(255,255,255,.65));
      border-right:1px solid rgba(11,19,36,.08);
    }
    body.dark .panel.left{
      background: linear-gradient(135deg, rgba(77,124,255,.18), rgba(18,26,44,.60));
      border-right-color: rgba(234,240,255,.10);
    }
    .panel.right{
      background: linear-gradient(135deg, rgba(17,185,129,.12), rgba(255,255,255,.65));
    }
    body.dark .panel.right{
      background: linear-gradient(135deg, rgba(17,185,129,.18), rgba(18,26,44,.60));
    }

    .chip{
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      border:1px solid rgba(11,19,36,.10);
      background: rgba(255,255,255,.65);
      width:max-content;
      font-size:13px;
      font-weight:950;
      color:rgba(11,19,36,.70);
    }
    body.dark .chip{
      border-color: rgba(234,240,255,.12);
      background: rgba(18,26,44,.62);
      color: rgba(234,240,255,.72);
    }
    .chip .miniDot{
      width:10px;height:10px;border-radius:50%;
      background: var(--blue);
      box-shadow: 0 0 0 6px rgba(77,124,255,.12);
    }
    .panel.right .chip .miniDot{
      background: var(--green);
      box-shadow: 0 0 0 6px rgba(17,185,129,.12);
    }

    .readonlyTag{
      margin-left:auto;
      display:inline-flex;align-items:center;gap:8px;
      padding:8px 12px;border-radius:999px;
      border:1px solid rgba(11,19,36,.10);
      background: rgba(255,255,255,.65);
      font-size:13px;font-weight:950;color:rgba(11,19,36,.62);
    }
    body.dark .readonlyTag{
      border-color: rgba(234,240,255,.12);
      background: rgba(18,26,44,.62);
      color: rgba(234,240,255,.62);
    }

    .rowTop{
      display:flex;align-items:center;gap:10px;justify-content:space-between;
    }

    .bigRow{
      display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
    }
    .bigNum{
      font-size:64px;
      font-weight:980;
      letter-spacing:-1.8px;
      line-height:.95;
    }
    .unit{
      font-size:18px;
      font-weight:950;
      color:rgba(11,19,36,.42);
      transform: translateY(-6px);
    }
    body.dark .unit{color:rgba(234,240,255,.42)}

    .amountInput{
      width:100%;
      border:none;
      outline:none;
      background:transparent;
      font-size:64px;
      font-weight:980;
      letter-spacing:-1.8px;
      line-height:.95;
      color:var(--ink);
      padding:0;
      margin:0;
    }
    .amountInput::placeholder{color:rgba(11,19,36,.28)}
    body.dark .amountInput::placeholder{color:rgba(234,240,255,.28)}
    .panel.left .amountInput{caret-color: var(--blue)}
    .hint{
      font-size:13px;
      font-weight:850;
      color:rgba(11,19,36,.54);
      min-height:18px;
    }
    body.dark .hint{color:rgba(234,240,255,.56)}

    .saveBar{
      padding:14px 14px 14px;
      background: linear-gradient(135deg, rgba(17,185,129,.14), rgba(255,255,255,.70));
      border-top:1px solid rgba(11,19,36,.08);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
    }
    body.dark .saveBar{
      background: linear-gradient(135deg, rgba(17,185,129,.16), rgba(18,26,44,.72));
      border-top-color: rgba(234,240,255,.10);
    }

    .saveBar .leftText{
      display:flex;align-items:center;gap:10px;min-width:0;
      font-weight:950;
      color:rgba(11,19,36,.78);
    }
    body.dark .saveBar .leftText{color:rgba(234,240,255,.76)}
    .saveBar .leftText small{
      font-weight:900;
      color:rgba(11,19,36,.46);
      white-space:nowrap;
    }
    body.dark .saveBar .leftText small{color:rgba(234,240,255,.42)}

    .saveBtn{
      margin-left:auto;
      display:inline-flex;align-items:center;justify-content:center;gap:10px;
      height:54px;
      padding:0 28px;
      min-width:180px;
      border-radius:999px;
      border:0;
      cursor:pointer;
      color:white;
      font-size:18px;
      font-weight:950;
      background: linear-gradient(135deg, var(--green), var(--green2));
      box-shadow: 0 16px 30px rgba(17,185,129,.22);
      transition: transform .08s ease, filter .15s ease, box-shadow .15s ease;
      user-select:none;
      flex:0 0 auto;
    }
    .saveBtn:hover{box-shadow: 0 18px 40px rgba(17,185,129,.26)}
    .saveBtn:active{transform:scale(.99)}
    .saveBtn svg{width:20px;height:20px;opacity:.95}

    /* ====== 你要的键盘优化（核心） ====== */
    .calcWrap{
      position: sticky;
      bottom: 0;
      z-index: 5;
      padding: 10px 0 10px;
      display:flex;
      justify-content:center; /* 宽屏居中 */
    }
    .calc{
      width:100%;
      max-width: var(--kbdMax); /* 防止无限拉伸 */
      background: var(--card);
      border:1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding:14px;
      backdrop-filter: blur(16px);
    }

    /* 新栅格：左 3 列数字/功能，右 1 列运算符 */
    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr) 0.92fr; /* 右列略窄一点更像运算列 */
      gap:12px;
      align-items:stretch;
    }

    /* 按键比例：默认更像方块/圆角矩形，不再扁平 */
    .btn{
      border-radius: 22px;
      border:1px solid rgba(11,19,36,.10);
      background: rgba(255,255,255,.80);
      box-shadow: 0 10px 18px rgba(17,26,56,.08);
      font-size:26px;
      font-weight:950;
      letter-spacing:-.2px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      transition: transform .10s ease, box-shadow .15s ease, background .15s ease, filter .15s ease;
      aspect-ratio: 1 / 1;     /* 关键：保持接近正方形 */
      min-height: 58px;        /* 低端浏览器兜底 */
    }
    .btn:hover{
      transform: translateY(-1px);
      box-shadow: 0 14px 26px rgba(17,26,56,.12);
      background: rgba(255,255,255,.92);
    }
    .btn:active{
      transform: translateY(0) scale(.985);
      box-shadow: 0 10px 18px rgba(17,26,56,.10);
      filter: brightness(.98);
    }
    body.dark .btn{
      border-color: rgba(234,240,255,.12);
      background: rgba(18,26,44,.78);
      box-shadow: 0 12px 20px rgba(0,0,0,.34);
    }
    body.dark .btn:hover{
      background: rgba(18,26,44,.88);
      box-shadow: 0 16px 28px rgba(0,0,0,.42);
    }

    /* 数字键 vs 功能键柔和区分 */
    .btn.num{ background: rgba(255,255,255,.86); }
    body.dark .btn.num{ background: rgba(18,26,44,.86); }

    .btn.func{
      background: rgba(77,124,255,.12);
      border-color: rgba(77,124,255,.18);
      color:#2d4bff;
    }
    body.dark .btn.func{
      background: rgba(77,124,255,.18);
      border-color: rgba(77,124,255,.26);
      color:#b8c7ff;
    }

    .btn.ac{
      background: rgba(255,77,94,.12);
      border-color: rgba(255,77,94,.18);
      color:#ff3a4d;
    }
    body.dark .btn.ac{
      background: rgba(255,77,94,.18);
      border-color: rgba(255,77,94,.28);
      color:#ffb3bb;
    }

    /* 运算符统一右列 */
    .btn.op{
      background: rgba(17,185,129,.12);
      border-color: rgba(17,185,129,.18);
      color: var(--green2);
    }
    body.dark .btn.op{
      background: rgba(17,185,129,.16);
      border-color: rgba(17,185,129,.22);
      color: #8df0cd;
    }

    .btn.eq{
      background: linear-gradient(135deg, rgba(17,185,129,.95), rgba(17,185,129,.62));
      border:0;
      color:white;
      box-shadow: 0 20px 34px rgba(17,185,129,.18);
    }
    .btn.eq:hover{box-shadow: 0 24px 42px rgba(17,185,129,.22)}
    body.dark .btn.eq{box-shadow: 0 24px 46px rgba(0,0,0,.42)}

    /* 0 键占两格，但仍保持比例好看：改用更宽但不扁（aspect-ratio 覆盖） */
    .btn.zero{
      grid-column: 1 / span 2;
      aspect-ratio: 2 / 1;
      justify-content:center;
    }

    .btn.smallIcon svg{width:22px;height:22px;opacity:.88}

    /* tabbar */
    .tabbar{
      flex:0 0 auto;
      height:70px;
      background: var(--card);
      border:1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 999px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      padding:8px;
      gap:8px;
      backdrop-filter: blur(16px);
    }
    .tab{
      border-radius:999px;
      display:flex;align-items:center;justify-content:center;gap:10px;
      font-weight:980;
      color:rgba(11,19,36,.58);
      cursor:pointer;
      user-select:none;
      transition: background .15s ease, color .15s ease, transform .08s ease;
    }
    body.dark .tab{color:rgba(234,240,255,.58)}
    .tab:active{transform:scale(.99)}
    .tab.active{
      background: linear-gradient(135deg, rgba(17,185,129,.16), rgba(255,255,255,.70));
      color:rgba(11,19,36,.86);
      border:1px solid rgba(17,185,129,.12);
    }
    body.dark .tab.active{
      background: linear-gradient(135deg, rgba(17,185,129,.18), rgba(18,26,44,.80));
      color:rgba(234,240,255,.88);
      border-color: rgba(17,185,129,.18);
    }
    .tab svg{width:18px;height:18px;opacity:.75}
    .tab.active svg{opacity:.95}

    /* ===== 金库/弹窗/列表（保持你上一版逻辑） ===== */
    .vaultHeaderCard{
      background: rgba(11,19,36,.90);
      border:1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      padding:18px;
      color:white;
      overflow:hidden;
      position:relative;
    }
    body.dark .vaultHeaderCard{background: rgba(7,10,18,.92)}
    .vaultHeaderCard:before{
      content:"";
      position:absolute;inset:-120px -120px auto auto;
      width:260px;height:260px;border-radius:50%;
      background: radial-gradient(circle at 30% 30%, rgba(17,185,129,.40), transparent 60%);
      filter: blur(1px);
    }
    .vaultBig{
      font-size:72px;font-weight:980;letter-spacing:-2.2px;line-height:1.0;margin-top:10px;
    }
    .vaultMeta{
      display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;
      color:rgba(255,255,255,.66);font-weight:900;
    }
    .vaultMeta .rateChip{
      display:inline-flex;align-items:center;gap:10px;
      padding:10px 14px;border-radius:999px;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.16);
      color:rgba(255,255,255,.86);
      font-weight:950;
    }

    .vaultActionsRow{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:12px;
    }
    .actionCard{
      background: var(--card);
      border:1px solid rgba(11,19,36,.08);
      box-shadow: var(--shadow2);
      border-radius: var(--radius);
      padding:16px;
      display:flex;align-items:center;gap:12px;
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, box-shadow .15s ease;
      min-height:84px;
    }
    .actionCard:hover{box-shadow: 0 16px 30px rgba(17,26,56,.12)}
    body.dark .actionCard:hover{box-shadow: 0 16px 30px rgba(0,0,0,.40)}
    .actionCard:active{transform:scale(.995)}
    .actionIcon{
      width:56px;height:56px;border-radius:20px;
      display:grid;place-items:center;
      background: rgba(17,185,129,.14);
      border:1px solid rgba(17,185,129,.18);
      flex:0 0 auto;
    }
    .actionIcon.blue{
      background: rgba(77,124,255,.12);
      border-color: rgba(77,124,255,.18);
    }
    .actionTitle{
      font-size:18px;font-weight:980;margin:0;line-height:1.1;
    }
    .actionSub{
      margin-top:6px;font-size:13px;font-weight:850;color:var(--muted);
    }

    .sectionTitle{
      margin: 4px 4px 0;
      font-size:14px;font-weight:980;color:var(--muted);
      display:flex;align-items:center;justify-content:space-between;
    }
    .list{display:flex;flex-direction:column;gap:12px;}

    .recordCard{
      background: var(--card);
      border:1px solid rgba(11,19,36,.08);
      box-shadow: var(--shadow2);
      border-radius: var(--radius);
      padding:14px 16px;
      cursor:pointer;
      user-select:none;
      transition: transform .08s ease, box-shadow .15s ease;
    }
    .recordCard:hover{box-shadow: 0 16px 30px rgba(17,26,56,.12)}
    body.dark .recordCard:hover{box-shadow: 0 16px 30px rgba(0,0,0,.40)}
    .recordCard:active{transform:scale(.995)}
    .recordTop{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;}
    .recordTop .left{display:flex;align-items:center;gap:10px;min-width:0;}
    .emo{
      width:42px;height:42px;border-radius:16px;
      display:grid;place-items:center;
      background: rgba(17,185,129,.12);
      border:1px solid rgba(11,19,36,.08);
      font-size:20px;
      flex:0 0 auto;
    }
    body.dark .emo{
      border-color: rgba(234,240,255,.10);
      background: rgba(17,185,129,.14);
    }
    .recordTitle{font-size:16px;font-weight:980;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .recordSub{font-size:12px;font-weight:850;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px;}
    .recordAmounts{display:flex;align-items:baseline;gap:14px;justify-content:flex-end;flex-wrap:wrap;text-align:right;}
    .amt{font-size:28px;font-weight:980;letter-spacing:-.8px;line-height:1.0;}
    .amt small{font-size:13px;font-weight:950;color:var(--muter);margin-left:6px;}
    .amt.out{color: var(--green2);}

    /* 弹窗 */
    .overlay{
      position:fixed;inset:0;
      background: rgba(9,12,24,.45);
      backdrop-filter: blur(10px);
      display:none;
      align-items:center;
      justify-content:center;
      padding: 16px;
      z-index: 100;
    }
    .overlay.show{display:flex}
    .modal{
      width:min(900px, 96vw);
      background: var(--card2);
      border:1px solid var(--line);
      box-shadow: 0 28px 70px rgba(0,0,0,.22);
      border-radius: 34px;
      overflow:hidden;
    }
    .modalHead{
      padding:18px 18px 14px;
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      border-bottom:1px solid var(--line);
      background: linear-gradient(135deg, rgba(17,185,129,.10), rgba(255,255,255,.90));
    }
    body.dark .modalHead{
      background: linear-gradient(135deg, rgba(17,185,129,.14), rgba(18,26,44,.88));
    }
    .mhLeft{display:flex;align-items:center;gap:12px;min-width:0;}
    .mhIcon{
      width:54px;height:54px;border-radius:20px;
      display:grid;place-items:center;
      background: rgba(17,185,129,.14);
      border:1px solid rgba(17,185,129,.16);
      font-size:22px;font-weight:900;
      flex:0 0 auto;
    }
    .mhTitles{min-width:0}
    .mhTitle{margin:0;font-size:22px;font-weight:980;letter-spacing:-.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

      padding:14px;
      box-shadow: var(--shadow2);

      background: rgba(18,26,44,.86);
    }

    .moneyInput{
      width:100%;
      border:none;outline:none;background:transparent;
      font-size:46px;font-weight:980;letter-spacing:-1.2px;color:var(--ink);
      padding:0;margin:0;
    }
    .moneyUnit{font-size:16px;font-weight:950;color:var(--muter)}
    .moneyHint{margin-top:10px;font-size:13px;font-weight:850;color:var(--muted);min-height:18px}

    .emojiPick{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
    .emoBtn{
      height:46px;
      padding:0 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.86);
      font-weight:980;

      box-shadow: 0 12px 18px rgba(17,26,56,.06);

    body.dark .emoBtn{background: rgba(18,26,44,.86); box-shadow: 0 12px 18px rgba(0,0,0,.32);}

  </style>
</head>

  <script>
    /***********************
     * 数据 & 持久化
     ***********************/
    const LS_KEY = "tw_rm_vault_v3";
    const LS_KEY_RATE = "tw_rm_rate_v3";
    const LS_KEY_THEME = "tw_rm_theme_v3";

    const state = {
      rate: 7.949,           // TWD/MYR
      twdStr: "0",
      expr: "0",
      page: "convert",       // convert | vault
      records: [],           // 换算历史
      vault: [],             // 金库记录
      theme: "light",        // light | dark
    };

    function load(){
      try{
        const saved = localStorage.getItem(LS_KEY);
        if(saved){
          const obj = JSON.parse(saved);
          if(obj && typeof obj === "object"){
            state.records = Array.isArray(obj.records) ? obj.records : [];
            state.vault   = Array.isArray(obj.vault) ? obj.vault : [];
          }
        }
      }catch(e){}
      try{
        const r = localStorage.getItem(LS_KEY_RATE);
        if(r){
          const n = Number(r);
          if(Number.isFinite(n) && n > 0) state.rate = n;
        }
      }catch(e){}
      try{
        const t = localStorage.getItem(LS_KEY_THEME);
        if(t === "dark" || t === "light") state.theme = t;
      }catch(e){}
    }

    function save(){
      localStorage.setItem(LS_KEY, JSON.stringify({records: state.records, vault: state.vault}));
      localStorage.setItem(LS_KEY_RATE, String(state.rate));
      localStorage.setItem(LS_KEY_THEME, state.theme);
    }

    load();

    /***********************
     * 默认记录（你指定的：402.55 RM -> 3200 TWD）
     * 这里按“换算历史”保存一条：输入 3200 TWD，展示 RM 402.55
     ***********************/
    function ensureDefaultRecord(){
      const exists = state.records.some(r =>
        Number(r?.twd) === 3200 && Number(r?.rm) === 402.55
      );
      if(!exists){
        state.records.unshift({
          id: "default_3200_twd_40255_rm",
          ts: Date.now() - 1000 * 60 * 60 * 24, // 昨天（让它看起来像早期记录）
          twd: 3200,
          rm: 402.55,
          rate: 7.949
        });
        save();
      }
    }
    ensureDefaultRecord();

    /***********************
     * 工具
     ***********************/
    function clampDigits(str){
      str = String(str ?? "").replace(/[^\d.]/g,"");
      const parts = str.split(".");
      if(parts.length > 2) str = parts[0] + "." + parts.slice(1).join("");
      if(str === "") str = "0";
      if(str.includes(".")){
        str = str.replace(/^0+(?=\d)/,"0");
      }else{
        str = str.replace(/^0+(?=\d)/,"0");
      }
      return str;
    }

    function toNumber(str){
      const n = Number(str);
      return Number.isFinite(n) ? n : 0;
    }

    function fmt2(n){ return Number(n).toFixed(2); }

    function fmtTwd(n){
      const num = Number(n);
      if(!Number.isFinite(num)) return "0 TWD";
      const isInt = Math.abs(num - Math.round(num)) < 1e-9;
      return (isInt ? String(Math.round(num)) : String(num)) + " TWD";
    }

    function fmtRm(n){
      const num = Number(n);
      if(!Number.isFinite(num)) return "RM 0.00";
      return "RM " + fmt2(num);
    }

    function fmtRate(){ return `1 : ${Number(state.rate).toFixed(3)} TWD/MYR`; }
    function fmtRateShort(){ return `1 : ${Number(state.rate).toFixed(3)}`; }

    function dtStr(ts){
      const d = new Date(ts);
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      const hh = String(d.getHours()).padStart(2,"0");
      const mi = String(d.getMinutes()).padStart(2,"0");
      return `${mm}-${dd} ${hh}:${mi}`;
    }

    function downloadText(filename, text){
      const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      URL.revokeObjectURL(a.href);
      a.remove();
    }

    /***********************

     ***********************/
    const pageTitle = document.getElementById("pageTitle");

    const detailTitle = document.getElementById("detailTitle");
    const detailSub = document.getElementById("detailSub");

    const detailRm = document.getElementById("detailRm");

    const vaultConfirmBtn = document.getElementById("vaultConfirmBtn");

    /***********************
     * 主题：更明显 + 图标切换
     ***********************/
    function applyTheme(){
      document.body.classList.toggle("dark", state.theme === "dark");
      if(state.theme === "dark"){

          <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".9"/>
          <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z" stroke="currentColor" stroke-width="2" opacity=".9"/>
        `; // 太阳
        themeBtn.title = "切换到浅色";
      }else{
        themeIcon.innerHTML = `
          <path d="M21 13.2A8.5 8.5 0 1 1 10.8 3a6.5 6.5 0 0 0 10.2 10.2Z" stroke="currentColor" stroke-width="2" opacity=".9"/>
        `; // 月亮
        themeBtn.title = "切换到夜间";
      }

    applyTheme();

    themeBtn.addEventListener("click", ()=>{

    /***********************
     * 视图切换
     ***********************/
    function setPage(page){
      state.page = page;
      if(page === "convert"){
        pageTitle.textContent = "换算";
        pageSub.textContent = "";
        viewConvert.style.display = "";
        viewVault.style.display = "none";
        tabConvert.classList.add("active");
        tabVault.classList.remove("active");
        historyBtn.style.display = "inline-flex";
      }else{
        pageTitle.textContent = "金库";
        pageSub.textContent = " ";
        viewConvert.style.display = "none";
        viewVault.style.display = "";
        tabVault.classList.add("active");
        tabConvert.classList.remove("active");
        historyBtn.style.display = "none";
      }
      renderAll();
    }
    tabConvert.addEventListener("click", ()=>setPage("convert"));
    tabVault.addEventListener("click", ()=>setPage("vault"));

    /***********************
     * 汇率
     ***********************/
    function renderRate(){
      rateText.textContent = fmtRate();
      saveSmall.textContent = fmtRateShort();
      vaultRateChip.textContent = fmtRateShort();
    }
    ratePill.addEventListener("click", ()=>{
      const v = prompt("设置汇率（TWD/MYR）", String(state.rate));
      if(v === null) return;
      const n = Number(String(v).replace(/[^\d.]/g,""));
      if(!Number.isFinite(n) || n <= 0) return;
      state.rate = n;
      save();
      renderAll();
    });

    /***********************
     * 换算
     ***********************/
    function computeRMFromTWD(twd){
      const r = Number(state.rate || 1);
      return twd / r;
    }

    function renderConvert(){
      twdInput.value = state.twdStr;

      const twd = toNumber(state.twdStr);
      const rm = computeRMFromTWD(twd);
      rmDisplay.textContent = fmt2(rm);

      inputHint.textContent = twd > 0 ? `${fmtTwd(twd)}` : " ";
      outputHint.textContent = twd > 0 ? `${fmtRm(rm)}` : " ";
    }

    twdInput.addEventListener("input", ()=>{
      state.twdStr = clampDigits(twdInput.value);
      state.expr = state.twdStr;
      renderConvert();
    });

    saveConvertBtn.addEventListener("click", ()=>{
      const twd = toNumber(state.twdStr);
      if(!(twd > 0)) return;
      const rm = computeRMFromTWD(twd);
      const rec = {
        id: `${Date.now()}_conv_${Math.random().toString(16).slice(2)}`,
        ts: Date.now(),
        twd: twd,
        rm: Number(fmt2(rm)),
        rate: Number(state.rate)
      };
      state.records.unshift(rec);
      save();
      outputHint.textContent = "已保存";
      setTimeout(()=>renderConvert(), 650);
    });

    resetBtn.addEventListener("click", ()=>{
      state.twdStr = "0";
      state.expr = "0";
      renderAll();
    });

    /***********************
     * 计算器（新布局已经在 HTML 里按右列运算符排好）
     ***********************/
    function setExpr(next){
      next = String(next);
      if(next.length > 16) next = next.slice(0,16);
      state.expr = next;

      const cleaned = next.replace(/×/g,"*").replace(/÷/g,"/");
      try{
        const safe = cleaned.replace(/[^0-9.+\-*/()]/g,"");
        if(!safe) return;
        // eslint-disable-next-line no-new-func
        const result = Function("return ("+safe+")")();
        if(Number.isFinite(result)){
          if(/^[0-9.]+$/.test(safe)){
            state.twdStr = clampDigits(safe);
          }else{
            state.twdStr = clampDigits(String(result));
          }
          renderConvert();
        }
      }catch(e){}
    }

    calculator.addEventListener("click", (e)=>{
      const btn = e.target.closest(".btn");
      if(!btn) return;
      const k = btn.dataset.k;

      if(k === "AC"){
        state.expr = "0";
        state.twdStr = "0";
        renderConvert();
        return;
      }
      if(k === "BK"){
        let s = String(state.expr || "0");
        s = (s.length <= 1) ? "0" : s.slice(0,-1);
        state.expr = s;
        state.twdStr = clampDigits(s.replace(/[^0-9.]/g,"") || "0");
        renderConvert();
        return;
      }
      if(k === "="){
        setExpr(state.expr);
        return;
      }

      // 额外：00
      if(k === "00"){
        let s = String(state.expr || "0");
        if(s === "0") s = "0";
        else s += "00";
        state.expr = s;
        state.twdStr = clampDigits(s.replace(/[^0-9.]/g,"") || "0");
        renderConvert();
        return;
      }

      const symbol = k;
      let s = String(state.expr || "0");

      if(s === "0" && /[0-9]/.test(symbol)) s = symbol;
      else if(s === "0" && symbol === ".") s = "0.";
      else{
        if(/[+\-*/]$/.test(s) && /[+\-*/]/.test(symbol)){
          s = s.slice(0,-1) + symbol;
        }else{
          s += symbol;
        }
      }
      state.expr = s;
      const maybe = s.replace(/[^0-9.]/g,"");
      if(maybe) state.twdStr = clampDigits(maybe);
      renderConvert();
    });

    /***********************
     * 历史（换算记录）
     ***********************/
    function openHistory(){
      renderHistoryList();
      historyOverlay.classList.add("show");
    }
    function closeHistory(){ historyOverlay.classList.remove("show"); }

    historyBtn.addEventListener("click", openHistory);
    historyClose.addEventListener("click", closeHistory);
    historyClose2.addEventListener("click", closeHistory);
    historyOverlay.addEventListener("click", (e)=>{
      if(e.target === historyOverlay) closeHistory();
    });

    exportBtn.addEventListener("click", ()=>{
      const lines = [];
      lines.push("type, time, rate, twd, rm");
      for(const r of state.records){
        lines.push(["convert", dtStr(r.ts), r.rate, r.twd, r.rm].join(", "));
      }
      lines.push("");
      lines.push("type, time, emo, amount, unit, rate, note");
      for(const v of state.vault){
        const unit = v.kind === "exchange_in" ? "TWD" : "RM";
        lines.push([v.kind, dtStr(v.ts), v.emo, v.amount, unit, v.rate, (v.note||"")].join(", "));
      }
      downloadText("records.txt", lines.join("\n"));
    });

    clearBtn.addEventListener("click", ()=>{
      const ok = confirm("确定清空所有历史记录？（换算 + 金库）");
      if(!ok) return;
      state.records = [];
      state.vault = [];
      ensureDefaultRecord(); // 清空后仍保留默认记录
      save();
      renderAll();
      renderHistoryList();
    });

    function renderHistoryList(){
      historyList.innerHTML = "";
      if(state.records.length === 0){
        historyList.innerHTML = `<div style="padding:18px;border-radius:24px;border:1px dashed rgba(11,19,36,.16);background:rgba(255,255,255,.75);font-weight:900;color:rgba(11,19,36,.50);">暂无记录</div>`;
        return;
      }
      for(const r of state.records){
        const card = document.createElement("div");
        card.className = "recordCard";
        card.innerHTML = `
          <div class="recordTop">
            <div class="left">
              <div class="emo">🔄</div>
              <div style="min-width:0;">
                <div class="recordTitle">换算</div>
                <div class="recordSub">${dtStr(r.ts)} · Rate ${Number(r.rate).toFixed(3)}</div>
              </div>
            </div>
            <div class="recordAmounts">
              <div class="amt">${r.twd}<small>TWD</small></div>
              <div class="amt out">${fmt2(r.rm)}<small>RM</small></div>
            </div>
          </div>
        `;
        card.addEventListener("click", ()=>{
          closeHistory();
          openDetail({type:"record", id:r.id});
        });
        historyList.appendChild(card);
      }
    }

    /***********************
     * 详情弹窗（删除）
     ***********************/
    function openDetail(target){
      detailTarget = target;
      let data = null;

      if(target.type === "record"){
        data = state.records.find(x=>x.id===target.id);
        if(!data) return;
        detailIcon.textContent = "🔄";
        detailTitle.textContent = "换算详情";
        detailSub.textContent = " ";
        detailTwd.innerHTML = `${data.twd} <small>TWD</small>`;
        detailRm.textContent = fmtRm(data.rm);
        detailRate.textContent = `1 : ${Number(data.rate).toFixed(3)}`;
        detailTime.textContent = dtStr(data.ts);
      }else{
        data = state.vault.find(x=>x.id===target.id);
        if(!data) return;
        detailIcon.textContent = data.emo || "🧾";
        detailTitle.textContent = (data.kind==="exchange_in") ? "存入详情" : "开销详情";
        detailSub.textContent = " ";
        if(data.kind==="exchange_in"){
          detailTwd.innerHTML = `${data.amount} <small>TWD</small>`;
          detailRm.textContent = fmtRm(computeRMFromTWD(Number(data.amount)));
        }else{
          detailTwd.innerHTML = `- <small>TWD</small>`;
          detailRm.textContent = fmtRm(Number(data.amount));
        }
        detailRate.textContent = `1 : ${Number(data.rate).toFixed(3)}`;
        detailTime.textContent = dtStr(data.ts);
      }
      detailOverlay.classList.add("show");
    }
    function closeDetail(){
      detailOverlay.classList.remove("show");
      detailTarget = null;
    }
    detailClose.addEventListener("click", closeDetail);
    detailClose2.addEventListener("click", closeDetail);
    detailOverlay.addEventListener("click", (e)=>{
      if(e.target === detailOverlay) closeDetail();
    });

    detailDeleteBtn.addEventListener("click", ()=>{
      if(!detailTarget) return;
      const ok = confirm("确定删除这条记录？");
      if(!ok) return;

      if(detailTarget.type === "record"){
        // 不允许删默认记录（避免你说的“旧记录没了”）
        if(detailTarget.id === "default_3200_twd_40255_rm"){
          alert("这条默认记录用于保留你的历史，不建议删除。");
          return;
        }
        state.records = state.records.filter(x=>x.id!==detailTarget.id);
      }else{
        state.vault = state.vault.filter(x=>x.id!==detailTarget.id);
      }
      save();
      renderAll();
      closeDetail();
    });

    /***********************
     * 金库
     ***********************/
    function computeVaultBalanceTWD(){
      let bal = 0;
      for(const v of state.vault){
        if(v.kind === "exchange_in"){
          bal += Number(v.amount || 0);
        }else{
          bal -= Number(v.amount || 0) * Number(v.rate || state.rate);
        }
      }
      return Math.max(0, Math.round(bal * 100) / 100);
    }

    function renderVault(){
      const bal = computeVaultBalanceTWD();
      vaultBalance.textContent = (Math.abs(bal - Math.round(bal)) < 1e-9) ? String(Math.round(bal)) : String(bal);

      vaultList.innerHTML = "";
      vaultCount.textContent = `${state.vault.length} 条`;

      if(state.vault.length === 0){
        vaultList.innerHTML = `<div style="padding:18px;border-radius:24px;border:1px dashed rgba(11,19,36,.16);background:rgba(255,255,255,.75);font-weight:900;color:rgba(11,19,36,.50);">暂无记录</div>`;
        return;
      }

      for(const v of state.vault){
        const card = document.createElement("div");
        card.className = "recordCard";

        const isIn = v.kind === "exchange_in";
        const title = isIn ? "换汇存入" : "开销";
        const leftEmo = v.emo || (isIn ? "🔄" : "🧾");
        const sub = `${dtStr(v.ts)} · Rate ${Number(v.rate).toFixed(3)}`;

        let leftAmt = isIn ? `${Number(v.amount)}<small>TWD</small>` : `-${fmt2(Number(v.amount))}<small>RM</small>`;
        let rightAmt;
        if(isIn){
          const rm = computeRMFromTWD(Number(v.amount));
          rightAmt = `<div class="amt out">${fmt2(rm)}<small>RM</small></div>`;
        }else{
          const twdImpact = Number(v.amount) * Number(v.rate);
          rightAmt = `<div class="amt out">-${fmt2(twdImpact)}<small>TWD</small></div>`;
        }

        card.innerHTML = `
          <div class="recordTop">
            <div class="left">
              <div class="emo">${leftEmo}</div>
              <div style="min-width:0;">
                <div class="recordTitle">${title}</div>
                <div class="recordSub">${sub}</div>
              </div>
            </div>
            <div class="recordAmounts">
              <div class="amt">${leftAmt}</div>
              ${rightAmt}
            </div>
          </div>
        `;

        card.addEventListener("click", ()=>{
          openDetail({type:"vault", id:v.id});
        });

        vaultList.appendChild(card);
      }
    }

    /***********************
     * 金库弹窗输入
     ***********************/
    const expenseEmojis = [
      {emo:"🍔", name:"吃喝"},
      {emo:"🚗", name:"交通"},
      {emo:"🎡", name:"玩乐"},
      {emo:"🛍️", name:"购物"},
      {emo:"🏨", name:"住宿"},
      {emo:"🧾", name:"杂项"},
    ];

    let vaultMode = "exchange_in";
    let vaultEmo = "🔄";

    function renderEmojiPick(){
      emojiPick.innerHTML = "";
      for(const it of expenseEmojis){
        const b = document.createElement("div");
        b.className = "emoBtn" + (it.emo === vaultEmo ? " active" : "");
        b.innerHTML = `<span style="font-size:20px">${it.emo}</span><span>${it.name}</span>`;
        b.addEventListener("click", ()=>{
          vaultEmo = it.emo;
          renderEmojiPick();
        });
        emojiPick.appendChild(b);
      }
    }

    function sanitizeMoneyInput(s){
      s = String(s ?? "").replace(/[^\d.]/g, "");
      const parts = s.split(".");
      if(parts.length > 2) s = parts[0] + "." + parts.slice(1).join("");
      if(s === "") s = "0";
      if(s.includes(".")) s = s.replace(/^0+(?=\d)/, "0");
      else s = s.replace(/^0+(?=\d)/, "0");
      return s;
    }

    function updateVaultHint(){
      const raw = sanitizeMoneyInput(vaultAmountInput.value);
      if(raw !== vaultAmountInput.value) vaultAmountInput.value = raw;

      const num = Number(raw);
      if(!raw || !Number.isFinite(num) || num <= 0){
        vaultLiveHint.textContent = " ";
        return;
      }

      if(vaultMode === "exchange_in"){
        const rm = computeRMFromTWD(num);
        vaultLiveHint.textContent = `将按 ${fmtRateShort()} 记录 · 约 ${fmtRm(rm)}`;
      }else{
        vaultLiveHint.textContent = `将记录为 ${fmtRm(num)} 的开销`;
      }
    }
    vaultAmountInput.addEventListener("input", updateVaultHint);

    function openVaultModal(mode){
      vaultMode = mode;
      if(mode === "exchange_in"){
        vaultEmo = "🔄";
        vaultModalIcon.textContent = "🔄";
        vaultModalTitle.textContent = "换汇存入";
        vaultModalSub.textContent = "输入数字即可";
        vaultModeChip.innerHTML = `<span class="miniDot" style="background:var(--green);box-shadow:0 0 0 6px rgba(17,185,129,.12)"></span><span>🔄 换汇存入</span>`;
        vaultModeHint.textContent = "输入 TWD";
        vaultInputUnit.textContent = "TWD";
        emojiPick.style.display = "none";
      }else{
        vaultEmo = "🍔";
        vaultModalIcon.textContent = "🧾";
        vaultModalTitle.textContent = "记录开销";
        vaultModalSub.textContent = "用表情选分类，再输入 RM";
        vaultModeChip.innerHTML = `<span class="miniDot" style="background:var(--blue);box-shadow:0 0 0 6px rgba(77,124,255,.12)"></span><span>🧾 记录开销</span>`;
        vaultModeHint.textContent = "输入 RM";
        vaultInputUnit.textContent = "RM";
        emojiPick.style.display = "flex";
        renderEmojiPick();
      }

      vaultAmountInput.value = "";
      vaultLiveHint.textContent = " ";
      vaultOverlay.classList.add("show");
      setTimeout(()=>vaultAmountInput.focus(), 80);
    }
    function closeVaultModal(){ vaultOverlay.classList.remove("show"); }

    btnExchangeIn.addEventListener("click", ()=>openVaultModal("exchange_in"));
    btnExpense.addEventListener("click", ()=>openVaultModal("expense"));
    vaultClose.addEventListener("click", closeVaultModal);
    vaultCancelBtn.addEventListener("click", closeVaultModal);
    vaultOverlay.addEventListener("click", (e)=>{ if(e.target === vaultOverlay) closeVaultModal(); });

    vaultConfirmBtn.addEventListener("click", ()=>{
      const raw = sanitizeMoneyInput(vaultAmountInput.value);
      const num = Number(raw);

      if(!raw || !Number.isFinite(num) || num <= 0){
        alert("请输入大于 0 的数字");
        vaultAmountInput.focus();
        return;
      }

      const rec = {
        id: `${Date.now()}_vault_${Math.random().toString(16).slice(2)}`,
        ts: Date.now(),
        kind: vaultMode,
        amount: vaultMode === "expense" ? Number(fmt2(num)) : Number(raw),
        emo: vaultMode === "expense" ? vaultEmo : "🔄",
        note: "",
        rate: Number(state.rate)
      };

      state.vault.unshift(rec);
      save();
      renderAll();
      closeVaultModal();
    });

    /***********************
     * 总渲染
     ***********************/
    function renderAll(){
      renderRate();
      renderConvert();
      renderVault();
      if(historyOverlay.classList.contains("show")) renderHistoryList();
    }

    /***********************
     * 初始化
     ***********************/
    state.twdStr = clampDigits(state.twdStr);
    state.expr = state.twdStr;

    function setPageInit(){
      setPage("convert");
    }
    setPageInit();
    renderAll();
  </script>
</body>
